name: Check pull request

# Runs the full suite on every pull request so the Supervisor and Tommy see a
# pass or fail before anything is merged. It tests only — it never deploys.
# Deploying stays in pages.yml, which runs when Tommy merges to main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Run the suites
        run: sh verify.sh
