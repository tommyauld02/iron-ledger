name: iOS build

# Compiles the iPhone app on GitHub's Mac whenever a pull request touches the
# native side, unsigned, so a change that would not build in Xcode is caught
# here rather than on Tommy's MacBook or in a TestFlight run. It signs
# nothing, uploads nothing and needs no secrets.

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/make-www.mjs"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/testflight.yml"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Use Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version
      - name: Assemble the app
        run: |
          npm ci
          npm run sync
      - name: Build, unsigned
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
