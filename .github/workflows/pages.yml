name: Deploy to Pages

# mntl-dt.html stays the one source of truth. Pages needs the app at
# index.html, so that copy is made here at deploy time and never committed —
# a second copy in the repo is how this project previously ended up testing
# against a stale build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Run the suites
        run: sh verify.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp mntl-dt.html _site/index.html
          cp manifest.webmanifest sw.js _site/
          # the Privacy Policy and Support URLs in App Store Connect point here
          cp privacy.html support.html terms.html _site/
          cp -r fonts icons vendor media _site/
          echo "built from $(grep -o 'BUILD = \"[^\"]*\"' mntl-dt.html | head -1)"
      # The iPhone app's live updates: the files it ships, each with its
      # SHA-256 and its address here, and the shell it needs (docs/ios.md,
      # "How an update reaches phones"). The files are the ones just copied
      # above; only the manifest is new.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish the live-update manifest
        run: |
          node tools/make-www.mjs --out "$RUNNER_TEMP/bundle" \
            --manifest _site/live/manifest.json \
            --base https://tommyauld02.github.io/iron-ledger/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
