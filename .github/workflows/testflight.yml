name: Build for TestFlight

# Builds the iPhone app on GitHub's Mac and uploads it to App Store Connect,
# where it appears in TestFlight. No MacBook needed. Run it by hand:
#   gh workflow run testflight.yml        (or Actions → Build for TestFlight → Run)
#
# It builds main only, and only after the full suite passes on that same
# commit, in this run — so a build that reaches a phone has passed ./verify.sh.
#
# Signing is automatic: Xcode signs with a distribution certificate Apple
# keeps in the cloud, using an App Store Connect API key. No certificate or
# profile lives in this repo or its secrets. The three secrets are Tommy's to
# create (docs/ios.md); they are written to a file only for the length of the
# build, never printed, and the file is deleted however the job ends.
#
# Version: the marketing version is MARKETING_VERSION in the Xcode project
# (one place; see docs/ios.md). The build number is this workflow's run
# number, which only ever goes up, as App Store Connect requires.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Run the suites
        run: sh verify.sh 8

  build:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Use Xcode 26.6
        run: sudo xcode-select -s "$XCODE" && xcodebuild -version
      - name: Assemble the app
        run: |
          npm ci
          npm run sync
      - name: Check the secrets are there
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/ios.md, 'How an update reaches phones')"
            exit 1
          fi
      - name: Archive, sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$KEY"' EXIT
          umask 077
          # The secret is the .p8 file's text, but a paste rarely arrives
          # byte for byte: a browser form sends its line breaks as CRLF, an
          # editor can add spaces, fold it onto one line or re-wrap it, and a
          # dash can go missing. Apple's tools refuse all of those as
          # invalidPEMDocument (they want 64-character lines exactly), so the
          # key is rebuilt from its body here, checked, and never printed.
          RAW=$(printf '%s\n' "$ASC_KEY_P8" | tr -d '\r')
          case "$RAW" in
            *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) ;;
            *)
              echo "::error::ASC_KEY_P8 must be the whole .p8 file, from the BEGIN PRIVATE KEY line to the END PRIVATE KEY line. See docs/ios.md."
              exit 1 ;;
          esac
          BODY=$(printf '%s\n' "$RAW" | sed -e 's/-*BEGIN PRIVATE KEY-*//' -e 's/-*END PRIVATE KEY-*//' | tr -d ' \t\n')
          if printf '%s' "$BODY" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::ASC_KEY_P8 has characters a .p8 key never holds between its BEGIN and END lines (quotes, long dashes or other editor changes). Set it again straight from the file. See docs/ios.md."
            exit 1
          fi
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$KEY"
          # Right shape, but a character lost or changed in the body still
          # makes a key nothing can read. Say so plainly, before xcodebuild.
          if ! openssl pkey -in "$KEY" -noout > /dev/null 2>&1; then
            echo "::error::ASC_KEY_P8 is shaped like a key but does not read as one: a character in its body is missing or changed. Set it again straight from the .p8 file. See docs/ios.md."
            exit 1
          fi
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $AUTH
          # destination=upload in the options file: export sends it straight
          # to App Store Connect.
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            $AUTH
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$ARCHIVE/Info.plist")
          echo "### Uploaded MNTL D&T $VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from $(grep -o 'BUILD = \"[^\"]*\"' mntl-dt.html | head -1) at ${GITHUB_SHA}. It shows in TestFlight once Apple has processed it, usually 5-15 minutes." >> "$GITHUB_STEP_SUMMARY"
