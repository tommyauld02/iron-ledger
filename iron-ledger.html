<style>
  :root {
    --ground: #E9EBE8;
    --surface: #FFFFFF;
    --surface-2: #F2F4F1;
    --ink: #141A19;
    --ink-2: #4A5551;
    --ink-3: #63706C;
    --rule: #C6CDC9;
    --rule-hard: #141A19;
    --accent: #0B6E63;
    --accent-soft: #D8E8E4;
    --cat-a: #2E5E8C;
    --cat-b: #8C4A2E;
    --cat-c: #5A6E23;
    --danger: #A03327;
    --hit: #3F7A22;
    --hit-bg: #E2EFD6;
    --miss: #A03327;
    --miss-bg: #F4E1DE;
    --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(20, 26, 25, .07), 0 8px 24px -12px rgba(20, 26, 25, .18);

    --font-ui: 'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111614;
      --surface: #191F1D;
      --surface-2: #222927;
      --ink: #E4E9E6;
      --ink-2: #A2AEA9;
      --ink-3: #8B9691;
      --rule: #2E3835;
      --rule-hard: #6D7A76;
      --accent: #56B9A9;
      --accent-soft: #17342F;
      --cat-a: #6FA3D4;
      --cat-b: #D08A65;
      --cat-c: #A3BC5E;
      --danger: #E0796B;
      --hit: #8FC46A;
      --hit-bg: #1E2C18;
      --miss: #E0796B;
      --miss-bg: #2F1D1A;
      --on-accent: #0B1614;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #111614;
    --surface: #191F1D;
    --surface-2: #222927;
    --ink: #E4E9E6;
    --ink-2: #A2AEA9;
    --ink-3: #8B9691;
    --rule: #2E3835;
    --rule-hard: #6D7A76;
    --accent: #56B9A9;
    --accent-soft: #17342F;
    --cat-a: #6FA3D4;
    --cat-b: #D08A65;
    --cat-c: #A3BC5E;
    --danger: #E0796B;
    --hit: #8FC46A;
    --hit-bg: #1E2C18;
    --miss: #E0796B;
    --miss-bg: #2F1D1A;
    --on-accent: #0B1614;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  /* iOS zooms the whole page in the moment you focus a field under 16px, and
     it does not zoom back out. Every field you can type into is 16px or more
     on a touch screen — nothing else in the app is worth the trade. */
  @media (pointer: coarse) {
    input, select, textarea { font-size: 16px !important; }
  }

  /* No 300ms wait before a tap registers, and no zoom on a double tap. */
  button, select, [role="tab"] { touch-action: manipulation; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    /* stops the rubber-band bounce dragging the whole app around */
    overscroll-behavior-y: none;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .app {
    max-width: 540px;
    margin: 0 auto;
    min-height: 100vh;      /* fallback for older iOS */
    min-height: 100dvh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    border-inline: 1px solid var(--rule);
  }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: max(env(safe-area-inset-top), 14px) 16px 10px;
  }
  .app { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .brand h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .brand h1 span {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: .06em;
    text-transform: none;
    color: var(--ink-3);
  }

  .brand .backup-btn {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    min-height: 44px;
    padding: 0 12px;
    margin: -8px -4px -8px 0;
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  .brand .backup-btn:hover { color: var(--accent); border-color: var(--accent); }
  /* Shown when no copy has been taken in a while. Accent, not --miss: nothing
     is broken, there is just something here worth doing. The button's
     aria-label carries the same fact in words — the dot alone says nothing to
     a screen reader. */
  .brand .backup-btn .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 7px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
  }
  .brand .backup-btn[data-due="1"] { color: var(--accent); border-color: var(--accent); }

  .datenav {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 8px;
  }

  .datenav button.arrow {
    height: 44px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-size: 18px;
    line-height: 1;
    color: var(--ink-2);
    background: var(--surface-2);
  }
  .datenav button.arrow:hover { color: var(--accent); border-color: var(--accent); }

  .datelabel { text-align: center; }
  .datelabel .dow {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
  }
  .datelabel .full {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .datelabel button.today {
    display: block;
    margin: 2px auto 0;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .datelabel button.today[hidden] { display: none; }

  /* on an SE the date wrapped to two lines and pushed the app down a row */
  @media (max-width: 360px) {
    .datelabel .full { font-size: 16px; }
    .brand h1 { font-size: 12px; letter-spacing: .1em; }
  }

  /* ---------- main ---------- */
  main {
    flex: 1;
    /* clears the sticky tab bar so the last control is never sitting under it */
    padding: 18px 16px 72px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .eyebrow {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ---------- T chart ---------- */
  /* The foods get the room; the numbers get a narrow T on the right. Head, rows
     and total share one grid so every rule and every digit lines up. */
  .tchart { position: relative; }
  .t-head, .t-row, .t-total {
    display: grid;
    grid-template-columns: 1fr 76px 58px;
    align-items: center;
  }

  .t-head { border-bottom: 2px solid var(--rule-hard); padding-bottom: 6px; }
  .t-head span {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .t-head .h-food { padding-left: 10px; }
  .t-head .h-cal, .t-head .h-pro {
    text-align: center;
    padding: 0 4px;
    font-size: 9px;
    letter-spacing: .08em;
  }
  /* the left edge of the T, and its stem */
  .t-head .h-cal, .t-row .t-cal, .t-total .t-cal,
  .t-head .h-pro, .t-row .t-pro, .t-total .t-pro { border-left: 1px solid var(--rule); }

  /* the food column reads as its own box without boxing every row separately */
  .t-row {
    border-bottom: 1px solid var(--rule);
    background: linear-gradient(to right, var(--surface-2) 0 calc(100% - 134px), transparent 0);
  }

  .t-food {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    padding: 6px 0 6px 10px;
  }
  .t-food .nm {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .t-food .nm.untitled { color: var(--ink-3); }

  .t-cal, .t-pro {
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 4px;
  }
  .t-cal b, .t-pro b {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    font-weight: 500;
  }
  .t-cal b.zero, .t-pro b.zero { color: var(--ink-3); font-weight: 400; }

  .t-del {
    flex: none;
    /* 44px is the smallest reliable thumb target */
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    color: var(--ink-3);
    border-radius: 50%;
  }
  .t-del:hover { color: var(--danger); background: var(--surface); }
  .t-del:active { color: var(--danger); background: var(--miss-bg); transform: scale(.9); }

  .t-total {
    padding-top: 10px;
    margin-top: 3px;
    border-top: 3px double var(--rule-hard);
  }
  .t-total .t-label {
    padding-left: 10px;
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .t-total b {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -.02em;
  }

  .t-note { margin: 0 0 4px; font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* ---------- meals ---------- */
  .drag-hint {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-3);
  }

  /* A press-and-hold picks a row up; a plain swipe still scrolls the list. */
  .t-row { -webkit-touch-callout: none; }
  body.dragging { -webkit-user-select: none; user-select: none; }
  body.dragging .t-row { cursor: grabbing; }

  .t-row.lifted { opacity: .35; }
  .t-row.dropto {
    box-shadow: inset 0 0 0 2px var(--accent);
    border-bottom-color: var(--accent);
  }

  .drag-ghost {
    position: fixed;
    z-index: 60;
    transform: translate(-50%, -140%);
    pointer-events: none;
    max-width: 240px;
    padding: 8px 12px;
    border-radius: 3px;
    background: var(--ink);
    color: var(--surface);
    font-size: 13px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: var(--shadow);
  }

  .t-row.is-meal { background: linear-gradient(to right, var(--accent-soft) 0 calc(100% - 134px), transparent 0); }
  .t-row.is-open { border-bottom-color: var(--accent); }

  .meal-open {
    flex: 1;
    min-width: 0;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 44px;
    justify-content: center;
    padding: 2px 0;
  }
  .meal-open .mn { font-size: 14px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .meal-open .mc {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* the expanded meal spans the whole grid, under its own row */
  .meal-body {
    grid-column: 1 / -1;
    border-top: 1px solid var(--rule);
    background: var(--surface);
    padding: 4px 0 10px 10px;
  }
  /* same two number columns as the chart above, so the digits line up */
  .meal-item {
    display: grid;
    grid-template-columns: 1fr 76px 58px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .meal-item .mi-nm { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
  .meal-item .mi-n {
    text-align: center;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--ink-2);
  }
  .meal-item .mi-out {
    grid-column: 1 / -1;
    justify-self: start;
    min-height: 44px;
    padding: 0 10px 0 0;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .meal-item .mi-out:hover, .meal-item .mi-out:active { color: var(--danger); }

  .meal-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 44px;
    padding: 0 4px 0 0;
    text-align: left;
    font-size: 13px;
    color: var(--ink-2);
  }
  .meal-toggle .box {
    flex: none;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: var(--surface);
    font-size: 13px;
    line-height: 1;
    color: var(--accent);
  }
  .meal-toggle[aria-pressed="true"] { color: var(--ink); }
  .meal-toggle[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent-soft); }

  .meal-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 10px 0 0; }
  .meal-actions button {
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--surface-2);
  }
  .meal-actions button:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- first run ---------- */
  .welcome {
    border: 1px solid var(--accent);
    border-left-width: 3px;
    border-radius: 2px;
    background: var(--surface);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .welcome h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .welcome p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .welcome dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 12px;
    font-size: 13px;
    line-height: 1.45;
  }
  .welcome dt {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    padding-top: 3px;
  }
  .welcome dd { margin: 0; color: var(--ink-2); }

  /* ---------- estimator ---------- */
  .est textarea {
    width: 100%;
    min-height: 76px;
    resize: vertical;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink);
  }
  .est textarea::placeholder { color: var(--ink-3); }

  /* Labelled fields with examples in them, the shape the pantry form uses.
     Amount and Unit share a line because they are one thought; the food gets
     the full width because a name is the longest thing here. Labels are on the
     first row only — every row after it lines up under them. */
  .est-table { display: flex; flex-direction: column; gap: 10px; }
  .et-row {
    display: grid;
    grid-template-columns: 1fr 1fr 44px;
    gap: 4px 8px;
    align-items: center;
  }
  .et-row + .et-row { padding-top: 10px; border-top: 1px solid var(--rule); }
  .et-lab {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .et-wide, .et-f { grid-column: 1 / -1; }
  .et-row input, .et-row select {
    /* A grid item is min-content wide by default, and a select's min-content
       is its longest option — "Pre-made — no weighing" pushed the Unit column
       clean off the right edge of the phone. */
    min-width: 0;
    height: 46px;
    padding: 0 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
  }
  .et-row .et-f { font-family: var(--font-ui); }
  .et-row .et-u { padding: 0 4px; }
  .et-rm {
    height: 44px;
    width: 44px;
    color: var(--ink-3);
    background: none;
    border: 1px solid transparent;
    border-radius: 2px;
  }
  .et-rm:hover { color: var(--miss); border-color: var(--rule); }
  .et-add, .et-swap {
    min-height: 44px;
    padding: 0 12px;
    font-family: var(--font-num);
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--accent);
    background: none;
    border: 1px dashed var(--rule);
    border-radius: 2px;
  }
  .et-swap { border-style: none; text-align: left; padding: 0; }
  .et-add:hover, .et-swap:hover { border-color: var(--accent); }

  .est-note {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-3);
  }

  .working {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-num);
    font-size: 12px;
    color: var(--ink-2);
    padding: 4px 0;
  }
  .working i {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .working i { animation: none; opacity: .7; } }

  .review {
    border: 1px solid var(--accent);
    border-radius: 3px;
    overflow: hidden;
    background: var(--surface);
  }
  .review > header {
    background: var(--accent-soft);
    padding: 9px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .review > header b {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .review > header span {
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-2);
  }
  .rev-item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 4px 10px;
    align-items: center;
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
  }
  .rev-item .food { font-size: 14px; }
  .rev-item .amt {
    grid-column: 1;
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-3);
  }
  /* Only rows with a gram basis get a field here, so the flex row is scoped to
     them — the text-only rows keep flowing as plain inline text. */
  .rev-item .amt.editable {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0 6px;
  }
  .rev-item .amt.editable .pre:empty { display: none; }
  .rev-item .amt.editable input.g {
    width: 62px;
    height: 44px;          /* rule 5: it is tappable, so it is 44px */
    font-size: 14px;
    color: var(--ink);
  }
  .rev-item .amt.editable .g-unit {
    margin-left: -2px;
    display: inline-flex;
    align-items: center;
  }
  .rev-item .amt.editable .g-unit select {
    height: 44px;          /* rule 5: it is tappable, so it is 44px */
    padding: 0 4px;
    font-family: var(--font-num);
    font-size: 14px;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  .rev-item input {
    width: 66px;
    height: 44px;
    padding: 0 7px;
    text-align: right;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }
  .rev-item .unit {
    grid-row: 1 / span 2;
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .rev-units {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    padding: 6px 12px 0;
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .rev-units span:nth-child(2) { width: 66px; text-align: right; }
  .rev-units span:nth-child(3) { width: 66px; text-align: right; }
  .rev-foot {
    padding: 11px 12px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .rev-assume {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-2);
  }
  .rev-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }

  .pending-chip {
    display: inline-block;
    text-align: left;
    margin-top: 3px;
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px dashed var(--rule);
    border-radius: 2px;
    padding: 2px 6px;
    background: var(--surface);
  }
  .est-badge {
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--ink-3);
  }

  .added-flash {
    margin: 0;
    padding: 9px 10px;
    border-left: 3px solid var(--hit);
    background: var(--hit-bg);
    color: var(--hit);
    font-family: var(--font-num);
    font-size: 12px;
    line-height: 1.45;
  }
  .added-flash span {
    display: block;
    color: var(--ink-2);
    font-size: 11px;
    margin-top: 2px;
  }

  .src-tag {
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .src-tag.pantry { color: var(--accent); }
  .src-tag.table { color: var(--ink-3); }
  .src-tag.typical { color: var(--cat-b); }
  .src-tag.claude { color: var(--ink-3); }
  .src-tag.unknown { color: var(--miss); }

  /* ---------- coach ---------- */
  .rt-day {
    border: 1px solid var(--rule);
    border-left: 4px solid var(--daycolor);
    border-radius: 0 3px 3px 0;
    background: var(--surface);
    overflow: hidden;
  }
  .rt-head {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 10px;
    padding: 11px 12px;
  }
  .rt-head .nm { font-size: 15px; font-weight: 600; }
  .rt-head .ct {
    grid-column: 1;
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-3);
  }
  .rt-head .tag {
    grid-row: 1 / span 2;
    grid-column: 2;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--daycolor);
    min-height: 44px;
    display: flex;
    align-items: center;
    padding: 0 4px;
  }
  .rt-moves {
    border-top: 1px solid var(--rule);
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* Naming a day or a movement, in place. Wraps on a narrow phone rather than
     squeezing the field down to nothing. */
  .rt-inline {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    align-items: center;
  }
  /* align-items:center stops these stretching to the row, so without a stated
     height they came out 23px — rule 5 broken on three controls that shipped,
     because a field that only exists after a press is a field nothing measures.
     16px font as well: anything smaller and iOS zooms the page and stays there. */
  .rt-inline .text { min-width: 0; height: 46px; padding: 0 10px; font-size: 16px; }
  .rt-inline .btn { padding: 0 14px; }
  @media (max-width: 359px) {
    .rt-inline { grid-template-columns: 1fr auto; }
    .rt-inline .text { grid-column: 1 / -1; }
  }

  .rt-share { display: flex; flex-direction: column; gap: 9px; }
  .rt-share textarea {
    width: 100%;
    min-height: 92px;
    padding: 10px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-size: 16px;          /* under 16px iOS zooms the page and stays there */
    line-height: 1.4;
    color: var(--ink);
    resize: vertical;
    word-break: break-all;    /* the code is one long unbroken run of base64 */
  }

  .rt-chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
  .rt-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 44px;
    padding: 0 10px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-size: 13px;
    color: var(--ink);
  }
  .rt-chip b { font-weight: 400; }
  .rt-chip i {
    font-style: normal;
    font-family: var(--font-num);
    font-size: 14px;
    color: var(--ink-3);
  }
  .rt-chip:hover, .rt-chip:active { border-color: var(--danger); }
  .rt-chip:hover i, .rt-chip:active i { color: var(--danger); }

  .rt-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .rt-actions button {
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--surface);
  }
  .rt-actions button:hover { color: var(--accent); border-color: var(--accent); }
  /* Distinct at rest, not only on hover. There is no hover on a phone, and
     these actions now sit at the top of the day where the thumb lands first —
     a delete that looks exactly like a rename is a mis-tap waiting to happen,
     even with undo behind it. */
  .rt-actions button.danger { color: var(--danger); }
  .rt-actions button.danger:hover { border-color: var(--danger); }

  .lib-group { border-top: 1px solid var(--rule); padding-top: 10px; }
  .lib-group h4 {
    margin: 0 0 7px;
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .lib-add {
    min-height: 44px;
    padding: 0 10px;
    border: 1px dashed var(--rule);
    border-radius: 2px;
    background: var(--surface);
    font-size: 13px;
    color: var(--ink-2);
  }
  .lib-add:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
  .lib-add[disabled] { opacity: .4; }

  /* ---------- pantry ---------- */
  /* Three rows — name, macros, sub-line — stacked in the middle column, with
     the + spanning all three on the left and Remove spanning the first two on
     the right. Every cell is placed explicitly; leaving them to auto-placement
     around the two spanning buttons is what made this hard to read before. */
  .pan-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 3px 12px;
    align-items: baseline;
    padding: 11px 2px;
    border-bottom: 1px solid var(--rule);
  }
  .pan-item .add {
    grid-column: 1;
    grid-row: 1 / -1;
    align-self: center;
    min-width: 44px;
    min-height: 44px;
    font-family: var(--font-num);
    font-size: 20px;
    line-height: 1;
    color: var(--accent);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  .pan-item .add:hover, .pan-item .add:active {
    color: var(--on-accent);
    background: var(--accent);
    border-color: var(--accent);
  }
  /* Held for 1.4s after a tap. Adding from here lands the row on a tab you
     cannot see, so the button itself has to say it worked — rule 3. */
  .pan-item .add.is-done {
    color: var(--on-accent);
    background: var(--hit);
    border-color: var(--hit);
  }
  /* A record with impossible numbers gets no +; this keeps the rest aligned. */
  .pan-item .add-gap { grid-column: 1; grid-row: 1 / -1; min-width: 44px; }
  .pan-item .nm { grid-column: 2; grid-row: 1; font-size: 15px; font-weight: 500; }
  .pan-item .macros {
    grid-column: 2;
    grid-row: 2;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .pan-item .sub {
    grid-column: 2 / -1;
    grid-row: 3;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--ink-3);
  }
  .pan-item .rm {
    grid-row: 1 / 3;
    grid-column: 3;
    align-self: center;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    min-height: 44px;
    padding: 0 10px;
    margin-right: -10px;
  }
  .pan-item .rm:hover, .pan-item .rm:active { color: var(--danger); }

  .photo-btn {
    display: block;
    width: 100%;
    /* Padding alone left this at 43px on Linux and 44px on Windows — font
       metrics differ per platform, so rule 5 was one pixel from being broken
       on a device nobody was measuring. Height is stated, not inferred. */
    min-height: 44px;
    padding: 13px;
    border: 1px dashed var(--accent);
    border-radius: 2px;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--font-num);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-align: center;
  }
  .photo-btn:hover { filter: brightness(.97); }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* ---------- goal strip ---------- */
  .goalbar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 12px;
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }
  .goalbar::before {
    content: "";
    position: absolute;
    left: 50%; top: 10px; bottom: 0;
    width: 1px;
    background: var(--rule);
    transform: translateX(-.5px);
  }
  .goalcell { padding: 0 16px; display: flex; flex-direction: column; gap: 5px; }
  .goalcell.left { text-align: right; align-items: flex-end; }
  .goalcell.right { text-align: left; align-items: flex-start; }
  .goaltarget {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-2);
  }
  .goaltarget .dir { font-weight: 600; }
  .goalstat {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .04em;
  }
  .goalstat.hit { color: var(--hit); }
  .goalstat.miss { color: var(--miss); }
  .goalstat.none { color: var(--ink-3); }
  .meter {
    width: 100%;
    height: 3px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter i { display: block; height: 100%; background: var(--ink-3); }
  .meter i.hit { background: var(--hit); }
  .meter i.miss { background: var(--miss); }

  .goaledit-open {
    display: block;
    width: 100%;
    margin-top: 10px;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    min-height: 44px;
    padding: 7px;
    border: 1px dashed var(--rule);
    border-radius: 2px;
  }
  .goaledit-open:hover { color: var(--accent); border-color: var(--accent); }

  .dirtoggle { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .dirtoggle button {
    height: 46px;
    border: 1px solid var(--rule);
    font-family: var(--font-num);
    font-size: 12px;
    color: var(--ink-3);
    background: var(--surface);
  }
  .dirtoggle button:first-child { border-radius: 2px 0 0 2px; }
  .dirtoggle button:last-child { border-radius: 0 2px 2px 0; margin-left: -1px; }
  .dirtoggle button[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--accent);
    background: var(--accent-soft);
    position: relative;
    z-index: 1;
  }

  /* ---------- year calendar ---------- */
  .yearnav {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 8px;
  }
  .yearnav button {
    height: 44px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink-2);
    font-size: 15px;
  }
  .yearnav button:hover { color: var(--accent); border-color: var(--accent); }
  .yearnav .y {
    text-align: center;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  /* Four tiles, so two rows of two. Three columns left the fourth sitting
     alone against two thirds of bare grid. */
  .yearstats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .yearstats div { background: var(--surface); padding: 9px 8px; text-align: center; }
  .yearstats b {
    display: block;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 19px;
    font-weight: 600;
  }
  .yearstats span {
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .months { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 14px; }
  @media (min-width: 470px) { .months { grid-template-columns: repeat(3, 1fr); } }

  .month h4 {
    margin: 0 0 5px;
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .month.is-now h4 { color: var(--accent); }
  .dow-row, .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .dow-row span {
    font-family: var(--font-num);
    font-size: 8px;
    text-align: center;
    color: var(--ink-3);
    padding-bottom: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border-radius: 2px;
    background: var(--surface-2);
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 9px;
    line-height: 1;
    color: var(--ink-3);
    padding: 0;
    border: 1px solid transparent;
  }
  .cal-cell.blank { background: none; }
  .cal-cell.hit { background: var(--hit-bg); color: var(--hit); font-weight: 600; }
  .cal-cell.miss { background: var(--miss-bg); color: var(--miss); font-weight: 600; }
  .cal-cell.future { background: none; color: var(--ink-3); opacity: .45; }
  .cal-cell.is-today {
    border-color: var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
    color: var(--ink);
    font-weight: 700;
  }
  .cal-cell:not(.blank):hover { border-color: var(--accent); }
  .cal-cell .bar {
    width: 60%;
    height: 2px;
    border-radius: 1px;
    background: var(--barcolor, transparent);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--ink-3);
    padding-top: 2px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i {
    width: 10px; height: 10px;
    border-radius: 2px;
    display: inline-block;
  }
  .legend i.line { height: 3px; width: 12px; border-radius: 1px; }

  .empty {
    padding: 22px 8px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-3);
    line-height: 1.6;
  }

  /* ---------- entry forms ---------- */
  .entry {
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .entry .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .field input, .field select {
    width: 100%;
    height: 46px;
    padding: 0 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
  }
  .field input.text { font-family: var(--font-ui); font-size: 15px; }
  .field select { font-family: var(--font-ui); font-size: 15px; }
  .field input::placeholder { color: var(--ink-3); }

  .btn {
    height: 46px;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 2px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-family: var(--font-num);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost {
    background: none;
    color: var(--ink-2);
    border: 1px solid var(--rule);
  }
  .btn.ghost:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- gym ---------- */
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat {
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 9px 6px;
    text-align: center;
    line-height: 1.25;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    background: var(--surface);
  }
  .cat .tag {
    display: block;
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .16em;
    margin-bottom: 3px;
    color: var(--catcolor);
  }
  .cat[aria-pressed="true"] {
    border-color: var(--catcolor);
    box-shadow: inset 0 0 0 1px var(--catcolor);
    color: var(--ink);
  }
  /* min-height keeps the + box the same size as the splits beside it even
     though it carries one word instead of two lines. */
  .cat { min-height: 52px; }
  .cat-add {
    --catcolor: var(--accent);
    border-style: dashed;
    color: var(--accent);
  }
  .cat-add .tag { font-size: 13px; letter-spacing: 0; }

  .split-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .split-head button {
    min-height: 44px;
    padding: 0 10px;
    margin-right: -10px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px solid transparent;
    border-radius: 2px;
  }
  .split-head button:hover { color: var(--accent); border-color: var(--rule); }

  .split-list { display: flex; flex-direction: column; gap: 8px; }
  .split-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
  }
  .split-tag {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    color: var(--catcolor);
    min-width: 12px;
  }
  .split-name {
    height: 46px;              /* 16px font: never lets iOS zoom the page */
    padding: 0 10px;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    min-width: 0;
  }
  .split-rm {
    min-height: 44px;
    padding: 0 12px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 2px;
    white-space: nowrap;
  }
  .split-rm:hover { color: var(--danger); border-color: var(--danger); }
  /* The last split cannot go: with none left there is nothing to log under. */
  .split-keep {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-3);
    white-space: nowrap;
  }

  .split-new { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
  .split-new .btn { padding: 0 14px; }

  .liftgroup { display: flex; flex-direction: column; gap: 12px; }

  .lift {
    display: grid;
    grid-template-columns: 5px 1fr;
    gap: 0 12px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-left: none;
    border-radius: 0 3px 3px 0;
    overflow: hidden;
  }
  .lift .spine { background: var(--catcolor); }
  .lift .body { padding: 11px 12px 12px 0; min-width: 0; }

  .lift-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .lift-head h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.005em;
  }
  .lift-head .cattag {
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--catcolor);
    white-space: nowrap;
  }

  .lift .last {
    margin: 4px 0 0;
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-3);
    overflow-wrap: anywhere;
  }
  .lift .last em { font-style: normal; color: var(--ink-2); }

  .sets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 9px;
  }
  .set {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    padding: 0 13px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink);
    white-space: nowrap;
  }
  .set .x { color: var(--ink-3); margin: 0 1px; }
  /* Scoped to buttons: a locked day renders its chips as spans, and a chip you
     cannot remove must not offer the remove cue. */
  button.set:hover { border-color: var(--danger); color: var(--danger); }
  button.set:hover .x { color: var(--danger); }

  /* The card is the finished state and persists; the confetti is the moment
     and does not. accent, not --hit: the hit tokens mean "macro target met" on
     the calendar, and a finished workout is a different thing entirely. --hit
     on --hit-bg also measured 4.37:1 here, under the 4.5 this size needs. */
  .daydone {
    display: flex;
    flex-direction: column;
    gap: 13px;
    padding: 14px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 2px;
  }
  .daydone .dd-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .daydone .dd-title {
    font-family: var(--font-num);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .daydone .dd-head button {
    min-height: 44px;
    padding: 0 12px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    white-space: nowrap;
  }
  .daydone .dd-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .daydone .dd-stats div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .daydone .dd-time {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* The running clock. Reads as a state you are in, not a button to press —
     the only control on it is the way out. */
  .workout {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: var(--surface-2);
  }
  .workout.is-running { border-color: var(--accent); background: var(--accent-soft); }
  /* Past saving. Not an error — nothing broke, there is just nothing worth
     keeping — so it drops back to the resting surface rather than going red. */
  .workout.is-stale { border-color: var(--rule); background: var(--surface-2); }
  .workout.is-stale .wo-clock { color: var(--ink-2); }
  .wo-note { margin: 6px 2px 0; font-size: 12px; color: var(--ink-2); }
  .workout .wo-label {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .workout .wo-clock {
    flex: 1;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    color: var(--ink);
  }
  .workout button {
    flex: none;
    min-height: 44px;
    padding: 0 12px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    white-space: nowrap;
  }
  .workout button:hover { color: var(--accent); border-color: var(--accent); }
  .daydone .dd-stats b {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    color: var(--ink);
  }
  .daydone .dd-stats span {
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .confetti {
    position: fixed;
    inset: 0;
    z-index: 60;            /* over the tab bar, which sits at 20 */
    pointer-events: none;   /* never intercepts a tap */
    overflow: hidden;
  }
  .confetti i {
    position: absolute;
    top: -14px;
    width: 7px;
    height: 11px;
    border-radius: 1px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    from { transform: translate3d(0, -6vh, 0) rotate(0deg); }
    to   { transform: translate3d(var(--dx, 0), 112vh, 0) rotate(var(--spin, 540deg)); }
  }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

  .setadd {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 6px;
    margin-top: 9px;
    align-items: center;
  }
  .setadd input {
    height: 46px;
    padding: 0 8px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    width: 100%;
  }
  .setadd button {
    height: 46px;
    min-width: 56px;
    padding: 0 14px;
    border: 1px solid var(--catcolor);
    color: var(--catcolor);
    border-radius: 2px;
    font-family: var(--font-num);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .setadd button:hover { background: var(--catcolor); color: var(--surface); }

  .lift-foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px solid var(--rule);
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-3);
  }
  .lift-foot button {
    font: inherit;
    color: var(--ink-3);
    min-height: 44px;
    padding: 0 10px;
    margin-right: -10px;
  }
  .lift-foot button:hover, .lift-foot button:active { color: var(--danger); }

  .daysum {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-3);
    padding-top: 2px;
  }
  .daysum b { color: var(--ink-2); font-weight: 500; }

  /* ---------- history ---------- */
  .histrow {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    align-items: center;
    text-align: left;
    padding: 12px 2px;
    border-bottom: 1px solid var(--rule);
  }
  .histrow:hover { background: var(--surface-2); }
  .histrow .d { font-size: 14px; font-weight: 500; }
  .histrow .m {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .histrow .w {
    grid-column: 1 / -1;
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-3);
  }
  .histrow .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: 1px;
  }

  /* ---------- backup sheet ---------- */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(20, 26, 25, .55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet[hidden] { display: none !important; }
  .sheet-inner {
    width: 100%;
    max-width: 540px;
    max-height: 88dvh;
    overflow-y: auto;
    background: var(--surface);
    border-top: 3px solid var(--accent);
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sheet-inner h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .sheet-inner p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .sheet-inner textarea {
    width: 100%;
    height: 150px;
    resize: vertical;
    padding: 10px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-size: 11px;
    line-height: 1.5;
    color: var(--ink);
  }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---------- undo ---------- */
  /* One sticky dock at the bottom. The savebar, the undo bar and the tab bar
     were each sticky at bottom:0, which stacked them on top of one another —
     elementFromPoint at the tab bar's centre returned the undo bar, so undo
     had always been covering navigation. Docking them makes them stack. */
  .dock { position: sticky; bottom: 0; z-index: 25; }

  /* Shown while writes are failing. Sits above the undo bar because it is not
     an offer, it is a warning: nothing logged from here survives closing the
     app. It stays put until a write succeeds — a toast would be missed, and
     this is the one thing in the app that must not be missed. */
  .savebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: var(--miss);
    color: #FFFFFF;
    font-family: var(--font-num);
    font-size: 12px;
    line-height: 1.35;
  }
  .savebar[hidden] { display: none !important; }
  .savebar button {
    flex: none;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid #FFFFFF;
    border-radius: 2px;
    color: #FFFFFF;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .undobar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--surface);
    font-family: var(--font-num);
    font-size: 12px;
  }
  .undobar[hidden] { display: none !important; }
  .undobar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .undobar button {
    flex: none;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid var(--surface);
    border-radius: 2px;
    color: var(--surface);
    font-family: var(--font-num);
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .undobar button:active { background: var(--surface); color: var(--ink); }

  /* ---------- tabs ---------- */
  .tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: var(--surface);
    border-top: 1px solid var(--rule);
    padding-bottom: max(env(safe-area-inset-bottom), 4px);
  }
  .tabs button {
    min-height: 48px;
    padding: 12px 2px 13px;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    border-top: 2px solid transparent;
    margin-top: -1px;
  }
  .tabs button[aria-selected="true"] {
    color: var(--accent);
    border-top-color: var(--accent);
  }

  @media (prefers-reduced-motion: no-preference) {
    .t-row, .lift { animation: rise .18s ease-out; }
    @keyframes rise { from { opacity: .4; transform: translateY(-3px); } }
  }
</style>

<div class="app">

<script>
(function () {
  "use strict";

  var KEY = "iron-ledger-v1";

  // A routine is a list of training days. It is the ONLY place a split is

  // keep their original ids so workouts logged before routines existed still
  // resolve to the right day.

  var DEFAULT_ROUTINE = {

  var SEED_MOVES = {

  var LIBRARY = [
    { g: "Chest", m: ["Bench Press", "Incline Bench Press", "Decline Bench Press", "Dumbbell Bench Press",
        "Incline DB Press", "Machine Chest Press", "Cable Fly", "Pec Deck", "Dumbbell Fly",
        "Dip", "Push-Up", "Svend Press"] },
    { g: "Back", m: ["Deadlift", "Barbell Row", "Pendlay Row", "T-Bar Row", "Seated Cable Row",

    { g: "Quads", m: ["Back Squat", "Front Squat", "Hack Squat", "Leg Press", "Bulgarian Split Squat",
        "Walking Lunge", "Reverse Lunge", "Step-Up", "Leg Extension", "Goblet Squat", "Sissy Squat"] },
    { g: "Hamstrings", m: ["Romanian Deadlift", "Stiff-Leg Deadlift", "Lying Leg Curl", "Seated Leg Curl",
        "Nordic Curl", "Good Morning", "Glute-Ham Raise"] },
    { g: "Glutes", m: ["Hip Thrust", "Glute Bridge", "Cable Kickback", "Sumo Deadlift",
        "Bulgarian Split Squat", "Abduction Machine"] },
    { g: "Calves", m: ["Standing Calf Raise", "Seated Calf Raise", "Leg Press Calf Raise", "Donkey Calf Raise"] },
    { g: "Core", m: ["Hanging Leg Raise", "Cable Crunch", "Plank", "Ab Wheel", "Russian Twist",

  function ymd(d) {
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function parseYmd(s) {
    var p = s.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  var TODAY = ymd(new Date());

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") store = parsed;
      }
    } catch (e) { /* fresh start */ }
    if (!store.days) store.days = {};
    if (!store.moves) store.moves = JSON.parse(JSON.stringify(SEED_MOVES));
    store.goal = normGoal(store.goal);   // repairs a partial goal instead of tripping on it
    if (!store.region) store.region = "United States";
    if (!store.pantry) store.pantry = [];
    if (!store.retired) store.retired = {};
    // Rows are addressed by id, so make sure every one has one.
    Object.keys(store.days).forEach(function (k) {
      (store.days[k].food || []).forEach(function (f) {
        if (!f.id) f.id = uid();
        if (f.items) f.items.forEach(function (x) { if (!x.id) x.id = uid(); });
      });
    });
    if (!store.routine || !store.routine.days || !store.routine.days.length) {
      store.routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
    }
    store.routine.days.forEach(function (dy) {
      if (!store.moves[dy.id]) store.moves[dy.id] = (SEED_MOVES[dy.id] || []).slice();
    });
  }

  // Set while writes are failing, cleared the moment one succeeds. This used
  // to be an empty catch, which meant the app confirmed "✓ Added" for entries
  // that were never written and vanished on the next load. A silent success
  // reads like a dead button; a *confirmed* success that silently failed is
  // worse, because nothing looks wrong until the data is already gone.
  var saveError = null;

  function save() {
    store.build = BUILD;   // so a backup always says which version wrote it
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
      saveError = null;
    } catch (e) {
      // Quota, private browsing, storage restrictions — the reason does not
      // matter to the caller. The write did not happen.
      saveError = (e && e.name) ? e.name : "storage unavailable";
      lastError = "save failed (" + saveError + ")";
      queueSync();           // the cloud mirror may still be reachable
      refreshSaveBar();
      return false;
    }
    queueSync();
    refreshSaveBar();
    return true;
  }

  function refreshSaveBar() {
    var bar = document.getElementById("savebar");
    var label = document.getElementById("saveLabel");
    if (!bar || !label) return;
    bar.hidden = !saveError;
    if (saveError) {
      label.textContent = saveError === "QuotaExceededError"
        ? "Storage on this phone is full — nothing is being saved. Copy your backup out now."
        : "This phone is not letting the app save — nothing you log now will be kept.";
    }
  }

  function day(key) {
    if (!store.days[key]) store.days[key] = { food: [], lifts: [], updated: 0 };
    var d = store.days[key];
    if (!d.food) d.food = [];
    if (!d.lifts) d.lifts = [];
    return d;
  }
  function touch(key) { day(key).updated = Date.now(); }

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function num(v) { var n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; }
  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
  // The active routine's days, decorated for display.
  function cats() {
    var days = (store.routine && store.routine.days) ? store.routine.days : DEFAULT_ROUTINE.days;
    return days.map(function (d, i) {
      return {
        id: d.id,
        tag: String.fromCharCode(65 + i),
        name: d.name,
        short: d.short || d.name,
        color: DAY_COLORS[i % DAY_COLORS.length]
      };
    });
  }

  // A workout logged under a day that has since been renamed away or deleted
  // must still say what it was — never silently relabel it as another day.
  function cat(id) {
    var found = cats().filter(function (c) { return c.id === id; })[0];
    if (found) return found;
    // The day is gone from the routine, but the workout still happened. Look up
    // the name it was logged under so old sessions read the way they were logged.
    var was = (store.retired && store.retired[id]) || "Removed day";
    return { id: id, tag: "–", name: was, short: was,
             color: "var(--ink-3)", gone: true };
  }

  // Splits are edited from two places — the chips on the Gym tab and the
  // builder on Coach — so the three operations live here once. A second
  // implementation is how the two would quietly drift apart, and only one of
  // them would remember to write store.retired.
  function shortName(n) { return n.length > 18 ? n.slice(0, 17) + "…" : n; }

  // ---------- how long the workout took ----------
  // d.workoutStart is a timestamp while it runs; d.workoutMs is what has been
  // banked. They add, so a second session on the same day tops up the first
  // rather than replacing it.
  function workoutMs(d) {
    var banked = Number(d && d.workoutMs) || 0;
    if (d && d.workoutStart) banked += Math.max(0, Date.now() - d.workoutStart);
    return banked;
  }

  function fmtDur(ms) {
    var total = Math.round(ms / 1000);
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), sec = total % 60;
    function pad(n) { return n < 10 ? "0" + n : String(n); }
    return h ? h + ":" + pad(m) + ":" + pad(sec) : m + ":" + pad(sec);
  }

  // Short form for places with no room for a ticking clock — a calendar
  // tooltip, a stat tile.
  function fmtDurShort(ms) {
    var mins = Math.round(ms / 60000);
    if (mins < 60) return mins + " min";
    var h = Math.floor(mins / 60), m = mins % 60;
    return m ? h + "h " + m + "m" : h + "h";
  }

  // Banks whatever is running. Called when the day is locked in, and before
  // anything else that needs a final number.
  // Longer than this and the clock was forgotten, not trained. Six hours is
  // generous for the longest real day anyone has in a gym.
  var MAX_SESSION_MS = 6 * 3600 * 1000;

  // Banks whatever is running. Called when the day is locked in, and when
  // midnight moves on without anyone having pressed anything.
  //
  // A clock left running overnight is not a twenty hour workout. Banking one
  // would put a confident wrong number on the calendar and drag the year's
  // average with it, so an implausible run is dropped rather than written —
  // the same call the label reader makes when it leaves a field it could not
  // read empty. The day keeps its lifts; it just does not claim a duration.
  function stopWorkout(d) {
    if (!d || !d.workoutStart) return;
    var ran = Math.max(0, Date.now() - d.workoutStart);
    delete d.workoutStart;
    if (ran <= MAX_SESSION_MS) d.workoutMs = (Number(d.workoutMs) || 0) + ran;
  }

  function addSplit(name) {
    var n = (name || "").trim();
    if (!n) return null;
    var id = "d" + uid();
    store.routine.days.push({ id: id, name: n, short: shortName(n) });
    store.moves[id] = [];       // a new split starts empty; nothing is assumed
    save();
    return id;
  }

  function renameSplit(id, name) {
    var n = (name || "").trim();
    var dy = store.routine.days.filter(function (x) { return x.id === id; })[0];
    if (!n || !dy || dy.name === n) return false;
    dy.name = n;
    dy.short = shortName(n);
    // Not touching store.retired: the split still exists, so every workout
    // logged under it follows the new name. Rule 7 only bites on deletion.
    save();
    return true;
  }

  function removeSplit(id) {
    var idx = -1;
    store.routine.days.forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx === -1) return false;
    var gone = store.routine.days[idx];
    var goneMoves = store.moves[id];
    store.routine.days.splice(idx, 1);
    // Remember what it was called so workouts logged under it stay readable
    // instead of being relabelled as a day you still train.
    store.retired[id] = gone.name;
    if (coachOpen === id) coachOpen = null;
    if (activeCat === id && store.routine.days.length) activeCat = store.routine.days[0].id;
    save(); render();
    offerUndo("Deleted " + gone.name, function () {
      store.routine.days.splice(Math.min(idx, store.routine.days.length), 0, gone);
      if (goneMoves) store.moves[id] = goneMoves;
      delete store.retired[id];
      activeCat = id;
      save(); render();
    });
    return true;
  }

  // ---------- sharing a routine ----------
  // A routine is the days plus what is in each day. Sharing one must never
  // touch the log, and must never carry ids across. DEFAULT_ROUTINE uses fixed
  // ones — back, push, legs — so two people who never renamed their days hold
  // the same ids for different days; importing under those ids would relabel
  // the recipient's own history, which is rule 7 broken silently. The export
  // therefore carries no ids at all and the importer mints fresh ones, so a
  // collision is not guarded against, it is impossible.
  var ROUTINE_TAG = "ILROUTINE1:";

  function exportRoutine() {
    var days = (store.routine.days || []).map(function (dy) {
      return { name: dy.name, moves: (store.moves[dy.id] || []).slice() };
    });
    var payload = { name: store.routine.name || "My split", days: days };
    var json = JSON.stringify(payload);
    try {
      // base64 so it survives being sent through a messaging app, where raw
      // JSON meets smart quotes and line wrapping
      return ROUTINE_TAG + btoa(unescape(encodeURIComponent(json)));
    } catch (e) {
      return json;
    }
  }

  // Liberal about what it accepts: the code with or without its tag, wrapped
  // over several lines, or plain JSON if someone pasted that instead.
  function parseRoutineCode(text) {
    var raw = String(text || "").trim();
    if (!raw) return null;
    var body = raw.indexOf(ROUTINE_TAG) === 0 ? raw.slice(ROUTINE_TAG.length) : raw;
    var tries = [];
    try { tries.push(JSON.parse(decodeURIComponent(escape(atob(body.replace(/\s+/g, "")))))); } catch (e) {}
    try { tries.push(JSON.parse(raw)); } catch (e) {}
    for (var i = 0; i < tries.length; i++) {
      var got = tries[i];
      if (got && got.days && got.days.length) return got;
    }
    return null;
  }

  function importRoutine(payload) {
    var before = {
      days: store.routine.days.slice(),
      moves: JSON.parse(JSON.stringify(store.moves))
    };
    var added = 0;
    (payload.days || []).forEach(function (dy) {
      var name = String(dy.name || "").trim();
      if (!name) return;
      var id = "d" + uid();                 // fresh, never theirs
      store.routine.days.push({ id: id, name: name, short: shortName(name) });
      store.moves[id] = (dy.moves || [])
        .filter(function (m) { return m && String(m).trim(); })
        .map(function (m) { return String(m).trim(); });
      added++;
    });
    if (!added) return 0;
    save(); render();
    // Added, not replaced — your own days are untouched, and this is undoable
    // like anything else that changes the routine.
    offerUndo("Added " + added + (added === 1 ? " day" : " days") + " from a shared routine",
      function () {
        store.routine.days = before.days;
        store.moves = before.moves;
        save(); render();
      });
    return added;
  }

  // A meal is a row that holds other rows. Its numbers are always read through
  // from what is inside it, so a meal can never drift out of step with its items.
  function isMeal(f) { return !!(f && f.items); }

  function rowCal(f) {
    if (!isMeal(f)) return f.cal || 0;
    var s = 0; f.items.forEach(function (x) { s += x.cal || 0; }); return s;
  }
  function rowPro(f) {
    if (!isMeal(f)) return f.pro || 0;
    var s = 0; f.items.forEach(function (x) { s += x.pro || 0; }); return s;
  }
  function autoMealName(items) {
    var named = items.map(function (x) { return (x.note || "").trim(); }).filter(Boolean);
    if (!named.length) return "Meal";
    if (named.length <= 2) return named.join(" + ");
    return named[0] + " + " + (named.length - 1) + " more";
  }
  function rowNote(f) {
    if (!isMeal(f)) return f.note || "";
    return f.note || autoMealName(f.items);
  }

  // Finds a row anywhere in the day — at the top level, or inside a meal.
  function locate(d, id) {
    for (var i = 0; i < d.food.length; i++) {
      if (d.food[i].id === id) {
        return { list: d.food, idx: i, row: d.food[i], meal: null };
      }
      var items = d.food[i].items;
      if (items) {
        for (var j = 0; j < items.length; j++) {
          if (items[j].id === id) {
            return { list: items, idx: j, row: items[j], meal: d.food[i] };
          }
        }
      }
    }
    return null;
  }

  // Anything a meal holds is a plain entry, never another meal — combining a
  // meal with something else flattens rather than nesting.
  function asItems(f) { return isMeal(f) ? f.items.slice() : [f]; }

  function totals(d) {
    var cal = 0, pro = 0;
    d.food.forEach(function (f) { cal += rowCal(f); pro += rowPro(f); });
    return { cal: cal, pro: pro };
  }

  // A day is judged against the goal that was in force when it was logged,
  // so changing your target today never rewrites last month's verdicts.
  // Always hand back a complete goal. A half-written one used to throw while
  // drawing the Macros screen, which killed every handler wired after it.
  function normGoal(g) {
    g = g || {};
    var c = g.cal || {}, p = g.pro || {};
    return {
      cal: { dir: c.dir === "+" ? "+" : "-",
             v: Number(c.v) > 0 ? Number(c.v) : DEFAULT_GOAL.cal.v },
      pro: { dir: p.dir === "-" ? "-" : "+",
             v: Number(p.v) > 0 ? Number(p.v) : DEFAULT_GOAL.pro.v }
    };
  }

  function goalFor(key) {
    var d = store.days[key];
    return normGoal((d && d.goal) ? d.goal : store.goal);
  }

  function stampGoal(key) {
    var d = day(key);
    if (!d.goal) d.goal = normGoal(store.goal);
  }

  // "met" for a + goal means at or above; for a − goal, at or below.
  function meets(g, total) {
    return g.dir === "+" ? total >= g.v : total <= g.v;
  }

  function goalText(g, total) {
    var diff = Math.abs(total - g.v);
    if (g.dir === "+") {
      return total >= g.v
        ? (diff ? "over by " + fmt(diff) : "exactly on")
        : "short by " + fmt(diff);
    }
    return total <= g.v
      ? (diff ? "under by " + fmt(diff) : "exactly on")
      : "over by " + fmt(diff);
  }

  function pendingCount(d) {
    var n = 0;
    (d && d.food ? d.food : []).forEach(function (f) {
      n += isMeal(f) ? f.items.filter(function (x) { return x.pending; }).length
                     : (f.pending ? 1 : 0);
    });
    return n;
  }

  // 'none' = nothing to judge yet: no food logged, or something still
  // waiting on an estimate, which would make the totals a lie.
  function verdict(key) {
    var d = store.days[key];
    if (!d || !d.food || !d.food.length) return "none";
    if (pendingCount(d)) return "none";
    var g = goalFor(key), t = totals(d);
    return (meets(g.cal, t.cal) && meets(g.pro, t.pro)) ? "hit" : "miss";
  }

    var food = matchFood(p.name) || matchFood(p.whole);
    if (!food) return null;

    var grams = null, amount = "", showGrams = true, assumed = false, typedUnit = null;
    if (p.unit && p.unit.kind === "weight") {
      grams = (p.qty || 1) * p.unit.grams;
      var label = p.unit.grams === 1 ? "g" : p.unit.grams === 28.3495 ? "oz"
                : p.unit.grams === 453.592 ? "lb" : "kg";
      // Say it back in the unit it was said in. Someone who typed "6 oz" and
      // is shown 170 g has to do arithmetic to check their own entry.
      if (WEIGH[label]) typedUnit = label;
      amount = (p.qty || 1) + " " + label;
      showGrams = label !== "g";                   // don't print grams twice
    } else if (p.unit && p.unit.kind === "portion") {
      var per = food.u && food.u[p.unit.key];
      if (!per) return null;                       // unit we can't weigh for this food
      grams = (p.qty || 1) * per;
      amount = (p.qty || 1) + " " + p.unit.key + (p.qty > 1 ? "s" : "");
    } else if (p.qty && food.u && (food.u.each || food.u.slice)) {
      var one = food.u.each || food.u.slice;
      grams = p.qty * one;
      amount = p.qty + " × " + Math.round(one) + " g";
      showGrams = false;
    } else if (food.d) {
      // No amount given — fall back to a typical serving so "chicken and rice"
      // still produces a number. Flagged as an assumption you can edit.
      var n = p.qty || 1;
      grams = n * food.d;
      assumed = true;
      if (n > 1) {
        amount = n + " × " + Math.round(food.d) + " g";
        showGrams = false;
      } else {
        amount = "";                               // the tag already says "typical serving"
      }
    } else if (!p.qty && food.u && food.u.serving) {
      grams = food.u.serving;
      amount = "1 serving";
    } else {
      return null;                                 // nothing we can size it by
    }

    return {
      food: food.n,
      assumed: assumed,
      amount: showGrams
        ? (amount ? amount + " · " : "") + Math.round(grams) + " g"
        : amount,
      // A typical serving is a guess about *your* portion, so the weight has to
      // be correctable. Editing it re-derives the macros, which needs the basis
      // rather than the rendered string: the grams, and the per-100 g figures.
      grams: Math.round(grams),
      unit: typedUnit,                  // null means "whatever you weigh in"
      per100: { k: food.k, p: food.p },
      pre: showGrams ? amount : "",     // "1 cup", "2 ×" — describes the weight
      calories: Math.round((food.k * grams) / 100),
      protein: Math.round((food.p * grams) / 100),
      src: assumed ? "typical" : "table"
    };
  }

  // ---------- macro estimator ----------
  // Every unit here is a word parseQty already understands, so nothing the
  // picker offers can produce a chunk the parser then shrugs at.
  function entryUnitOptions(sel) {
    function opts(list) {
      return list.map(function (u) {
        return '<option value="' + u + '"' + (u === sel ? ' selected' : '') + '>' + u + '</option>';
      }).join("");
    }
    return '<option value=""' + (sel ? '' : ' selected') + '>—</option>' +
      '<optgroup label="By weight">' + opts(["g", "oz", "lb"]) + '</optgroup>' +
      '<optgroup label="By volume">' + opts(["ml", "fl oz"]) + '</optgroup>' +
      '<optgroup label="By spoon or cup">' + opts(["tsp", "tbsp", "cup"]) + '</optgroup>' +
      '<optgroup label="Pre-made — no weighing">' +
        opts(["bottle", "can", "bar", "packet", "pouch", "container", "tub",
              "carton", "box", "bag", "stick", "slice", "piece", "scoop", "serving"]) +
      '</optgroup>';
  }

  // One table row becomes one chunk of the same sentence the words box would
  // have produced, so the table is a way to *compose* the input rather than a
  // second code path — pantry, the built-in table and Claude all resolve it
  // exactly as before.
  function rowChunk(r) {
    var food = String((r && r.food) || "").trim();
    if (!food) return "";
    var qty = String((r && r.qty) || "").trim();
    var unit = String((r && r.unit) || "").trim();
    if (!qty && !unit) return food;
    if (!qty) qty = "1";
    return unit ? qty + " " + unit + " " + food : qty + " " + food;
  }
  function rowsText() {
    return estRows.map(rowChunk).filter(Boolean).join(" & ");
  }

  function estimatePrompt(text) {
    var region = store.region || "United States";
    return "You estimate calories and protein for food descriptions. Reply with JSON only.\n\n" +
      "Food eaten: \"" + text + "\"\n" +
      "Country: " + region + "\n\n" +
      "Rules:\n" +
      "- Answer for " + region + ": use that country's food composition data, its retail and " +
        "restaurant products, and its typical cuts, preparations and serving sizes. A named store " +
        "or brand means that country's version of it, and an ambiguous unit means whatever that " +
        "country normally uses.\n" +
      "- Split the description into individual foods, one object each.\n" +
      "- Use the stated quantity. Weights of rice, pasta and grains are cooked weight unless the text says dry or uncooked.\n" +
      "- If a brand or store is named and you know its published values, use them; otherwise use the generic equivalent.\n" +
      "- If a quantity is missing, assume one typical serving and say so in the note.\n" +
      "- calories: whole number of kcal. protein: whole number of grams.\n" +
      "- note: one short sentence naming any assumption worth knowing, or an empty string.\n\n" +
      'Return exactly this shape: {"items":[{"food":"","amount":"","calories":0,"protein":0}],"note":""}';
  }

  function unknownItem(chunk) {
    return { food: chunk, amount: "", calories: 0, protein: 0, src: "unknown" };
  }

  function runEstimate(text, replacingId) {
    var rep = replacingId || null;
    var resolved = [], leftovers = [];

    splitItems(text).forEach(function (chunk) {
      var hit = resolveLocal(chunk);
      if (hit) resolved.push(hit); else leftovers.push(chunk);
    });

    // Everything the built-in table knew — instant, no round trip, works offline.
    if (!leftovers.length && resolved.length) {
      est = { status: "review", text: text, items: resolved, note: "", replacing: rep };
      render();
      return;
    }

    if (!sampleFn) {
      if (!resolved.length && !leftovers.length) {
        est = { status: "error", text: text, replacing: rep,
                message: "Couldn't read that as food. Try naming amounts, like \"6 oz sirloin, 1 cup rice\"." };
      } else {
        est = { status: "review", text: text, replacing: rep, note: "",
                items: resolved.concat(leftovers.map(unknownItem)) };
      }
      render();
      return;
    }

    est = { status: "loading", text: text, replacing: rep, partial: resolved.length };
    render();

    sampleFn.json(estimatePrompt(leftovers.join(" & ")), { modelTier: "default", cache: true }).then(function (out) {
      var items = (out && out.items ? out.items : []).filter(function (it) { return it && it.food; })
        .map(function (it) {
          return {
            food: String(it.food),
            amount: it.amount ? String(it.amount) : "",
            calories: Math.max(0, Math.round(Number(it.calories) || 0)),
            protein: Math.max(0, Math.round(Number(it.protein) || 0)),
            src: "claude"
          };
        });
      if (!items.length && !resolved.length) {
        est = { status: "error", text: text, replacing: rep,
                message: "Couldn't read that as food. Try naming the items and amounts, like \"6 oz sirloin, 1 cup rice\"." };
      } else {
        est = { status: "review", text: text, replacing: rep,
                items: resolved.concat(items.length ? items : leftovers.map(unknownItem)),
                note: out && out.note ? String(out.note) : "" };
      }
      render();
    }).catch(function (e) {
      var code = e && e.code;
      var msg = code === "rate_limited"
        ? "Too many estimates just now. Give it a minute and try again."
        : code === "not_granted"
          ? "Estimating isn't available in this window. Open the app inside Claude and try again."
          : "That estimate didn't come back. Try again, or enter the numbers by hand.";
      // Anything the table already resolved is still good — keep it.
      if (resolved.length) {
        est = { status: "review", text: text, replacing: rep, warn: msg, note: "",
                items: resolved.concat(leftovers.map(unknownItem)) };
      } else {
        est = { status: "error", text: text, message: msg, replacing: rep };
      }
      render();
    });
  }

  // Your own words make the best meal name; anything long falls back to the
  // auto-name built from what's inside it.
  function mealNameFrom(text) {
    var t = (text || "").trim().replace(/\s+/g, " ");
    return (t && t.length <= 40) ? t : "";
  }

  function commitEstimate(key) {
    var d = day(key);

    var made = est.items.map(function (it) {
      if (it.src === "unknown" && !it.calories && !it.protein) {
        // Nothing could price it — keep the words, resolve it later.
        return { id: uid(), cal: 0, pro: 0, note: it.food, pending: true };
      }
      return {
        id: uid(),
        cal: it.calories,
        pro: it.protein,
        note: it.amount ? it.food + " · " + it.amount : it.food,
        est: it.src !== "pantry" && !it.edited
      };
    });

    // Resolving a placeholder that lives inside a meal puts the answer back
    // inside that meal, not loose at the bottom of the day — and never wraps a
    // meal inside a meal.
    var at = est.replacing ? locate(d, est.replacing) : null;
    var asMeal = estAsMeal && made.length > 1 && !(at && at.meal);
    var toPlace = asMeal
      ? [{ id: uid(), note: mealNameFrom(est.text), items: made }]
      : made;

    if (at) {
      var args = [at.idx, 1].concat(toPlace);
      at.list.splice.apply(at.list, args);
    } else {
      toPlace.forEach(function (r) { d.food.push(r); });
    }
    tidyMeals(d);
    stampGoal(key);
    est = null;
    estDraft = "";
    // The table has to empty with the draft. Leaving the rows filled in is how
    // someone logs the same meal twice without noticing.
    estRows = [{ qty: "", unit: "", food: "" }];
    estHint = "";
    estAsMeal = false;
    touch(key); save(); render();
  }

  function volume(l) {
    var v = 0, reps = 0;
    l.sets.forEach(function (s) { v += s.w * s.r; reps += s.r; });
    return { vol: v, reps: reps, sets: l.sets.length };
  }

  // last time this movement was trained, before `beforeKey`
  function lastTime(movement, beforeKey) {
    var keys = Object.keys(store.days).filter(function (k) { return k < beforeKey; }).sort().reverse();
    for (var i = 0; i < keys.length; i++) {
      var lifts = store.days[keys[i]].lifts || [];
      for (var j = 0; j < lifts.length; j++) {
        if (lifts[j].movement === movement && lifts[j].sets.length) {
          return { key: keys[i], lift: lifts[j] };
        }
      }
    }
    return null;
  }

  function shortDate(key) {
    var d = parseYmd(key);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }


  // ---------- rendering ----------
  var view = document.getElementById("view");

  // Logging food must survive anything. It reads the form itself, is wired once
  // by delegation, and never depends on the rest of a render having succeeded.
  function addFoodFromForm() {
    var key = ymd(cursor);
    var d = day(key);
    var calEl = document.getElementById("fCal");
    var proEl = document.getElementById("fPro");
    var noteEl = document.getElementById("fNote");
    if (!calEl || !proEl) return;

    var c = num(calEl.value), p = num(proEl.value);
    if (!c && !p) { calEl.focus(); return; }

    var label = noteEl && noteEl.value.trim() ? noteEl.value.trim() : "Entry";
    d.food.push({ id: uid(), cal: c, pro: p, note: noteEl ? noteEl.value.trim() : "" });
    stampGoal(key);
    touch(key);
    var ok = save();
    // Only claim it went in if it actually did. The row still renders — it is
    // real for this session — but the savebar says it will not survive.
    lastAdded = ok ? { label: label, cal: c, pro: p, at: Date.now() } : null;
    render();

    // The new row lands above the fold, so confirm it down here where the thumb is.
    var btn = document.getElementById("addFood");
    if (btn) {
