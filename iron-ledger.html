      grams: (q.unit && q.unit.kind === "weight" && n.k) ? Math.round(qty * q.unit.grams) : null,
      per100: n.k ? { k: n.k, p: n.p } : null,
      pre: "",
      calories: Math.round(cal),
      protein: Math.round(pro),
      src: "pantry"
    };
  }

  var WORD_NUMBERS = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6,
    seven: 7, eight: 8, nine: 9, ten: 10, twelve: 12, dozen: 12, half: 0.5,
    some: 1, my: 1, the: 1 };

  function normalize(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9/%.\s]/g, " ").replace(/\s+/g, " ").trim();
  }

  function splitItems(text) {
    return String(text).split(/\s*(?:&|,|\+|;|\band\b|\bwith\b|\n)\s*/i)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 1; });
  }


  // Longest whole-word alias wins, so "top sirloin" beats "sirloin".
  function matchIn(list, q) {
    var norm = " " + normalize(q) + " ";
    var wantsDry = /\b(dry|uncooked|raw)\b/.test(norm);
    var best = null, bestLen = 0;
    list.forEach(function (f) {
      f.a.forEach(function (alias) {
        if (!alias || norm.indexOf(" " + alias + " ") === -1) return;
        var len = alias.length;
        var dryAlias = /\b(dry|uncooked|raw)\b/.test(alias);
        if (wantsDry && dryAlias) len += 20;      // prefer the dry entry when asked
        if (!wantsDry && dryAlias) len -= 20;     // and avoid it otherwise
        if (len > bestLen) { bestLen = len; best = f; }
      });
    });
    return bestLen > 0 ? best : null;
  }

  function matchFood(q) {
    return matchIn(FOODS, q);
  }

  function parseQty(chunk) {
    var norm = normalize(chunk);
    var qty = null, unit = null, rest = norm;

    // "1 1/2", "1/2", "2.5", or a written number
    var m = norm.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);
    if (m) {
      var raw = m[1];
      if (raw.indexOf("/") > -1) {
        var parts = raw.split(/\s+/);
        qty = 0;
        parts.forEach(function (pp) {
          if (pp.indexOf("/") > -1) { var fr = pp.split("/"); qty += Number(fr[0]) / Number(fr[1]); }
          else qty += Number(pp);
        });
      } else { qty = Number(raw); }
      rest = m[2];
    } else {
      var w = norm.match(/^([a-z]+)\s+(.*)$/);
      if (w && WORD_NUMBERS[w[1]] !== undefined) { qty = WORD_NUMBERS[w[1]]; rest = w[2]; }
    }

    var u = rest.match(/^([a-z]+)\.?\s+(?:of\s+)?(.*)$/);
    if (u) {
      var word = u[1];
      if (WEIGHT_UNITS[word] !== undefined) { unit = { kind: "weight", grams: WEIGHT_UNITS[word] }; rest = u[2]; }
      else if (PORTION_WORDS[word]) { unit = { kind: "portion", key: PORTION_WORDS[word] }; rest = u[2]; }
    }
    return { qty: qty, unit: unit, name: rest.trim() || norm, whole: norm };
  }

  // Your own pantry answers first; the built-in table is the fallback.
  function resolveLocal(chunk) {
    return resolvePantry(chunk) || resolveTable(chunk);
  }

  // Resolve one chunk against the built-in table. Null when it can't answer.
  function resolveTable(chunk) {
    var p = parseQty(chunk);
    var food = matchFood(p.name) || matchFood(p.whole);
    if (!food) return null;

    var grams = null, amount = "", showGrams = true, assumed = false;
    if (p.unit && p.unit.kind === "weight") {
      grams = (p.qty || 1) * p.unit.grams;
      var label = p.unit.grams === 1 ? "g" : p.unit.grams === 28.3495 ? "oz"
                : p.unit.grams === 453.592 ? "lb" : "kg";
      amount = (p.qty || 1) + " " + label;
      showGrams = label !== "g";                   // don't print grams twice
    } else if (p.unit && p.unit.kind === "portion") {
      var per = food.u && food.u[p.unit.key];
      if (!per) return null;                       // unit we can't weigh for this food
      grams = (p.qty || 1) * per;
      amount = (p.qty || 1) + " " + p.unit.key + (p.qty > 1 ? "s" : "");
    } else if (p.qty && food.u && (food.u.each || food.u.slice)) {
      var one = food.u.each || food.u.slice;
      grams = p.qty * one;
      amount = p.qty + " × " + Math.round(one) + " g";
      showGrams = false;
    } else if (food.d) {
      // No amount given — fall back to a typical serving so "chicken and rice"
      // still produces a number. Flagged as an assumption you can edit.
      var n = p.qty || 1;
      grams = n * food.d;
      assumed = true;
      if (n > 1) {
        amount = n + " × " + Math.round(food.d) + " g";
        showGrams = false;
      } else {
        amount = "";                               // the tag already says "typical serving"
      }
    } else if (!p.qty && food.u && food.u.serving) {
      grams = food.u.serving;
      amount = "1 serving";
    } else {
      return null;                                 // nothing we can size it by
    }

    return {
      food: food.n,
      assumed: assumed,
      amount: showGrams
        ? (amount ? amount + " · " : "") + Math.round(grams) + " g"
        : amount,
      // A typical serving is a guess about *your* portion, so the weight has to
      // be correctable. Editing it re-derives the macros, which needs the basis
      // rather than the rendered string: the grams, and the per-100 g figures.
      grams: Math.round(grams),
      per100: { k: food.k, p: food.p },
      pre: showGrams ? amount : "",     // "1 cup", "2 ×" — describes the weight
      calories: Math.round((food.k * grams) / 100),
      protein: Math.round((food.p * grams) / 100),
      src: assumed ? "typical" : "table"
    };
  }

  // ---------- macro estimator ----------
  function estimatePrompt(text) {
    var region = store.region || "United States";
    return "You estimate calories and protein for food descriptions. Reply with JSON only.\n\n" +
      "Food eaten: \"" + text + "\"\n" +
      "Country: " + region + "\n\n" +
      "Rules:\n" +
      "- Answer for " + region + ": use that country's food composition data, its retail and " +
        "restaurant products, and its typical cuts, preparations and serving sizes. A named store " +
        "or brand means that country's version of it, and an ambiguous unit means whatever that " +
        "country normally uses.\n" +
      "- Split the description into individual foods, one object each.\n" +
      "- Use the stated quantity. Weights of rice, pasta and grains are cooked weight unless the text says dry or uncooked.\n" +
      "- If a brand or store is named and you know its published values, use them; otherwise use the generic equivalent.\n" +
      "- If a quantity is missing, assume one typical serving and say so in the note.\n" +
      "- calories: whole number of kcal. protein: whole number of grams.\n" +
      "- note: one short sentence naming any assumption worth knowing, or an empty string.\n\n" +
      'Return exactly this shape: {"items":[{"food":"","amount":"","calories":0,"protein":0}],"note":""}';
  }

  function unknownItem(chunk) {
    return { food: chunk, amount: "", calories: 0, protein: 0, src: "unknown" };
  }

  function runEstimate(text, replacingId) {
    var rep = replacingId || null;
    var resolved = [], leftovers = [];

    splitItems(text).forEach(function (chunk) {
      var hit = resolveLocal(chunk);
      if (hit) resolved.push(hit); else leftovers.push(chunk);
    });

    // Everything the built-in table knew — instant, no round trip, works offline.
    if (!leftovers.length && resolved.length) {
      est = { status: "review", text: text, items: resolved, note: "", replacing: rep };
      render();
      return;
    }

    if (!sampleFn) {
      if (!resolved.length && !leftovers.length) {
        est = { status: "error", text: text, replacing: rep,
                message: "Couldn't read that as food. Try naming amounts, like \"6 oz sirloin, 1 cup rice\"." };
      } else {
        est = { status: "review", text: text, replacing: rep, note: "",
                items: resolved.concat(leftovers.map(unknownItem)) };
      }
      render();
      return;
    }

    est = { status: "loading", text: text, replacing: rep, partial: resolved.length };
    render();

    sampleFn.json(estimatePrompt(leftovers.join(" & ")), { modelTier: "default", cache: true }).then(function (out) {
      var items = (out && out.items ? out.items : []).filter(function (it) { return it && it.food; })
        .map(function (it) {
          return {
            food: String(it.food),
            amount: it.amount ? String(it.amount) : "",
            calories: Math.max(0, Math.round(Number(it.calories) || 0)),
            protein: Math.max(0, Math.round(Number(it.protein) || 0)),
            src: "claude"
          };
        });
      if (!items.length && !resolved.length) {
        est = { status: "error", text: text, replacing: rep,
                message: "Couldn't read that as food. Try naming the items and amounts, like \"6 oz sirloin, 1 cup rice\"." };
      } else {
        est = { status: "review", text: text, replacing: rep,
                items: resolved.concat(items.length ? items : leftovers.map(unknownItem)),
                note: out && out.note ? String(out.note) : "" };
      }
      render();
    }).catch(function (e) {
      var code = e && e.code;
      var msg = code === "rate_limited"
        ? "Too many estimates just now. Give it a minute and try again."
        : code === "not_granted"
          ? "Estimating isn't available in this window. Open the app inside Claude and try again."
          : "That estimate didn't come back. Try again, or enter the numbers by hand.";
      // Anything the table already resolved is still good — keep it.
      if (resolved.length) {
        est = { status: "review", text: text, replacing: rep, warn: msg, note: "",
                items: resolved.concat(leftovers.map(unknownItem)) };
      } else {
        est = { status: "error", text: text, message: msg, replacing: rep };
      }
      render();
    });
  }

  // Your own words make the best meal name; anything long falls back to the
  // auto-name built from what's inside it.
  function mealNameFrom(text) {
    var t = (text || "").trim().replace(/\s+/g, " ");
    return (t && t.length <= 40) ? t : "";
  }

  function commitEstimate(key) {
    var d = day(key);

    var made = est.items.map(function (it) {
      if (it.src === "unknown" && !it.calories && !it.protein) {
        // Nothing could price it — keep the words, resolve it later.
        return { id: uid(), cal: 0, pro: 0, note: it.food, pending: true };
      }
      return {
        id: uid(),
        cal: it.calories,
        pro: it.protein,
        note: it.amount ? it.food + " · " + it.amount : it.food,
        est: it.src !== "pantry" && !it.edited
      };
    });

    // Resolving a placeholder that lives inside a meal puts the answer back
    // inside that meal, not loose at the bottom of the day — and never wraps a
    // meal inside a meal.
    var at = est.replacing ? locate(d, est.replacing) : null;
    var asMeal = estAsMeal && made.length > 1 && !(at && at.meal);
    var toPlace = asMeal
      ? [{ id: uid(), note: mealNameFrom(est.text), items: made }]
      : made;

    if (at) {
      var args = [at.idx, 1].concat(toPlace);
      at.list.splice.apply(at.list, args);
    } else {
      toPlace.forEach(function (r) { d.food.push(r); });
    }
    tidyMeals(d);
    stampGoal(key);
    est = null;
    estDraft = "";
    estAsMeal = false;
    touch(key); save(); render();
  }

  function volume(l) {
    var v = 0, reps = 0;
    l.sets.forEach(function (s) { v += s.w * s.r; reps += s.r; });
    return { vol: v, reps: reps, sets: l.sets.length };
  }

  // last time this movement was trained, before `beforeKey`
  function lastTime(movement, beforeKey) {
    var keys = Object.keys(store.days).filter(function (k) { return k < beforeKey; }).sort().reverse();
    for (var i = 0; i < keys.length; i++) {
      var lifts = store.days[keys[i]].lifts || [];
      for (var j = 0; j < lifts.length; j++) {
        if (lifts[j].movement === movement && lifts[j].sets.length) {
          return { key: keys[i], lift: lifts[j] };
        }
      }
    }
    return null;
  }

  function shortDate(key) {
    var d = parseYmd(key);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }


  // ---------- rendering ----------
  var view = document.getElementById("view");

  // Logging food must survive anything. It reads the form itself, is wired once
  // by delegation, and never depends on the rest of a render having succeeded.
  function addFoodFromForm() {
    var key = ymd(cursor);
    var d = day(key);
    var calEl = document.getElementById("fCal");
    var proEl = document.getElementById("fPro");
    var noteEl = document.getElementById("fNote");
    if (!calEl || !proEl) return;

    var c = num(calEl.value), p = num(proEl.value);
    if (!c && !p) { calEl.focus(); return; }

    var label = noteEl && noteEl.value.trim() ? noteEl.value.trim() : "Entry";
    d.food.push({ id: uid(), cal: c, pro: p, note: noteEl ? noteEl.value.trim() : "" });
    stampGoal(key);
    touch(key);
    save();
    lastAdded = { label: label, cal: c, pro: p, at: Date.now() };
    render();

    // The new row lands above the fold, so confirm it down here where the thumb is.
    var btn = document.getElementById("addFood");
    if (btn) {
      btn.textContent = "Added";
      setTimeout(function () {
        var b2 = document.getElementById("addFood");
        if (b2 && b2.textContent === "Added") b2.textContent = "Add to ledger";
      }, 1400);
    }
    var again = document.getElementById("fCal");
    if (again) again.focus();
  }

  function render() {
    var key = ymd(cursor);
    var d = day(key);

    document.getElementById("dow").textContent =
      cursor.toLocaleDateString("en-US", { weekday: "long" });
    document.getElementById("dateFull").textContent =
      cursor.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    document.getElementById("todayBtn").hidden = (key === TODAY);

    try {
      if (tab === "macros") renderMacros(key, d);
      else if (tab === "gym") renderGym(key, d);
      else if (tab === "pantry") renderPantry();
    else if (tab === "coach") renderCoach();
      else renderLog();
    } catch (e) {
      lastError = (e && e.message ? e.message : String(e)) + " · in " + tab;
      if (window.console && console.error) console.error("render failed in " + tab + ":", e);
      // Never leave a blank screen: the day's own numbers still render.
      if (tab === "macros" && !document.getElementById("addFood")) {
        var t = totals(d);
        view.innerHTML =
          '<section class="tchart">' +
            '<div class="t-head">' +
              '<span class="h-food">Food</span>' +
              '<span class="h-cal">Kcal</span>' +
              '<span class="h-pro">Protein</span>' +
            '</div>' +
            '<div class="t-total">' +
              '<span class="t-label">Day total</span>' +
              '<span class="t-cal"><b>' + fmt(t.cal) + '</b></span>' +
              '<span class="t-pro"><b>' + fmt(t.pro) + '</b></span>' +
            '</div>' +
          '</section>' +
          '<section class="entry">' +
            '<div class="pair">' +
              '<div class="field"><label for="fCal">Calories</label>' +
                '<input id="fCal" inputmode="numeric" placeholder="0"></div>' +
              '<div class="field"><label for="fPro">Protein · g</label>' +
                '<input id="fPro" inputmode="numeric" placeholder="0"></div>' +
            '</div>' +
            '<div class="field"><label for="fNote">What was it (optional)</label>' +
              '<input id="fNote" class="text"></div>' +
            '<button class="btn" id="addFood">Add to ledger</button>' +
            '<p class="est-note" style="color:var(--miss)">Something in this day tripped the full view, ' +
              'so this is the plain version — logging still works. Tap Backup and send the details to Claude.</p>' +
          '</section>';
      }
    }
  }

  // Hoisted so the weight editor can relabel a row after it stops being an
  // assumed portion; it used to be local to the render.
  var SRC = { pantry: "your pantry", table: "built-in reference",
              typical: "typical serving",
              claude: "estimated", unknown: "needs numbers" };

  function estimatorHtml(key, d) {
    if (est && est.status === "loading") {
      return '<section class="entry est">' +
        '<span class="eyebrow">Working it out</span>' +
        '<div class="working"><i></i>Estimating “' + esc(est.text) + '”</div>' +
      '</section>';
    }

    if (est && est.status === "review") {
      var tc = 0, tp = 0;
      est.items.forEach(function (it) { tc += it.calories; tp += it.protein; });
      var items = est.items.map(function (it, i) {
        var tag = '<span class="src-tag ' + it.src + '">' + SRC[it.src || "claude"] + '</span>';
        // Anything with a gram basis gets its weight as a field rather than as
        // text, so a portion you did not choose can be corrected to one you did.
        var amt = (it.grams && it.per100)
          ? '<span class="amt editable">' +
              '<span class="pre">' + (it.pre ? esc(it.pre) + " · " : "") + '</span>' +
              '<input inputmode="decimal" class="g" data-ig="' + i + '" value="' + it.grams +
                '" aria-label="Grams of ' + esc(it.food) + '">' +
              // the separator rides with the unit so it can never wrap onto a
              // line by itself, the way a standalone "·" span would
              '<span class="g-unit">g ·</span>' + tag +
            '</span>'
          : '<span class="amt">' + (it.amount ? esc(it.amount) + " · " : "") + tag + '</span>';
        return '<div class="rev-item">' +
          '<span class="food">' + esc(it.food) + '</span>' +
          '<input inputmode="numeric" data-ic="' + i + '" value="' + it.calories + '" aria-label="Calories">' +
          '<input inputmode="numeric" data-ip="' + i + '" value="' + it.protein + '" aria-label="Protein grams">' +
          amt +
        '</div>';
      }).join("");

      return '<section class="review">' +
        '<header><b>Estimate</b><span>' + fmt(tc) + ' kcal · ' + fmt(tp) + ' g</span></header>' +
        '<div class="rev-units"><span></span><span>kcal</span><span>protein</span></div>' +
        items +
        '<div class="rev-foot">' +
          (est.warn ? '<p class="rev-assume" style="color:var(--miss)">' + esc(est.warn) + '</p>' : '') +
          '<p class="rev-assume">' +
            (est.note ? esc(est.note) + " " : "") +
            'Anything marked <em>typical serving</em> is an assumed portion — tap the number to correct it. ' +
            'Anything marked <em>needs numbers</em> goes in as a placeholder you can fill later.' +
          '</p>' +
          // One description usually is one meal, so offer it here rather than
          // making you drag the rows together afterwards.
          (est.items.length > 1
            ? '<button class="meal-toggle" id="estMeal" aria-pressed="' + (estAsMeal ? 'true' : 'false') + '">' +
                '<span class="box">' + (estAsMeal ? '✓' : '') + '</span>' +
                'Put these in as one meal' +
              '</button>'
            : '') +
          '<div class="rev-actions">' +
            '<button class="btn" id="commitEst">' +
              ((estAsMeal && est.items.length > 1)
                ? 'Add as one meal'
                : 'Add ' + est.items.length + (est.items.length === 1 ? ' item' : ' items')) +
            '</button>' +
            '<button class="btn ghost" id="discardEst" style="padding:0 16px">Discard</button>' +
          '</div>' +
        '</div>' +
      '</section>';
    }

    var pend = pendingCount(d);
    var errHtml = (est && est.status === "error")
      ? '<p class="est-note" style="color:var(--miss)">' + esc(est.message) + '</p>' : '';

    return '<section class="entry est">' +
      '<span class="eyebrow">Need help counting?</span>' +
      '<textarea id="estText" placeholder="What did you eat?" ' +
        'spellcheck="false">' + esc(estDraft) + '</textarea>' +
      '<div class="field"><label for="regionIn">Estimate for food sold in</label>' +
        '<input id="regionIn" class="text" list="regionList" autocomplete="country-name" ' +
          'value="' + esc(store.region || "") + '" placeholder="United States">' +
        '<datalist id="regionList">' +
          REGIONS.map(function (r) { return '<option value="' + esc(r) + '"></option>'; }).join("") +
        '</datalist></div>' +
      errHtml +
      '<button class="btn" id="runEst">Work out the macros</button>' +
      '<p class="est-note">' +
        (sampleFn
          ? 'Describe the meal in plain words. Your pantry and the built-in food table answer first; anything they don’t recognise goes to Claude. The country above decides which version of a product gets used. You’ll see the breakdown and can edit it before it goes in the ledger.'
          : 'Your pantry and the built-in food table work offline — most everyday foods resolve straight away, and anything without an amount gets a typical serving. Whatever it doesn’t recognise is saved as a placeholder you can fill in by hand.') +
      '</p>' +
      (pend
        ? '<p class="est-note">' + pend + (pend === 1 ? ' entry is' : ' entries are') +
          ' waiting on an estimate. Today stays uncoloured on the calendar until ' +
          (pend === 1 ? 'it is' : 'they are') + ' filled in.</p>'
        : '') +
    '</section>';
  }

  function renderMacros(key, d) {
    var t = totals(d);
    var rows = d.food.map(function (f, i) {
      var meal = isMeal(f);
      var c = rowCal(f), pr = rowPro(f);
      var open = meal && openMeal === f.id;

      var label = meal
        ? '<button class="meal-open" data-openmeal="' + esc(f.id) + '">' +
            '<span class="mn">' + esc(rowNote(f)) + '</span>' +
            '<span class="mc">' + f.items.length +
              (f.items.length === 1 ? ' item' : ' items') + ' · tap to ' +
              (open ? 'close' : 'open') + '</span>' +
          '</button>'
        : '<span class="nm' + (f.note ? '' : ' untitled') + '">' +
            (f.note ? esc(f.note) : 'Untitled entry') +
            (f.est ? ' <span class="est-badge">est</span>' : '') +
            (f.pending
              ? '<br><button class="pending-chip" data-est="' + f.id + '">' +
                  (sampleFn ? 'Tap to estimate' : 'Tap to add numbers') + '</button>'
              : '') +
          '</span>';

      var inside = "";
      if (open) {
        inside = '<div class="meal-body">' +
          f.items.map(function (x) {
            return '<div class="meal-item">' +
              '<span class="mi-nm">' + esc(x.note || "Untitled entry") +
                (x.est ? ' <span class="est-badge">est</span>' : '') +
                (x.pending
                  ? ' <button class="pending-chip" data-est="' + x.id + '">' +
                      (sampleFn ? 'Tap to estimate' : 'Tap to add numbers') + '</button>'
                  : '') +
              '</span>' +
              '<span class="mi-n">' + (x.cal ? fmt(x.cal) : "—") + '</span>' +
              '<span class="mi-n">' + (x.pro ? fmt(x.pro) : "—") + '</span>' +
              '<button class="mi-out" data-takeout="' + esc(x.id) + '">Take out</button>' +
            '</div>';
          }).join("") +
          '<div class="meal-actions">' +
            '<button data-renamemeal="' + esc(f.id) + '">Name this meal</button>' +
            '<button data-split="' + esc(f.id) + '">Split apart</button>' +
          '</div>' +
        '</div>';
      }

      return '<div class="t-row' + (meal ? ' is-meal' : '') + (open ? ' is-open' : '') +
               '" data-row="' + esc(f.id) + '">' +
        '<div class="t-food">' + label +
          '<button class="t-del" data-del="' + esc(f.id) + '" aria-label="Delete entry">✕</button>' +
        '</div>' +
        '<div class="t-cal"><b class="' + (c ? "" : "zero") + '">' + (c ? fmt(c) : "—") + '</b></div>' +
        '<div class="t-pro"><b class="' + (pr ? "" : "zero") + '">' + (pr ? fmt(pr) : "—") + '</b></div>' +
        inside +
      '</div>';
    }).join("");

    var g = goalFor(key);
    var logged = d.food.length > 0;

    function half(side, gg, total, unit) {
      var ok = meets(gg, total);
      var state = logged ? (ok ? "hit" : "miss") : "none";
      var pct = gg.v > 0 ? Math.max(0, Math.min(100, (total / gg.v) * 100)) : 0;
      return '<div class="goalcell ' + side + '">' +
        '<span class="goaltarget"><span class="dir">' + (gg.dir === "+" ? "+" : "−") + '</span>' +
          fmt(gg.v) + ' ' + unit + '</span>' +
        '<span class="meter"><i class="' + state + '" style="width:' + pct.toFixed(1) + '%"></i></span>' +
        '<span class="goalstat ' + state + '">' +
          (logged ? goalText(gg, total) : "not started") + '</span>' +
      '</div>';
    }

    var goalHtml = editingGoal
      ? '<div class="entry" style="margin-top:14px">' +
          '<span class="eyebrow">Daily target</span>' +
          '<div class="pair">' +
            '<div class="field"><label>Calories</label>' +
              '<div class="dirtoggle" id="dirCal">' +
                '<button data-d="+" aria-pressed="' + (g.cal.dir === "+") + '">+ Above</button>' +
                '<button data-d="-" aria-pressed="' + (g.cal.dir === "-") + '">− Below</button>' +
              '</div>' +
              '<input id="gCal" inputmode="numeric" value="' + g.cal.v + '" style="margin-top:6px"></div>' +
            '<div class="field"><label>Protein · g</label>' +
              '<div class="dirtoggle" id="dirPro">' +
                '<button data-d="+" aria-pressed="' + (g.pro.dir === "+") + '">+ Above</button>' +
                '<button data-d="-" aria-pressed="' + (g.pro.dir === "-") + '">− Below</button>' +
              '</div>' +
              '<input id="gPro" inputmode="numeric" value="' + g.pro.v + '" style="margin-top:6px"></div>' +
          '</div>' +
          '<p style="margin:0;font-size:12px;line-height:1.5;color:var(--ink-3)">' +
            'Applies to this day and every day after it. Days already logged keep the target they were judged against.</p>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
            '<button class="btn" id="saveGoal">Save target</button>' +
            '<button class="btn ghost" id="cancelGoal">Cancel</button>' +
          '</div>' +
        '</div>'
      : '<button class="goaledit-open" id="openGoal">Target · ' +
          (g.cal.dir === "+" ? "+" : "−") + fmt(g.cal.v) + ' kcal · ' +
          (g.pro.dir === "+" ? "+" : "−") + fmt(g.pro.v) + ' g protein · edit</button>';

    // Shown only until something is logged — invisible to anyone already using it.
    var isNew = !store.seen &&
      !Object.keys(store.days).some(function (k) {
        var dd = store.days[k];
        return (dd.food && dd.food.length) || (dd.lifts && dd.lifts.length);
      }) && !(store.pantry || []).length;

    var welcome = isNew
      ? '<section class="welcome">' +
          '<h2>A quick tour</h2>' +
          '<p>A gym and food log built to replace a paper one. Everything stays on this phone — ' +
            'nobody else sees what you log, including whoever shared this with you.</p>' +
          '<dl>' +
            '<dt>Macros</dt><dd>Calories left, protein right, totals at the bottom. Type the numbers, ' +
              'or describe the meal — “chicken and rice” works, and you can correct it before it goes in.</dd>' +
            '<dt>Pantry</dt><dd>Save things you eat often, once. Pre-made items are counted in bottles ' +
              'and bars, not weighed.</dd>' +
            '<dt>Gym</dt><dd>Pick a split, add movements, log weight and reps. It shows what you lifted last time.</dd>' +
            '<dt>Log</dt><dd>The year at a glance. Green means you hit your target, red means you missed.</dd>' +
          '</dl>' +
          '<p>The daily target below starts at under 2,000 calories and above 150 g protein — ' +
            'tap it to set your own. Found something broken? Tap <strong>Backup</strong> in the corner ' +
            'and send that text back, build number included.</p>' +
          '<button class="btn ghost" id="dismissWelcome">Got it</button>' +
        '</section>'
      : '';

    view.innerHTML =
      welcome +
      '<section class="tchart">' +
        '<div class="t-head">' +
          '<span class="h-food">Food</span>' +
          '<span class="h-cal">Kcal</span>' +
          '<span class="h-pro">Protein</span>' +
        '</div>' +
        '<div class="t-body">' +
          (rows || '<p class="empty">Nothing logged yet.<br>Add your first entry below.</p>') +
        '</div>' +
        ((d.food.length > 1 && !d.food.some(isMeal))
          ? '<p class="drag-hint">Hold a row and drag it onto another to combine them into one meal.</p>'
          : '') +
        '<div class="t-total">' +
          '<span class="t-label">Day total</span>' +
          '<span class="t-cal"><b>' + fmt(t.cal) + '</b></span>' +
          '<span class="t-pro"><b>' + fmt(t.pro) + '</b></span>' +
        '</div>' +
        '<div class="goalbar">' + half("left", g.cal, t.cal, "kcal") + half("right", g.pro, t.pro, "g") + '</div>' +
        goalHtml +
      '</section>' +

      '<section class="entry">' +
        '<div class="pair">' +
          '<div class="field"><label for="fCal">Calories</label>' +
            '<input id="fCal" inputmode="numeric" placeholder="0"></div>' +
          '<div class="field"><label for="fPro">Protein · g</label>' +
            '<input id="fPro" inputmode="numeric" placeholder="0"></div>' +
        '</div>' +
        '<div class="field"><label for="fNote">What was it (optional)</label>' +
          '<input id="fNote" class="text"></div>' +
        '<button class="btn" id="addFood">Add to ledger</button>' +
        ((lastAdded && Date.now() - lastAdded.at < 8000)
          ? '<p class="added-flash">✓ Added ' + esc(lastAdded.label) + ' · ' +
              fmt(lastAdded.cal) + ' kcal · ' + fmt(lastAdded.pro) + ' g' +
              '<span>Day now ' + fmt(t.cal) + ' kcal · ' + fmt(t.pro) + ' g protein</span></p>'
          : '') +
      '</section>' +
      estimatorHtml(key, d);

    // Deleting is delegated too — see the handler near setTab.

    var dismiss = document.getElementById("dismissWelcome");
    if (dismiss) {
      dismiss.addEventListener("click", function () {
        store.seen = true; save(); render();
      });
    }

    var openGoal = document.getElementById("openGoal");
    if (openGoal) {
      openGoal.addEventListener("click", function () { editingGoal = true; render(); });
    }

    var pendingDir = { cal: g.cal.dir, pro: g.pro.dir };
    ["Cal", "Pro"].forEach(function (which) {
      var wrap = document.getElementById("dir" + which);
      if (!wrap) return;
      wrap.querySelectorAll("button").forEach(function (b) {
        b.addEventListener("click", function () {
          pendingDir[which.toLowerCase()] = b.dataset.d;
          wrap.querySelectorAll("button").forEach(function (x) {
            x.setAttribute("aria-pressed", String(x === b));
          });
        });
      });
    });

    var saveGoalBtn = document.getElementById("saveGoal");
    if (saveGoalBtn) {
      saveGoalBtn.addEventListener("click", function () {
        var gc = num(document.getElementById("gCal").value);
        var gp = num(document.getElementById("gPro").value);
        if (!gc || !gp) { document.getElementById("gCal").focus(); return; }
        var next = { cal: { dir: pendingDir.cal, v: gc }, pro: { dir: pendingDir.pro, v: gp } };
        store.goal = next;
        day(key).goal = JSON.parse(JSON.stringify(next));
        editingGoal = false;
        touch(key); save(); render();
      });
      document.getElementById("cancelGoal").addEventListener("click", function () {
        editingGoal = false; render();
      });
    }

    // Adding food is wired once, by delegation, outside this function — so a
    // failure anywhere else in the render can never leave the button dead.

    // --- estimator wiring ---
    var estText = document.getElementById("estText");
    if (estText) {
      estText.addEventListener("input", function () { estDraft = estText.value; });
    }

    var regionIn = document.getElementById("regionIn");
    if (regionIn) {
      var saveRegion = function () {
        var v = regionIn.value.trim();
        if (v && v !== store.region) { store.region = v; save(); }
      };
      regionIn.addEventListener("change", saveRegion);
      regionIn.addEventListener("blur", saveRegion);
    }

    var runEst = document.getElementById("runEst");
    if (runEst) {
      runEst.addEventListener("click", function () {
        var text = (estText ? estText.value : "").trim();
        if (!text) { if (estText) estText.focus(); return; }
        // Pick up a country typed but not yet committed by a blur.
        if (regionIn && regionIn.value.trim()) store.region = regionIn.value.trim();
        // Always try the built-in table and your pantry first — that works
        // offline. Only what they can't answer needs Claude, or a placeholder.
        estDraft = text;
        runEstimate(text);
      });
    }

    view.querySelectorAll("[data-est]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.est;
        var at = locate(d, id);
        if (!at) return;
        // Always run the estimate — the built-in table and your pantry work
        // offline, so most placeholders resolve without Claude. If nothing can
        // price it, runEstimate says so and the placeholder stays put.
        runEstimate(at.row.note, id);
      });
    });

    // Change the weight, the macros follow. Updated in place rather than by a
    // re-render, so the field keeps focus while you are still typing into it.
    view.querySelectorAll("[data-ig]").forEach(function (input) {
      input.addEventListener("input", function () {
        if (!est || est.status !== "review") return;
        var it = est.items[Number(input.dataset.ig)];
        if (!it || !it.per100) return;

        var g = Math.max(0, Number(input.value) || 0);
        it.grams = g;
        it.calories = Math.round((it.per100.k * g) / 100);
        it.protein = Math.round((it.per100.p * g) / 100);
        // The portion is yours now, so it is no longer an assumption, and any
        // prefix that described the old weight ("1 cup") no longer describes it.
        // The per-100 g figures are still the reference table's, so `edited`
        // stays untouched and the row keeps its honest "est" badge.
        if (it.src === "typical") it.src = "table";
        it.pre = "";
        // commitEstimate writes `amount` into the row's note, so it has to move
        // with the weight or the ledger records a portion you did not log.
        it.amount = g ? g + " g" : "";

        var row = input.closest(".rev-item");
        if (row) {
          var cEl = row.querySelector("[data-ic]"), pEl = row.querySelector("[data-ip]");
          if (cEl) cEl.value = it.calories;
          if (pEl) pEl.value = it.protein;
          var tagEl = row.querySelector(".src-tag");
          if (tagEl) {
            tagEl.className = "src-tag " + it.src;
            tagEl.textContent = SRC[it.src || "claude"];
          }
          var preEl = row.querySelector(".amt .pre");
          if (preEl) preEl.textContent = "";
        }

        var gc = 0, gp = 0;
        est.items.forEach(function (x) { gc += x.calories; gp += x.protein; });
        var gHead = view.querySelector(".review > header span");
        if (gHead) gHead.textContent = fmt(gc) + " kcal · " + fmt(gp) + " g";
      });
    });

    view.querySelectorAll("[data-ic], [data-ip]").forEach(function (input) {
      input.addEventListener("input", function () {
        if (!est || est.status !== "review") return;
        var isCal = input.dataset.ic !== undefined;
        var i = Number(isCal ? input.dataset.ic : input.dataset.ip);
        var v = Math.max(0, Math.round(Number(input.value) || 0));
        if (isCal) est.items[i].calories = v; else est.items[i].protein = v;
        // A number you typed yourself is not an estimate, so it shouldn't
        // carry the "est" badge into the ledger.
        est.items[i].edited = true;
        var tc = 0, tp = 0;
        est.items.forEach(function (it) { tc += it.calories; tp += it.protein; });
        var head = view.querySelector(".review > header span");
        if (head) head.textContent = fmt(tc) + " kcal · " + fmt(tp) + " g";
      });
    });

    var mealToggle = document.getElementById("estMeal");
    if (mealToggle) {
      mealToggle.addEventListener("click", function () { estAsMeal = !estAsMeal; render(); });
    }

    var commit = document.getElementById("commitEst");
    if (commit) {
      commit.addEventListener("click", function () { commitEstimate(key); });
      document.getElementById("discardEst").addEventListener("click", function () {
        est = null; estAsMeal = false; render();
      });
    }
  }

  // Marks a finished day. Appended to <body>, not #view, so the next render
  // cannot sweep it away mid-flight, and it removes itself. Wrapped in
  // try/catch and skipped under reduced-motion: a celebration must never be
  // the reason a workout fails to save.
  function celebrate() {
    try {
      if (window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var host = document.createElement("div");
      host.className = "confetti";
      host.setAttribute("aria-hidden", "true");
      var cols = ["--accent", "--cat-a", "--cat-b", "--cat-c", "--hit"];
      for (var i = 0; i < 42; i++) {
        var bit = document.createElement("i");
        bit.style.left = (Math.random() * 100) + "vw";
        bit.style.background = "var(" + cols[i % cols.length] + ")";
        bit.style.setProperty("--dx", Math.round(Math.random() * 120 - 60) + "px");
        bit.style.setProperty("--spin", Math.round(Math.random() * 720 + 360) + "deg");
        bit.style.animationDuration = (1.6 + Math.random() * 1.4).toFixed(2) + "s";
        bit.style.animationDelay = (Math.random() * 0.5).toFixed(2) + "s";
        host.appendChild(bit);
      }
      document.body.appendChild(host);
      setTimeout(function () {
        if (host.parentNode) host.parentNode.removeChild(host);
      }, 3400);
    } catch (e) { /* never let a flourish break logging */ }
  }

  function renderGym(key, d) {
    // Someone whose routine no longer contains the day we were showing (a reset,
    // a restore from another phone) must land on a real day, not an empty one.
    var live = cats();
    if (!live.filter(function (x) { return x.id === activeCat; }).length && live.length) {
      activeCat = live[0].id;
    }
    var c = cat(activeCat);

    var live = cats();

    var chips = live.map(function (x) {
      return '<button class="cat" data-cat="' + x.id + '" aria-pressed="' + (x.id === activeCat) + '" ' +
             'style="--catcolor:' + x.color + '"><span class="tag">' + x.tag + '</span>' + esc(x.short) + '</button>';
    }).join("") +
      // Same box as the splits it sits beside, so it reads as "one more of
      // these" rather than as a control bolted on beneath them.
      '<button class="cat cat-add" id="addSplitChip" aria-label="Add a split">' +
        '<span class="tag">+</span>Add' +
      '</button>';

    // Renaming and removing get full-size controls rather than a corner ×.
    // Every small destructive target this app has shipped has come back as a
    // bug — a delete X at 30×30, set chips at 69×29 — so they get their own
    // mode with room to be 44px.
    var editRows = live.map(function (x) {
      return '<div class="split-row" style="--catcolor:' + x.color + '">' +
        '<span class="split-tag">' + x.tag + '</span>' +
        '<input class="split-name" data-splitname="' + x.id + '" value="' + esc(x.name) +
          '" aria-label="Name of split ' + x.tag + '">' +
        (live.length > 1
          ? '<button class="split-rm" data-rmsplit="' + x.id + '" aria-label="Remove ' +
            esc(x.name) + '">Remove</button>'
          : '<span class="split-keep">last one</span>') +
      '</div>';
    }).join("");

    var opts = (store.moves[activeCat] || []).slice().sort().map(function (m) {
      return '<option value="' + esc(m) + '">' + esc(m) + '</option>';
    }).join("");

    var locked = !!d.gymLocked;

    var cards = d.lifts.map(function (l, i) {
      var lc = cat(l.cat);
      var v = volume(l);
      var prev = lastTime(l.movement, key);
      var lastLine = prev
        ? 'Last · ' + shortDate(prev.key) + ' — <em>' +
          prev.lift.sets.map(function (s) { return s.w + "×" + s.r; }).join(", ") + '</em>'
        : 'First time logging this one.';

      var sets = l.sets.map(function (s, si) {
        // Locked chips are spans, not disabled buttons: probe treats a control
        // that does nothing as dead, and a span is honestly not a control.
        return locked
          ? '<span class="set">' + s.w + '<span class="x">×</span>' + s.r + '</span>'
          : '<button class="set" data-lift="' + i + '" data-set="' + si + '" title="Tap to remove">' +
            s.w + '<span class="x">×</span>' + s.r + '</button>';
      }).join("");

      return '<article class="lift" style="--catcolor:' + lc.color + '">' +
        '<div class="spine"></div>' +
        '<div class="body">' +
          '<div class="lift-head"><h3>' + esc(l.movement) + '</h3>' +
            '<span class="cattag"' + (lc.gone ? ' title="' + esc(lc.name) + '"' : '') + '>' +
              lc.tag + '</span></div>' +
          (lc.gone ? '<p class="last">Logged under <em>' + esc(lc.name) +
                     '</em> — a day you no longer train.</p>' : '') +
          '<p class="last">' + lastLine + '</p>' +
          (sets ? '<div class="sets">' + sets + '</div>' : '') +
          (locked ? '' :
            '<div class="setadd">' +
              '<input inputmode="decimal" placeholder="lb" data-w="' + i + '">' +
              '<input inputmode="numeric" placeholder="reps" data-r="' + i + '">' +
              '<button data-addset="' + i + '">Set</button>' +
            '</div>') +
          '<div class="lift-foot">' +
            '<span>' + (v.sets
              ? v.sets + (v.sets === 1 ? ' set · ' : ' sets · ') + v.reps + ' reps · ' + fmt(v.vol) + ' lb volume'
              : (locked ? 'No sets logged' : 'Log your first set — tap a set chip to remove it')) + '</span>' +
            (locked ? '' : '<button data-rmlift="' + i + '">Remove</button>') +
          '</div>' +
        '</div>' +
      '</article>';
    }).join("");

    var totals = d.lifts.reduce(function (a, l) {
      var v = volume(l); a.sets += v.sets; a.reps += v.reps; a.vol += v.vol; return a;
    }, { sets: 0, reps: 0, vol: 0 });

    view.innerHTML =
      '<section style="display:flex;flex-direction:column;gap:10px">' +
        '<div class="split-head">' +
          '<span class="eyebrow">Today’s split</span>' +
          '<button id="editSplits">' + (splitEdit ? "Done" : "Edit splits") + '</button>' +
        '</div>' +
        (splitEdit
          ? '<div class="split-list">' + editRows + '</div>'
          : '<div class="cats">' + chips + '</div>') +
        (splitAdding
          ? '<div class="split-new">' +
              '<input id="newSplitName" class="text" placeholder="Push, Legs, Walk, Yoga…" ' +
                'aria-label="Name your new split">' +
              '<button class="btn" id="saveSplit">Add</button>' +
              '<button class="btn ghost" id="cancelSplit">Cancel</button>' +
            '</div>'
          : '') +
      '</section>' +

      // A locked day says so at the top, where you look first — the missing
      // form further down is a consequence, not the announcement.
      (locked
        ? '<section class="daydone">' +
            '<div class="dd-head">' +
              '<span class="dd-title">Day complete</span>' +
              '<button id="unlockDay">Unlock</button>' +
            '</div>' +
            '<div class="dd-stats">' +
              '<div><b>' + d.lifts.length + '</b><span>' +
                (d.lifts.length === 1 ? 'movement' : 'movements') + '</span></div>' +
              '<div><b>' + totals.sets + '</b><span>' +
                (totals.sets === 1 ? 'set' : 'sets') + '</span></div>' +
              '<div><b>' + totals.reps + '</b><span>reps</span></div>' +
              '<div><b>' + fmt(totals.vol) + '</b><span>lb volume</span></div>' +
            '</div>' +
          '</section>'
        : '') +

      (cards
        ? '<section class="liftgroup">' + cards + '</section>'
        : '<p class="empty">No movements logged for this day.<br>Pick a split above and add your first below.</p>') +

      // Add movement sits *under* the list, so the movements read in the order
      // you trained them and the next one to add is always the next thing on
      // screen rather than back up at the top.
      (locked ? '' :
        '<section class="entry" style="--catcolor:' + c.color + '">' +
          '<div class="field"><label for="mSel">Add movement · ' + esc(c.name) + '</label>' +
            '<select id="mSel">' + opts + '<option value="__new">+ New movement…</option></select></div>' +
          '<input id="mNew" class="text" placeholder="Name the movement" hidden ' +
            'style="height:46px;padding:0 10px;background:var(--surface);border:1px solid var(--rule);border-radius:2px;font-size:15px;width:100%">' +
          '<button class="btn" id="addLift">Add to today</button>' +
        '</section>') +

      // Nothing logged yet is nothing to lock in.
      (!locked && d.lifts.length
        ? '<button class="btn ghost" id="lockDay" style="width:100%">Lock in the day</button>'
        : '');

    view.querySelectorAll("[data-cat]").forEach(function (b) {
      b.addEventListener("click", function () { activeCat = b.dataset.cat; render(); });
    });

    var editSplitsBtn = document.getElementById("editSplits");
    if (editSplitsBtn) {
      editSplitsBtn.addEventListener("click", function () {
        splitEdit = !splitEdit;
        splitAdding = false;      // one thing at a time
        render();
      });
    }

    var addChip = document.getElementById("addSplitChip");
    if (addChip) {
      addChip.addEventListener("click", function () {
        splitAdding = true;
        render();
        var f = document.getElementById("newSplitName");
        if (f) f.focus();
      });
    }

    var cancelSplitBtn = document.getElementById("cancelSplit");
    if (cancelSplitBtn) {
      cancelSplitBtn.addEventListener("click", function () { splitAdding = false; render(); });
    }

    var newSplitEl = document.getElementById("newSplitName");
    var saveSplitBtn = document.getElementById("saveSplit");
    function commitNewSplit() {
      if (!newSplitEl) return;
      var id = addSplit(newSplitEl.value);
      if (!id) { newSplitEl.focus(); return; }   // an empty name is not a split
      // Land on what you just made, ready to add the first movement to it.
      activeCat = id;
      splitAdding = false;
      render();
    }
    if (saveSplitBtn) saveSplitBtn.addEventListener("click", commitNewSplit);
    if (newSplitEl) {
      newSplitEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") commitNewSplit();
      });
    }

    // Rename commits on change, the way the routine name on Coach does, so
    // there is no separate save to forget.
    view.querySelectorAll("[data-splitname]").forEach(function (el) {
      el.addEventListener("change", function () {
        if (renameSplit(el.dataset.splitname, el.value)) render();
        else el.value = cat(el.dataset.splitname).name;   // reject an empty name
      });
    });

    view.querySelectorAll("[data-rmsplit]").forEach(function (b) {
      b.addEventListener("click", function () { removeSplit(b.dataset.rmsplit); });
    });

    // The whole form is absent on a locked day, so every lookup here is
    // guarded. Reaching through a null would throw mid-render and take the
    // rest of the tab's handlers down with it.
    var sel = document.getElementById("mSel");
    var neu = document.getElementById("mNew");
    if (sel && neu) {
      sel.addEventListener("change", function () {
        neu.hidden = sel.value !== "__new";
        if (!neu.hidden) neu.focus();
      });
    }

    var addLiftBtn = document.getElementById("addLift");
    if (addLiftBtn) {
      addLiftBtn.addEventListener("click", function () {
        var name = sel.value === "__new" ? neu.value.trim() : sel.value;
        if (!name) { neu.focus(); return; }
        var mlist = store.moves[activeCat] || (store.moves[activeCat] = []);
        if (mlist.indexOf(name) === -1) mlist.push(name);
        d.lifts.push({ id: uid(), cat: activeCat, movement: name, sets: [] });
        touch(key); save(); render();
      });
    }

    // Locking is one tap each way, so it needs no undo — the way out is the
    // button that replaces it. The card persists; the confetti does not, so
    // reopening the app on a finished day does not replay someone else's
    // celebration, and a second session that day can unlock, add and re-lock.
    var lockBtn = document.getElementById("lockDay");
    if (lockBtn) {
      lockBtn.addEventListener("click", function () {
        d.gymLocked = true;
        touch(key); save(); render();
        celebrate();
      });
    }
    var unlockBtn = document.getElementById("unlockDay");
    if (unlockBtn) {
      unlockBtn.addEventListener("click", function () {
        delete d.gymLocked;
        touch(key); save(); render();
      });
    }

    view.querySelectorAll("[data-addset]").forEach(function (b) {
      b.addEventListener("click", function () { addSet(Number(b.dataset.addset)); });
    });
    view.querySelectorAll("[data-w], [data-r]").forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") addSet(Number(el.dataset.w !== undefined ? el.dataset.w : el.dataset.r));
      });
    });

    function addSet(i) {
      var w = num(view.querySelector('[data-w="' + i + '"]').value);
      var r = num(view.querySelector('[data-r="' + i + '"]').value);
      if (!r) { view.querySelector('[data-r="' + i + '"]').focus(); return; }
      d.lifts[i].sets.push({ w: w, r: r });
      touch(key); save(); render();
      var next = view.querySelector('[data-w="' + i + '"]');
      if (next) next.focus();
    }

    view.querySelectorAll("[data-set]").forEach(function (b) {
      b.addEventListener("click", function () {
        var li = Number(b.dataset.lift), si = Number(b.dataset.set);
        var lift = d.lifts[li];
        if (!lift || !lift.sets[si]) return;
        var gone = lift.sets[si];
        lift.sets.splice(si, 1);
        touch(key); save(); render();
        offerUndo("Removed " + gone.w + " × " + gone.r + " from " + lift.movement, function () {
          var l2 = day(key).lifts[li];
          if (l2) l2.sets.splice(Math.min(si, l2.sets.length), 0, gone);
          touch(key); save(); render();
        });
      });
    });

    view.querySelectorAll("[data-rmlift]").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = Number(b.dataset.rmlift);
        var gone = d.lifts[i];
        if (!gone) return;
        d.lifts.splice(i, 1);
        touch(key); save(); render();
        offerUndo("Removed " + gone.movement +
          (gone.sets.length ? " and its " + gone.sets.length + " sets" : ""), function () {
          var dd = day(key);
          dd.lifts.splice(Math.min(i, dd.lifts.length), 0, gone);
          touch(key); save(); render();
        });
      });
    });
  }

  function renderCoach() {
    var days = cats();
    var open = coachOpen;

    var dayCards = days.map(function (c, i) {
      var moves = store.moves[c.id] || [];
      var isOpen = open === c.id;

      var chips = moves.slice().sort().map(function (m) {
        return '<button class="rt-chip" data-dropmove="' + esc(c.id) + '|' + esc(m) + '">' +
          '<b>' + esc(m) + '</b><i>✕</i></button>';
      }).join("");

      var lib = LIBRARY.map(function (grp) {
        var buttons = grp.m.map(function (m) {
          var have = moves.indexOf(m) > -1;
          return '<button class="lib-add" data-addmove="' + esc(c.id) + '|' + esc(m) + '"' +
                 (have ? " disabled" : "") + '>' + (have ? "✓ " : "+ ") + esc(m) + '</button>';
        }).join("");
        return '<div class="lib-group"><h4>' + esc(grp.g) + '</h4>' +
               '<div class="rt-chiprow">' + buttons + '</div></div>';
      }).join("");

      return '<article class="rt-day" style="--daycolor:' + c.color + '">' +
        '<button class="rt-head" data-openday="' + esc(c.id) + '" ' +
          'style="width:100%;text-align:left;background:none">' +
          '<span class="nm">' + esc(c.name) + '</span>' +
          '<span class="ct">' + moves.length + (moves.length === 1 ? " movement" : " movements") +
            ' · tap to ' + (isOpen ? "close" : "edit") + '</span>' +
          '<span class="tag">' + c.tag + '</span>' +
        '</button>' +
        (isOpen
          // What you can do to the day sits at the top of the day, not buried
          // under its movement list — you should not have to scroll past a
          // library to rename the thing you just opened.
          ? '<div class="rt-moves">' +
              '<div class="rt-actions">' +
                '<button data-renameday="' + esc(c.id) + '">Rename day</button>' +
                '<button data-newmove="' + esc(c.id) + '">Add your own</button>' +
                (days.length > 1 ? '<button class="danger" data-rmday="' + esc(c.id) + '">Delete day</button>' : '') +
              '</div>' +

                ? '<div class="rt-inline">' +
