<style>
  :root {
    --ground: #E9EBE8;
    --surface: #FFFFFF;
    --surface-2: #F2F4F1;
    --ink: #141A19;
    --ink-2: #4A5551;
    --ink-3: #63706C;
    --rule: #C6CDC9;
    --rule-hard: #141A19;
    --accent: #0B6E63;
    --accent-soft: #D8E8E4;
    --cat-a: #2E5E8C;
    --cat-b: #8C4A2E;
    --cat-c: #5A6E23;
    --danger: #A03327;
    --hit: #3F7A22;
    --hit-bg: #E2EFD6;
    --miss: #A03327;
    --miss-bg: #F4E1DE;
    --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(20, 26, 25, .07), 0 8px 24px -12px rgba(20, 26, 25, .18);

    --font-ui: 'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111614;
      --surface: #191F1D;
      --surface-2: #222927;
      --ink: #E4E9E6;
      --ink-2: #A2AEA9;
      --ink-3: #8B9691;
      --rule: #2E3835;
      --rule-hard: #6D7A76;
      --accent: #56B9A9;
      --accent-soft: #17342F;
      --cat-a: #6FA3D4;
      --cat-b: #D08A65;
      --cat-c: #A3BC5E;
      --danger: #E0796B;
      --hit: #8FC46A;
      --hit-bg: #1E2C18;
      --miss: #E0796B;
      --miss-bg: #2F1D1A;
      --on-accent: #0B1614;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #111614;
    --surface: #191F1D;
    --surface-2: #222927;
    --ink: #E4E9E6;
    --ink-2: #A2AEA9;
    --ink-3: #8B9691;
    --rule: #2E3835;
    --rule-hard: #6D7A76;
    --accent: #56B9A9;
    --accent-soft: #17342F;
    --cat-a: #6FA3D4;
    --cat-b: #D08A65;
    --cat-c: #A3BC5E;
    --danger: #E0796B;
    --hit: #8FC46A;
    --hit-bg: #1E2C18;
    --miss: #E0796B;
    --miss-bg: #2F1D1A;
    --on-accent: #0B1614;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  /* iOS zooms the whole page in the moment you focus a field under 16px, and
     it does not zoom back out. Every field you can type into is 16px or more
     on a touch screen — nothing else in the app is worth the trade. */
  @media (pointer: coarse) {
    input, select, textarea { font-size: 16px !important; }
  }

  /* No 300ms wait before a tap registers, and no zoom on a double tap. */
  button, select, [role="tab"] { touch-action: manipulation; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    /* stops the rubber-band bounce dragging the whole app around */
    overscroll-behavior-y: none;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .app {
    max-width: 540px;
    margin: 0 auto;
    min-height: 100vh;      /* fallback for older iOS */
    min-height: 100dvh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    border-inline: 1px solid var(--rule);
  }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: max(env(safe-area-inset-top), 14px) 16px 10px;
  }
  .app { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .brand h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .brand h1 span {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: .06em;
    text-transform: none;
    color: var(--ink-3);
  }

  .brand .backup-btn {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    min-height: 44px;
    padding: 0 12px;
    margin: -8px -4px -8px 0;
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  .brand .backup-btn:hover { color: var(--accent); border-color: var(--accent); }

  .datenav {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 8px;
  }

  .datenav button.arrow {
    height: 44px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-size: 18px;
    line-height: 1;
    color: var(--ink-2);
    background: var(--surface-2);
  }
  .datenav button.arrow:hover { color: var(--accent); border-color: var(--accent); }

  .datelabel { text-align: center; }
  .datelabel .dow {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
  }
  .datelabel .full {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .datelabel button.today {
    display: block;
    margin: 2px auto 0;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .datelabel button.today[hidden] { display: none; }

  /* on an SE the date wrapped to two lines and pushed the app down a row */
  @media (max-width: 360px) {
    .datelabel .full { font-size: 16px; }
    .brand h1 { font-size: 12px; letter-spacing: .1em; }
  }

  /* ---------- main ---------- */
  main {
    flex: 1;
    /* clears the sticky tab bar so the last control is never sitting under it */
    padding: 18px 16px 72px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .eyebrow {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ---------- T chart ---------- */
  /* The foods get the room; the numbers get a narrow T on the right. Head, rows
     and total share one grid so every rule and every digit lines up. */
  .tchart { position: relative; }
  .t-head, .t-row, .t-total {
    display: grid;
    grid-template-columns: 1fr 76px 58px;
    align-items: center;
  }

  .t-head { border-bottom: 2px solid var(--rule-hard); padding-bottom: 6px; }
  .t-head span {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .t-head .h-food { padding-left: 10px; }
  .t-head .h-cal, .t-head .h-pro {
    text-align: center;
    padding: 0 4px;
    font-size: 9px;
    letter-spacing: .08em;
  }
  /* the left edge of the T, and its stem */
  .t-head .h-cal, .t-row .t-cal, .t-total .t-cal,
  .t-head .h-pro, .t-row .t-pro, .t-total .t-pro { border-left: 1px solid var(--rule); }

  /* the food column reads as its own box without boxing every row separately */
  .t-row {
    border-bottom: 1px solid var(--rule);
    background: linear-gradient(to right, var(--surface-2) 0 calc(100% - 134px), transparent 0);
  }

  .t-food {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    padding: 6px 0 6px 10px;
  }
  .t-food .nm {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .t-food .nm.untitled { color: var(--ink-3); }

  .t-cal, .t-pro {
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 4px;
  }
  .t-cal b, .t-pro b {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    font-weight: 500;
  }
  .t-cal b.zero, .t-pro b.zero { color: var(--ink-3); font-weight: 400; }

  .t-del {
    flex: none;
    /* 44px is the smallest reliable thumb target */
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    color: var(--ink-3);
    border-radius: 50%;
  }
  .t-del:hover { color: var(--danger); background: var(--surface); }
  .t-del:active { color: var(--danger); background: var(--miss-bg); transform: scale(.9); }

  .t-total {
    padding-top: 10px;
    margin-top: 3px;
    border-top: 3px double var(--rule-hard);
  }
  .t-total .t-label {
    padding-left: 10px;
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .t-total b {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -.02em;
  }

  .t-note { margin: 0 0 4px; font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* ---------- meals ---------- */
  .drag-hint {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-3);
  }

  /* A press-and-hold picks a row up; a plain swipe still scrolls the list. */
  .t-row { -webkit-touch-callout: none; }
  body.dragging { -webkit-user-select: none; user-select: none; }
  body.dragging .t-row { cursor: grabbing; }

  .t-row.lifted { opacity: .35; }
  .t-row.dropto {
    box-shadow: inset 0 0 0 2px var(--accent);
    border-bottom-color: var(--accent);
  }

  .drag-ghost {
    position: fixed;
    z-index: 60;
    transform: translate(-50%, -140%);
    pointer-events: none;
    max-width: 240px;
    padding: 8px 12px;
    border-radius: 3px;
    background: var(--ink);
    color: var(--surface);
    font-size: 13px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: var(--shadow);
  }

  .t-row.is-meal { background: linear-gradient(to right, var(--accent-soft) 0 calc(100% - 134px), transparent 0); }
  .t-row.is-open { border-bottom-color: var(--accent); }

  .meal-open {
    flex: 1;
    min-width: 0;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 44px;
    justify-content: center;
    padding: 2px 0;
  }
  .meal-open .mn { font-size: 14px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .meal-open .mc {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* the expanded meal spans the whole grid, under its own row */
  .meal-body {
    grid-column: 1 / -1;
    border-top: 1px solid var(--rule);
    background: var(--surface);
    padding: 4px 0 10px 10px;
  }
  /* same two number columns as the chart above, so the digits line up */
  .meal-item {
    display: grid;
    grid-template-columns: 1fr 76px 58px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .meal-item .mi-nm { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
  .meal-item .mi-n {
    text-align: center;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--ink-2);
  }
  .meal-item .mi-out {
    grid-column: 1 / -1;
    justify-self: start;
    min-height: 44px;
    padding: 0 10px 0 0;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .meal-item .mi-out:hover, .meal-item .mi-out:active { color: var(--danger); }

  .meal-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 44px;
    padding: 0 4px 0 0;
    text-align: left;
    font-size: 13px;
    color: var(--ink-2);
  }
  .meal-toggle .box {
    flex: none;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: var(--surface);
    font-size: 13px;
    line-height: 1;
    color: var(--accent);
  }
  .meal-toggle[aria-pressed="true"] { color: var(--ink); }
  .meal-toggle[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent-soft); }

  .meal-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 10px 0 0; }
  .meal-actions button {
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--surface-2);
  }
  .meal-actions button:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- first run ---------- */
  .welcome {
    border: 1px solid var(--accent);
    border-left-width: 3px;
    border-radius: 2px;
    background: var(--surface);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .welcome h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .welcome p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .welcome dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 12px;
    font-size: 13px;
    line-height: 1.45;
  }
  .welcome dt {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    padding-top: 3px;
  }
  .welcome dd { margin: 0; color: var(--ink-2); }

  /* ---------- estimator ---------- */
  .est textarea {
    width: 100%;
    min-height: 76px;
    resize: vertical;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink);
  }
  .est textarea::placeholder { color: var(--ink-3); }

  .est-note {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-3);
  }

  .working {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-num);
    font-size: 12px;
    color: var(--ink-2);
    padding: 4px 0;
  }
  .working i {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .working i { animation: none; opacity: .7; } }

  .review {
    border: 1px solid var(--accent);
    border-radius: 3px;
    overflow: hidden;
    background: var(--surface);
  }
  .review > header {
    background: var(--accent-soft);
    padding: 9px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .review > header b {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .review > header span {
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-2);
  }
  .rev-item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 4px 10px;
    align-items: center;
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
  }
  .rev-item .food { font-size: 14px; }
  .rev-item .amt {
    grid-column: 1;
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-3);
  }
  /* Only rows with a gram basis get a field here, so the flex row is scoped to
     them — the text-only rows keep flowing as plain inline text. */
  .rev-item .amt.editable {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0 6px;
  }
  .rev-item .amt.editable .pre:empty { display: none; }
  .rev-item .amt.editable input.g {
    width: 62px;
    height: 44px;          /* rule 5: it is tappable, so it is 44px */
    font-size: 14px;
    color: var(--ink);
  }
  .rev-item .amt.editable .g-unit { margin-left: -2px; }
  .rev-item input {
    width: 66px;
    height: 44px;
    padding: 0 7px;
    text-align: right;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }
  .rev-item .unit {
    grid-row: 1 / span 2;
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .rev-units {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    padding: 6px 12px 0;
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .rev-units span:nth-child(2) { width: 66px; text-align: right; }
  .rev-units span:nth-child(3) { width: 66px; text-align: right; }
  .rev-foot {
    padding: 11px 12px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .rev-assume {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-2);
  }
  .rev-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }

  .pending-chip {
    display: inline-block;
    text-align: left;
    margin-top: 3px;
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px dashed var(--rule);
    border-radius: 2px;
    padding: 2px 6px;
    background: var(--surface);
  }
  .est-badge {
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--ink-3);
  }

  .added-flash {
    margin: 0;
    padding: 9px 10px;
    border-left: 3px solid var(--hit);
    background: var(--hit-bg);
    color: var(--hit);
    font-family: var(--font-num);
    font-size: 12px;
    line-height: 1.45;
  }
  .added-flash span {
    display: block;
    color: var(--ink-2);
    font-size: 11px;
    margin-top: 2px;
  }

  .src-tag {
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .src-tag.pantry { color: var(--accent); }
  .src-tag.table { color: var(--ink-3); }
  .src-tag.typical { color: var(--cat-b); }
  .src-tag.claude { color: var(--ink-3); }
  .src-tag.unknown { color: var(--miss); }

  /* ---------- coach ---------- */
  .rt-day {
    border: 1px solid var(--rule);
    border-left: 4px solid var(--daycolor);
    border-radius: 0 3px 3px 0;
    background: var(--surface);
    overflow: hidden;
  }
  .rt-head {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 10px;
    padding: 11px 12px;
  }
  .rt-head .nm { font-size: 15px; font-weight: 600; }
  .rt-head .ct {
    grid-column: 1;
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-3);
  }
  .rt-head .tag {
    grid-row: 1 / span 2;
    grid-column: 2;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--daycolor);
    min-height: 44px;
    display: flex;
    align-items: center;
    padding: 0 4px;
  }
  .rt-moves {
    border-top: 1px solid var(--rule);
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* Naming a day or a movement, in place. Wraps on a narrow phone rather than
     squeezing the field down to nothing. */
  .rt-inline {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    align-items: center;
  }
  .rt-inline .text { min-width: 0; }
  .rt-inline .btn { padding: 0 14px; }
  @media (max-width: 359px) {
    .rt-inline { grid-template-columns: 1fr auto; }
    .rt-inline .text { grid-column: 1 / -1; }
  }

  .rt-chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
  .rt-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 44px;
    padding: 0 10px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-size: 13px;
    color: var(--ink);
  }
  .rt-chip b { font-weight: 400; }
  .rt-chip i {
    font-style: normal;
    font-family: var(--font-num);
    font-size: 14px;
    color: var(--ink-3);
  }
  .rt-chip:hover, .rt-chip:active { border-color: var(--danger); }
  .rt-chip:hover i, .rt-chip:active i { color: var(--danger); }

  .rt-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .rt-actions button {
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--surface);
  }
  .rt-actions button:hover { color: var(--accent); border-color: var(--accent); }
  /* Distinct at rest, not only on hover. There is no hover on a phone, and
     these actions now sit at the top of the day where the thumb lands first —
     a delete that looks exactly like a rename is a mis-tap waiting to happen,
     even with undo behind it. */
  .rt-actions button.danger { color: var(--danger); }
  .rt-actions button.danger:hover { border-color: var(--danger); }

  .lib-group { border-top: 1px solid var(--rule); padding-top: 10px; }
  .lib-group h4 {
    margin: 0 0 7px;
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .lib-add {
    min-height: 44px;
    padding: 0 10px;
    border: 1px dashed var(--rule);
    border-radius: 2px;
    background: var(--surface);
    font-size: 13px;
    color: var(--ink-2);
  }
  .lib-add:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
  .lib-add[disabled] { opacity: .4; }

  /* ---------- pantry ---------- */
  /* Three rows — name, macros, sub-line — stacked in the middle column, with
     the + spanning all three on the left and Remove spanning the first two on
     the right. Every cell is placed explicitly; leaving them to auto-placement
     around the two spanning buttons is what made this hard to read before. */
  .pan-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 3px 12px;
    align-items: baseline;
    padding: 11px 2px;
    border-bottom: 1px solid var(--rule);
  }
  .pan-item .add {
    grid-column: 1;
    grid-row: 1 / -1;
    align-self: center;
    min-width: 44px;
    min-height: 44px;
    font-family: var(--font-num);
    font-size: 20px;
    line-height: 1;
    color: var(--accent);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  .pan-item .add:hover, .pan-item .add:active {
    color: var(--on-accent);
    background: var(--accent);
    border-color: var(--accent);
  }
  /* Held for 1.4s after a tap. Adding from here lands the row on a tab you
     cannot see, so the button itself has to say it worked — rule 3. */
  .pan-item .add.is-done {
    color: var(--on-accent);
    background: var(--hit);
    border-color: var(--hit);
  }
  /* A record with impossible numbers gets no +; this keeps the rest aligned. */
  .pan-item .add-gap { grid-column: 1; grid-row: 1 / -1; min-width: 44px; }
  .pan-item .nm { grid-column: 2; grid-row: 1; font-size: 15px; font-weight: 500; }
  .pan-item .macros {
    grid-column: 2;
    grid-row: 2;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .pan-item .sub {
    grid-column: 2 / -1;
    grid-row: 3;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--ink-3);
  }
  .pan-item .rm {
    grid-row: 1 / 3;
    grid-column: 3;
    align-self: center;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    min-height: 44px;
    padding: 0 10px;
    margin-right: -10px;
  }
  .pan-item .rm:hover, .pan-item .rm:active { color: var(--danger); }

  .photo-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: 1px dashed var(--accent);
    border-radius: 2px;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--font-num);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-align: center;
  }
  .photo-btn:hover { filter: brightness(.97); }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* ---------- goal strip ---------- */
  .goalbar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 12px;
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }
  .goalbar::before {
    content: "";
    position: absolute;
    left: 50%; top: 10px; bottom: 0;
    width: 1px;
    background: var(--rule);
    transform: translateX(-.5px);
  }
  .goalcell { padding: 0 16px; display: flex; flex-direction: column; gap: 5px; }
  .goalcell.left { text-align: right; align-items: flex-end; }
  .goalcell.right { text-align: left; align-items: flex-start; }
  .goaltarget {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-2);
  }
  .goaltarget .dir { font-weight: 600; }
  .goalstat {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .04em;
  }
  .goalstat.hit { color: var(--hit); }
  .goalstat.miss { color: var(--miss); }
  .goalstat.none { color: var(--ink-3); }
  .meter {
    width: 100%;
    height: 3px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter i { display: block; height: 100%; background: var(--ink-3); }
  .meter i.hit { background: var(--hit); }
  .meter i.miss { background: var(--miss); }

  .goaledit-open {
    display: block;
    width: 100%;
    margin-top: 10px;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    min-height: 44px;
    padding: 7px;
    border: 1px dashed var(--rule);
    border-radius: 2px;
  }
  .goaledit-open:hover { color: var(--accent); border-color: var(--accent); }

  .dirtoggle { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .dirtoggle button {
    height: 46px;
    border: 1px solid var(--rule);
    font-family: var(--font-num);
    font-size: 12px;
    color: var(--ink-3);
    background: var(--surface);
  }
  .dirtoggle button:first-child { border-radius: 2px 0 0 2px; }
  .dirtoggle button:last-child { border-radius: 0 2px 2px 0; margin-left: -1px; }
  .dirtoggle button[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--accent);
    background: var(--accent-soft);
    position: relative;
    z-index: 1;
  }

  /* ---------- year calendar ---------- */
  .yearnav {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 8px;
  }
  .yearnav button {
    height: 44px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink-2);
    font-size: 15px;
  }
  .yearnav button:hover { color: var(--accent); border-color: var(--accent); }
  .yearnav .y {
    text-align: center;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  .yearstats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .yearstats div { background: var(--surface); padding: 9px 8px; text-align: center; }
  .yearstats b {
    display: block;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 19px;
    font-weight: 600;
  }
  .yearstats span {
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .months { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 14px; }
  @media (min-width: 470px) { .months { grid-template-columns: repeat(3, 1fr); } }

  .month h4 {
    margin: 0 0 5px;
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .month.is-now h4 { color: var(--accent); }
  .dow-row, .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .dow-row span {
    font-family: var(--font-num);
    font-size: 8px;
    text-align: center;
    color: var(--ink-3);
    padding-bottom: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border-radius: 2px;
    background: var(--surface-2);
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 9px;
    line-height: 1;
    color: var(--ink-3);
    padding: 0;
    border: 1px solid transparent;
  }
  .cal-cell.blank { background: none; }
  .cal-cell.hit { background: var(--hit-bg); color: var(--hit); font-weight: 600; }
  .cal-cell.miss { background: var(--miss-bg); color: var(--miss); font-weight: 600; }
  .cal-cell.future { background: none; color: var(--ink-3); opacity: .45; }
  .cal-cell.is-today {
    border-color: var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
    color: var(--ink);
    font-weight: 700;
  }
  .cal-cell:not(.blank):hover { border-color: var(--accent); }
  .cal-cell .bar {
    width: 60%;
    height: 2px;
    border-radius: 1px;
    background: var(--barcolor, transparent);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--ink-3);
    padding-top: 2px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i {
    width: 10px; height: 10px;
    border-radius: 2px;
    display: inline-block;
  }
  .legend i.line { height: 3px; width: 12px; border-radius: 1px; }

  .empty {
    padding: 22px 8px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-3);
    line-height: 1.6;
  }

  /* ---------- entry forms ---------- */
  .entry {
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .entry .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .field input, .field select {
    width: 100%;
    height: 46px;
    padding: 0 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
  }
  .field input.text { font-family: var(--font-ui); font-size: 15px; }
  .field select { font-family: var(--font-ui); font-size: 15px; }
  .field input::placeholder { color: var(--ink-3); }

  .btn {
    height: 46px;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 2px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-family: var(--font-num);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost {
    background: none;
    color: var(--ink-2);
    border: 1px solid var(--rule);
  }
  .btn.ghost:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- gym ---------- */
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat {
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 9px 6px;
    text-align: center;
    line-height: 1.25;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    background: var(--surface);
  }
  .cat .tag {
    display: block;
    font-family: var(--font-num);
    font-size: 9px;
    letter-spacing: .16em;
    margin-bottom: 3px;
    color: var(--catcolor);
  }
  .cat[aria-pressed="true"] {
    border-color: var(--catcolor);
    box-shadow: inset 0 0 0 1px var(--catcolor);
    color: var(--ink);
  }
  /* min-height keeps the + box the same size as the splits beside it even
     though it carries one word instead of two lines. */
  .cat { min-height: 52px; }
  .cat-add {
    --catcolor: var(--accent);
    border-style: dashed;
    color: var(--accent);
  }
  .cat-add .tag { font-size: 13px; letter-spacing: 0; }

  .split-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .split-head button {
    min-height: 44px;
    padding: 0 10px;
    margin-right: -10px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px solid transparent;
    border-radius: 2px;
  }
  .split-head button:hover { color: var(--accent); border-color: var(--rule); }

  .split-list { display: flex; flex-direction: column; gap: 8px; }
  .split-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
  }
  .split-tag {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .14em;
    color: var(--catcolor);
    min-width: 12px;
  }
  .split-name {
    height: 46px;              /* 16px font: never lets iOS zoom the page */
    padding: 0 10px;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    min-width: 0;
  }
  .split-rm {
    min-height: 44px;
    padding: 0 12px;
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 2px;
    white-space: nowrap;
  }
  .split-rm:hover { color: var(--danger); border-color: var(--danger); }
  /* The last split cannot go: with none left there is nothing to log under. */
  .split-keep {
    font-family: var(--font-num);
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-3);
    white-space: nowrap;
  }

  .split-new { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
  .split-new .btn { padding: 0 14px; }

  .liftgroup { display: flex; flex-direction: column; gap: 12px; }

  .lift {
    display: grid;
    grid-template-columns: 5px 1fr;
    gap: 0 12px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-left: none;
    border-radius: 0 3px 3px 0;
    overflow: hidden;
  }
  .lift .spine { background: var(--catcolor); }
  .lift .body { padding: 11px 12px 12px 0; min-width: 0; }

  .lift-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .lift-head h3 {
    margin: 0;
    font-size: 15px;

<script>
(function () {
  "use strict";

  var KEY = "iron-ledger-v1";
  var BUILD = "2026-09-06.21";

  // A routine is a list of training days. It is the ONLY place a split is
  // defined — the Gym tab renders whatever is here. The three starting days
  // keep their original ids so workouts logged before routines existed still
  // resolve to the right day.
  var DAY_COLORS = ["var(--cat-a)", "var(--cat-b)", "var(--cat-c)",
                    "var(--accent)", "var(--cat-a)", "var(--cat-b)", "var(--cat-c)"];

  var DEFAULT_ROUTINE = {
    name: "My split",
    days: [
      { id: "back", name: "Back / Bi / Rear Delt", short: "Back · Bi · RD" },
      { id: "push", name: "Chest / Shoulder / Tri", short: "Chest · Sh · Tri" },
      { id: "legs", name: "Legs", short: "Legs" }
    ]
  };

  var SEED_MOVES = {
    back: ["Barbell Row", "Lat Pulldown", "Seated Cable Row", "Pull-Up", "T-Bar Row",
           "Straight-Arm Pulldown", "Face Pull", "Rear Delt Fly", "Shrug",
           "Barbell Curl", "Dumbbell Curl", "Hammer Curl", "Preacher Curl"],
    push: ["Bench Press", "Incline DB Press", "Cable Fly", "Dip", "Overhead Press",
           "DB Shoulder Press", "Lateral Raise", "Cable Lateral Raise",
           "Triceps Pushdown", "Skullcrusher", "Overhead Triceps Ext", "Close-Grip Bench"],
    legs: ["Back Squat", "Front Squat", "Hack Squat", "Leg Press", "Romanian Deadlift",
           "Leg Curl", "Leg Extension", "Walking Lunge", "Bulgarian Split Squat",
           "Hip Thrust", "Standing Calf Raise"]
  };

  // Browsable movement library for building a day, grouped the way people think
  // about training rather than by equipment.
  var LIBRARY = [
    { g: "Chest", m: ["Bench Press", "Incline Bench Press", "Decline Bench Press", "Dumbbell Bench Press",
        "Incline DB Press", "Machine Chest Press", "Cable Fly", "Pec Deck", "Dumbbell Fly",
        "Dip", "Push-Up", "Svend Press"] },
    { g: "Back", m: ["Deadlift", "Barbell Row", "Pendlay Row", "T-Bar Row", "Seated Cable Row",
        "Chest-Supported Row", "Meadows Row", "Single-Arm DB Row", "Lat Pulldown",
        "Close-Grip Pulldown", "Pull-Up", "Chin-Up", "Straight-Arm Pulldown", "Shrug", "Rack Pull"] },
    { g: "Shoulders", m: ["Overhead Press", "DB Shoulder Press", "Arnold Press", "Machine Shoulder Press",
        "Lateral Raise", "Cable Lateral Raise", "Front Raise", "Rear Delt Fly", "Face Pull",
        "Reverse Pec Deck", "Upright Row"] },
    { g: "Biceps", m: ["Barbell Curl", "EZ-Bar Curl", "Dumbbell Curl", "Hammer Curl", "Incline DB Curl",
        "Preacher Curl", "Cable Curl", "Concentration Curl", "Spider Curl"] },
    { g: "Triceps", m: ["Close-Grip Bench", "Triceps Pushdown", "Rope Pushdown", "Skullcrusher",
        "Overhead Triceps Ext", "Dumbbell Kickback", "Bench Dip", "JM Press"] },
    { g: "Quads", m: ["Back Squat", "Front Squat", "Hack Squat", "Leg Press", "Bulgarian Split Squat",
        "Walking Lunge", "Reverse Lunge", "Step-Up", "Leg Extension", "Goblet Squat", "Sissy Squat"] },
    { g: "Hamstrings", m: ["Romanian Deadlift", "Stiff-Leg Deadlift", "Lying Leg Curl", "Seated Leg Curl",
        "Nordic Curl", "Good Morning", "Glute-Ham Raise"] },
    { g: "Glutes", m: ["Hip Thrust", "Glute Bridge", "Cable Kickback", "Sumo Deadlift",
        "Bulgarian Split Squat", "Abduction Machine"] },
    { g: "Calves", m: ["Standing Calf Raise", "Seated Calf Raise", "Leg Press Calf Raise", "Donkey Calf Raise"] },
    { g: "Core", m: ["Hanging Leg Raise", "Cable Crunch", "Plank", "Ab Wheel", "Russian Twist",
        "Decline Sit-Up", "Pallof Press", "Side Plank"] },
    { g: "Conditioning", m: ["Treadmill", "Incline Walk", "Stair Master", "Rowing Machine",
        "Assault Bike", "Cycling", "Elliptical", "Jump Rope", "Sled Push", "Farmer's Carry"] }
  ];

  // ---------- state ----------
  var DEFAULT_GOAL = { cal: { dir: "-", v: 2000 }, pro: { dir: "+", v: 150 } };

  var REGIONS = ["United States", "Canada", "Mexico", "United Kingdom", "Ireland", "Australia",
    "New Zealand", "Germany", "France", "Spain", "Italy", "Portugal", "Netherlands", "Belgium",
    "Switzerland", "Austria", "Sweden", "Norway", "Denmark", "Finland", "Poland", "Czechia",
    "Greece", "Turkey", "Israel", "United Arab Emirates", "Saudi Arabia", "Egypt", "South Africa",
    "Nigeria", "Kenya", "India", "Pakistan", "Bangladesh", "China", "Japan", "South Korea",
    "Taiwan", "Hong Kong", "Singapore", "Malaysia", "Indonesia", "Thailand", "Vietnam",
    "Philippines", "Brazil", "Argentina", "Chile", "Colombia", "Peru"];

  var store = { days: {}, moves: null, goal: null, region: null, pantry: null, v: 1 };
  var cursor = new Date();
  var tab = "macros";
  var activeCat = "back";
  var logYear = new Date().getFullYear();
  var editingGoal = false;
  var db = null;
  var sampleFn = null;
  var syncTimer = null;
  // { status: 'loading' | 'review' | 'error', text, items, note, message, replacing }
  var est = null;
  var estDraft = "";
  var estAsMeal = false;   // commit the estimate as one meal rather than separate rows
  var pantryForm = null;
  var coachOpen = null;
  // Gym split editing. Transient view state, never saved: reopening the app
  // should show you your splits, not the half-finished act of renaming one.
  var splitEdit = false;
  var splitAdding = false;
  // Coach inline editing, same idea: which day is being renamed, which is
  // taking a custom movement, and whether a new day is being named.
  var coachRename = null;
  var coachNewMove = null;
  var coachAdding = false;
  var pantryShot = null;
  var canSendImages = false;
  var imageTypes = "image/*";
  var lastError = null;
  var lastAdded = null;
  var pendingUndo = null;
  var openMeal = null;    // which meal is expanded on the Macros tab
  var drag = null;        // the row currently being dragged, if any

  function ymd(d) {
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function parseYmd(s) {
    var p = s.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  var TODAY = ymd(new Date());

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") store = parsed;
      }
    } catch (e) { /* fresh start */ }
    if (!store.days) store.days = {};
    if (!store.moves) store.moves = JSON.parse(JSON.stringify(SEED_MOVES));
    store.goal = normGoal(store.goal);   // repairs a partial goal instead of tripping on it
    if (!store.region) store.region = "United States";
    if (!store.pantry) store.pantry = [];
    if (!store.retired) store.retired = {};
    // Rows are addressed by id, so make sure every one has one.
    Object.keys(store.days).forEach(function (k) {
      (store.days[k].food || []).forEach(function (f) {
        if (!f.id) f.id = uid();
        if (f.items) f.items.forEach(function (x) { if (!x.id) x.id = uid(); });
      });
    });
    if (!store.routine || !store.routine.days || !store.routine.days.length) {
      store.routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
    }
    store.routine.days.forEach(function (dy) {
      if (!store.moves[dy.id]) store.moves[dy.id] = (SEED_MOVES[dy.id] || []).slice();
    });
  }

  function save() {
    store.build = BUILD;   // so a backup always says which version wrote it
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* quota */ }
    queueSync();
  }

  function day(key) {
    if (!store.days[key]) store.days[key] = { food: [], lifts: [], updated: 0 };
    var d = store.days[key];
    if (!d.food) d.food = [];
    if (!d.lifts) d.lifts = [];
    return d;
  }
  function touch(key) { day(key).updated = Date.now(); }

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function num(v) { var n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; }
  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
  // The active routine's days, decorated for display.
  function cats() {
    var days = (store.routine && store.routine.days) ? store.routine.days : DEFAULT_ROUTINE.days;
    return days.map(function (d, i) {
      return {
        id: d.id,
        tag: String.fromCharCode(65 + i),
        name: d.name,
        short: d.short || d.name,
        color: DAY_COLORS[i % DAY_COLORS.length]
      };
    });
  }

  // A workout logged under a day that has since been renamed away or deleted
  // must still say what it was — never silently relabel it as another day.
  function cat(id) {
    var found = cats().filter(function (c) { return c.id === id; })[0];
    if (found) return found;
    // The day is gone from the routine, but the workout still happened. Look up
    // the name it was logged under so old sessions read the way they were logged.
    var was = (store.retired && store.retired[id]) || "Removed day";
    return { id: id, tag: "–", name: was, short: was,
             color: "var(--ink-3)", gone: true };
  }

  // Splits are edited from two places — the chips on the Gym tab and the
  // builder on Coach — so the three operations live here once. A second
  // implementation is how the two would quietly drift apart, and only one of
  // them would remember to write store.retired.
  function shortName(n) { return n.length > 18 ? n.slice(0, 17) + "…" : n; }

  function addSplit(name) {
    var n = (name || "").trim();
    if (!n) return null;
    var id = "d" + uid();
    store.routine.days.push({ id: id, name: n, short: shortName(n) });
    store.moves[id] = [];       // a new split starts empty; nothing is assumed
    save();
    return id;
  }

  function renameSplit(id, name) {
    var n = (name || "").trim();
    var dy = store.routine.days.filter(function (x) { return x.id === id; })[0];
    if (!n || !dy || dy.name === n) return false;
    dy.name = n;
    dy.short = shortName(n);
    // Not touching store.retired: the split still exists, so every workout
    // logged under it follows the new name. Rule 7 only bites on deletion.
    save();
    return true;
  }

  function removeSplit(id) {
    var idx = -1;
    store.routine.days.forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx === -1) return false;
    var gone = store.routine.days[idx];
    var goneMoves = store.moves[id];
    store.routine.days.splice(idx, 1);
    // Remember what it was called so workouts logged under it stay readable
    // instead of being relabelled as a day you still train.
    store.retired[id] = gone.name;
    if (coachOpen === id) coachOpen = null;
    if (activeCat === id && store.routine.days.length) activeCat = store.routine.days[0].id;
    save(); render();
    offerUndo("Deleted " + gone.name, function () {
      store.routine.days.splice(Math.min(idx, store.routine.days.length), 0, gone);
      if (goneMoves) store.moves[id] = goneMoves;
      delete store.retired[id];
      activeCat = id;
      save(); render();
    });
    return true;
  }

  // A meal is a row that holds other rows. Its numbers are always read through
  // from what is inside it, so a meal can never drift out of step with its items.
