                    '<button class="btn" id="rtRenameSave">Save</button>' +
                    '<button class="btn ghost" id="rtRenameCancel">Cancel</button>' +
                  '</div>'
                : '') +
              (coachNewMove === c.id
                ? '<div class="rt-inline">' +
                    '<input class="text" id="rtNewMove" placeholder="Name the movement" ' +
                      'aria-label="Name the movement">' +
                    '<button class="btn" id="rtNewMoveSave">Add</button>' +
                    '<button class="btn ghost" id="rtNewMoveCancel">Cancel</button>' +
                  '</div>'
                : '') +
              (chips
                ? '<div class="rt-chiprow">' + chips + '</div>'
                : '<p class="est-note">No movements yet — add your own above, or take one from the library below.</p>') +
              lib +
            '</div>'
          : '') +
      '</article>';
    }).join("");

    view.innerHTML =
      '<section style="display:flex;flex-direction:column;gap:10px">' +
        '<span class="eyebrow">Your routine</span>' +
        '<div class="field"><label for="rtName">Call it what you like</label>' +
          '<input id="rtName" class="text" value="' + esc(store.routine.name || "My split") + '"></div>' +
        '<p class="est-note">These are the days you train. Whatever you build here is what shows up ' +
          'on the Gym tab — rename them, add days, and stock each one with the movements you actually do.</p>' +
      '</section>' +

      '<section style="display:flex;flex-direction:column;gap:12px">' + dayCards + '</section>' +

      (coachAdding
        ? '<section class="rt-inline">' +
            '<input class="text" id="rtNewDay" placeholder="Push, Legs, Walk, Yoga…" ' +
              'aria-label="Name the new day">' +
            '<button class="btn" id="rtNewDaySave">Add</button>' +
            '<button class="btn ghost" id="rtNewDayCancel">Cancel</button>' +
          '</section>'
        : '') +

      '<section class="rt-actions">' +
        '<button id="addDay">+ Add a training day</button>' +
        '<button id="resetRoutine">Start over</button>' +
      '</section>';

    var nameEl = document.getElementById("rtName");
    if (nameEl) {
      var saveName = function () {
        var v = nameEl.value.trim();
        if (v && v !== store.routine.name) { store.routine.name = v; save(); }
      };
      nameEl.addEventListener("change", saveName);
      nameEl.addEventListener("blur", saveName);
    }

    view.querySelectorAll("[data-openday]").forEach(function (b) {
      b.addEventListener("click", function () {
        coachOpen = (coachOpen === b.dataset.openday) ? null : b.dataset.openday;
        render();
      });
    });

    view.querySelectorAll("[data-addmove]").forEach(function (b) {
      b.addEventListener("click", function () {
        var parts = b.dataset.addmove.split("|");
        var list = store.moves[parts[0]] || (store.moves[parts[0]] = []);
        if (list.indexOf(parts[1]) === -1) { list.push(parts[1]); save(); render(); }
      });
    });

    view.querySelectorAll("[data-dropmove]").forEach(function (b) {
      b.addEventListener("click", function () {
        var parts = b.dataset.dropmove.split("|");
        var list = store.moves[parts[0]] || [];
        var i = list.indexOf(parts[1]);
        if (i === -1) return;
        list.splice(i, 1);
        save(); render();
        offerUndo("Removed " + parts[1], function () {
          (store.moves[parts[0]] || []).push(parts[1]); save(); render();
        });
      });
    });

    // Naming happens in a field, not a system dialog. window.prompt is a poor
    // thing to meet on a phone, and it is the one modal this app had left.
    view.querySelectorAll("[data-newmove]").forEach(function (b) {
      b.addEventListener("click", function () {
        coachNewMove = (coachNewMove === b.dataset.newmove) ? null : b.dataset.newmove;
        coachRename = null;
        render();
        var f = document.getElementById("rtNewMove");
        if (f) f.focus();
      });
    });

    view.querySelectorAll("[data-renameday]").forEach(function (b) {
      b.addEventListener("click", function () {
        coachRename = (coachRename === b.dataset.renameday) ? null : b.dataset.renameday;
        coachNewMove = null;
        render();
        var f = document.getElementById("rtRename");
        if (f) { f.focus(); f.select(); }
      });
    });

    function wire(inputId, saveId, cancelId, commit) {
      var input = document.getElementById(inputId);
      var saveBtn = document.getElementById(saveId);
      var cancelBtn = document.getElementById(cancelId);
      if (!input) return;
      function go() { commit(input.value, input); }
      if (saveBtn) saveBtn.addEventListener("click", go);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      if (cancelBtn) {
        cancelBtn.addEventListener("click", function () {
          coachRename = null; coachNewMove = null; coachAdding = false; render();
        });
      }
    }

    wire("rtRename", "rtRenameSave", "rtRenameCancel", function (v, input) {
      if (!renameSplit(coachRename, v)) { input.focus(); return; }
      coachRename = null;
      render();
    });

    wire("rtNewMove", "rtNewMoveSave", "rtNewMoveCancel", function (v, input) {
      var name = (v || "").trim();
      var id = coachNewMove;
      if (!name || !id) { input.focus(); return; }
      var list = store.moves[id] || (store.moves[id] = []);
      if (list.indexOf(name) === -1) list.push(name);
      coachNewMove = null;
      save(); render();
    });

    wire("rtNewDay", "rtNewDaySave", "rtNewDayCancel", function (v, input) {
      var id = addSplit(v);
      if (!id) { input.focus(); return; }
      coachAdding = false;
      coachOpen = id;          // open it, ready to be stocked
      activeCat = id;
      render();
    });

    view.querySelectorAll("[data-rmday]").forEach(function (b) {
      b.addEventListener("click", function () { removeSplit(b.dataset.rmday); });
    });

    document.getElementById("addDay").addEventListener("click", function () {
      coachAdding = !coachAdding;
      coachRename = null; coachNewMove = null;
      render();
      var f = document.getElementById("rtNewDay");
      if (f) f.focus();
    });

    document.getElementById("resetRoutine").addEventListener("click", function () {
      var before = JSON.parse(JSON.stringify({ r: store.routine, m: store.moves }));
      store.routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
      store.routine.days.forEach(function (dy) {
        if (!store.moves[dy.id]) store.moves[dy.id] = (SEED_MOVES[dy.id] || []).slice();
      });
      coachOpen = null;
      save(); render();
      offerUndo("Reset to the starting split", function () {
        store.routine = before.r; store.moves = before.m; save(); render();
      });
    });
  }

  function renderPantry() {
    var list = (store.pantry || []).slice().sort(function (a, b) {
      return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
    });

    var rows = list.map(function (raw) {
      var n = normPantry(raw);
      var bad = n.k && (n.k > 900 || n.p > 90);

      var right = bad ? "check this"
        : n.k ? Math.round(n.k) + ' kcal · ' + Math.round(n.p) + ' g <span style="color:var(--ink-3)">/100 g</span>'
              : Math.round(n.sCal) + ' kcal · ' + Math.round(n.sPro) + ' g <span style="color:var(--ink-3)">/' + esc(n.unit) + '</span>';

      var sub = bad
        ? "Saved as a weight when it isn’t one. Tap Fix and pick the container."
        : (n.kind === "count"
            ? "1 " + n.unit + " · " + Math.round(n.sCal) + " kcal · " + Math.round(n.sPro) + " g protein"
            : n.qty + " " + n.unit + " · " + Math.round(n.sCal) + " kcal · " + Math.round(n.sPro) + " g protein");

      // One tap logs exactly the serving the sub-line describes. A record with
      // impossible numbers gets a spacer instead — logging it would write
      // nonsense into the day, and Fix has to happen first.
      var addBtn = bad
        ? '<span class="add-gap" aria-hidden="true"></span>'
        : '<button class="add" data-addpan="' + raw.id + '" aria-label="Add ' +
            esc(raw.name) + ' to this day">+</button>';

      return '<div class="pan-item"' + (bad ? ' style="background:var(--miss-bg)"' : '') + '>' +
        addBtn +
        '<span class="nm">' + esc(raw.name) + '</span>' +
        '<span class="macros"' + (bad ? ' style="color:var(--miss)"' : '') + '>' + right + '</span>' +
        '<span class="sub"' + (bad ? ' style="color:var(--miss)"' : '') + '>' + esc(sub) + '</span>' +
        '<button class="rm" data-' + (bad ? 'fixpan' : 'rmpan') + '="' + raw.id + '">' +
          (bad ? "Fix" : "Remove") + '</button>' +
      '</div>';
    }).join("");

    var photoBlock = "";
    if (pantryShot && pantryShot.status === "loading") {
      photoBlock = '<div class="working"><i></i>Reading the label…</div>';
    } else if (canSendImages) {
      photoBlock =
        '<button class="photo-btn" id="shotBtn">📷 Read a nutrition label</button>' +
        '<input type="file" id="shotFile" accept="' + esc(imageTypes) + '" capture="environment" hidden>' +
        (pantryShot && pantryShot.status === "error"
          ? '<p class="est-note" style="color:var(--miss)">' + esc(pantryShot.message) + '</p>'
          : '<p class="est-note">Photograph the nutrition panel and the numbers come back filled in below. Check them against the package before saving — small print and glare both cost accuracy.</p>');
    } else {
      photoBlock = '<p class="est-note">Photo reading isn’t available in this window — type the three numbers off the package instead. Once saved they work everywhere, offline.</p>';
    }

    var f = pantryForm || { name: "", servingG: "", cal: "", pro: "" };

    view.innerHTML =
      '<section style="display:flex;flex-direction:column;gap:12px">' +
        '<span class="eyebrow">Add a food you buy often</span>' +
        photoBlock +
        '<div class="entry">' +
          '<div class="field"><label for="panName">Type and save it</label>' +
            '<input id="panName" class="text" placeholder="What do you usually eat?" value="' + esc(f.name) + '"></div>' +
          '<div class="pair">' +
            '<div class="field"><label for="panServe">One serving is</label>' +
              '<input id="panServe" inputmode="decimal" placeholder="1" value="' + esc(f.servingG) + '"></div>' +
            '<div class="field"><label for="panUnit">Measured in</label>' +
              '<select id="panUnit">' +
                '<optgroup label="Pre-made — no weighing">' +
                  COUNT_UNITS.map(function (u) {
                    return '<option value="' + u + '"' + (f.unit === u ? " selected" : "") + '>' + u + '</option>';
                  }).join("") +
                '</optgroup>' +
                '<optgroup label="By weight">' +
                  ["g", "oz", "lb"].map(function (u) {
                    return '<option value="' + u + '"' + (f.unit === u ? " selected" : "") + '>' + u + '</option>';
                  }).join("") +
                '</optgroup>' +
                '<optgroup label="By volume">' +
                  ["ml", "fl oz"].map(function (u) {
                    return '<option value="' + u + '"' + (f.unit === u ? " selected" : "") + '>' + u + '</option>';
                  }).join("") +
                '</optgroup>' +
              '</select></div>' +
          '</div>' +
          '<div class="pair">' +
            '<div class="field"><label for="panCal">Calories per serving</label>' +
              '<input id="panCal" inputmode="numeric" placeholder="220" value="' + esc(f.cal) + '"></div>' +
            '<div class="field"><label for="panPro">Protein · g</label>' +
              '<input id="panPro" inputmode="numeric" placeholder="34" value="' + esc(f.pro) + '"></div>' +
          '</div>' +
          '<p class="est-note">For anything pre-made, leave it at <strong>1</strong> and pick the container — bottle, bar, can. ' +
            'Only reach for grams or ounces when it’s something you actually portion out yourself, like rice or meat.</p>' +
          '<p class="est-note" id="panWarn" hidden style="color:var(--miss)"></p>' +
          '<button class="btn" id="savePan">Save to pantry</button>' +
        '</div>' +
      '</section>' +

      '<section style="display:flex;flex-direction:column;gap:8px">' +
        '<span class="eyebrow">' + (list.length ? list.length + (list.length === 1 ? ' food saved' : ' foods saved') : 'Nothing saved yet') + '</span>' +
        (rows || '<p class="empty">Foods you save here are matched first — ahead of the built-in reference — every time you describe a meal.</p>') +
      '</section>';

    var shotBtn = document.getElementById("shotBtn");
    if (shotBtn) {
      var shotFile = document.getElementById("shotFile");
      shotBtn.addEventListener("click", function () { shotFile.click(); });
      shotFile.addEventListener("change", function () {
        if (shotFile.files && shotFile.files[0]) readLabel(shotFile.files[0]);
      });
    }

    var FIELD = { panName: "name", panServe: "servingG", panCal: "cal", panPro: "pro", panUnit: "unit" };
    ["panName", "panServe", "panCal", "panPro", "panUnit"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var handler = function () {
        pantryForm = pantryForm || { name: "", servingG: "", cal: "", pro: "", unit: "" };
        pantryForm[FIELD[id]] = el.value;
      };
      el.addEventListener("input", handler);
      el.addEventListener("change", handler);
    });

    view.querySelectorAll("[data-fixpan]").forEach(function (b) {
      b.addEventListener("click", function () {
        var raw = store.pantry.filter(function (x) { return x.id === b.dataset.fixpan; })[0];
        if (!raw) return;
        var n = normPantry(raw);
        // Keep the numbers, drop the bad weight, let him name the container.
        pantryForm = { name: raw.name, servingG: "1", unit: "bottle",
                       cal: String(Math.round(n.sCal)), pro: String(Math.round(n.sPro)) };
        store.pantry = store.pantry.filter(function (x) { return x.id !== b.dataset.fixpan; });
        save(); render();
        var nameEl = document.getElementById("panName");
        if (nameEl) nameEl.scrollIntoView({ block: "center" });
      });
    });

    document.getElementById("savePan").addEventListener("click", function () {
      var name = document.getElementById("panName").value.trim();
      var serve = num(document.getElementById("panServe").value);
      var kcal = num(document.getElementById("panCal").value);
      var pro = Math.max(0, Number(document.getElementById("panPro").value) || 0);
      var warn = document.getElementById("panWarn");
      function complain(msg, focusId) {
        if (warn) { warn.hidden = false; warn.textContent = msg; }
        var el = document.getElementById(focusId);
        if (el) { el.focus(); el.select && el.select(); }
      }
      var unit = document.getElementById("panUnit").value;
      var kind = unitKind(unit);

      if (!name) { complain("Give it a name first.", "panName"); return; }
      if (!serve) { complain("How much is one serving? For anything pre-made that's just 1.", "panServe"); return; }
      if (!kcal) { complain("Calories per serving, straight off the panel.", "panCal"); return; }

      // A gram figure, when the unit gives us one — that's what lets you later
      // ask for this food by weight. Volume is taken at roughly 1 g per ml.
      var serveG = null;
      if (kind === "weight") serveG = serve * WEIGHT_UNITS[unit];
      else if (kind === "volume") serveG = serve * VOLUME_UNITS[unit];

      if (serveG) {
        var per100 = (kcal / serveG) * 100;
        if (per100 > 900 || (pro / serveG) * 100 > 90) {
          complain("That comes to " + Math.round(per100) + " kcal per 100 g, which no food reaches. " +
                   "If this is something pre-made, set it to 1 and pick the container instead of a weight.", "panServe");
          return;
        }
      }
      if (warn) warn.hidden = true;

      store.pantry.push({
        id: uid(),
        name: name,
        serveQty: serve,
        serveUnit: unit,
        serveG: serveG,
        sCal: kcal,
        sPro: pro,
        aliases: []
      });
      pantryForm = null;
      pantryShot = null;
      save(); render();
    });

    // Straight from the pantry into the day, no retyping. It logs against
    // `cursor`, not today, so it matches the Add form and the date in the
    // header rather than quietly disagreeing with both.
    view.querySelectorAll("[data-addpan]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.addpan;
        var raw = null;
        store.pantry.forEach(function (x) { if (x.id === id) raw = x; });
        if (!raw) return;

        var n = normPantry(raw);
        var c = Math.round(n.sCal), p = Math.round(n.sPro);
        var key = ymd(cursor);
        day(key).food.push({ id: uid(), cal: c, pro: p, note: raw.name });
        stampGoal(key);
        touch(key);
        save();
        lastAdded = { label: raw.name, cal: c, pro: p, at: Date.now() };
        render();

        // render() has just replaced this button, so confirm on the new one.
        // Without this the tap is silent and reads exactly like a dead control.
        var fresh = view.querySelector('[data-addpan="' + id + '"]');
        if (fresh) {
          fresh.textContent = "✓";
          fresh.classList.add("is-done");
          setTimeout(function () {
            var later = view.querySelector('[data-addpan="' + id + '"]');
            if (later && later.textContent === "✓") {
              later.textContent = "+";
              later.classList.remove("is-done");
            }
          }, 1400);
        }
      });
    });

    view.querySelectorAll("[data-rmpan]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.rmpan;
        var idx = -1;
        store.pantry.forEach(function (x, i) { if (x.id === id) idx = i; });
        if (idx === -1) return;
        var gone = store.pantry[idx];
        store.pantry.splice(idx, 1);
        save(); render();
        offerUndo("Removed " + gone.name + " from your pantry", function () {
          store.pantry.splice(Math.min(idx, store.pantry.length), 0, gone);
          save(); render();
        });
      });
    });
  }

  function readLabel(file) {
    if (!sampleFn) return;
    pantryShot = { status: "loading" };
    render();

    var prompt =
      "This photo shows a nutrition facts panel from a food package" +
      (store.region ? " sold in " + store.region : "") + ". Reply with JSON only.\n\n" +
      "Read the panel and report ONE serving as printed:\n" +
      "- name: the product name if visible, otherwise a short description of the food.\n" +
      "- servingGrams: the serving size in grams. Convert from oz if that is what is printed. " +
      "If the panel gives only a household measure with no weight, use 0.\n" +
      "- calories: calories per serving.\n" +
      "- protein: grams of protein per serving.\n" +
      "Use 0 for anything you genuinely cannot read rather than guessing.\n\n" +
      'Return exactly: {"name":"","servingGrams":0,"calories":0,"protein":0}';

    sampleFn.json(prompt, { images: file, modelTier: "default", cache: false }).then(function (out) {
      if (!out || (!out.calories && !out.protein)) {
        pantryShot = { status: "error", message: "Couldn't read that panel. Try a straighter, closer shot — or type the numbers in below." };
      } else {
        // The panel gives a weight, so set the unit to grams — otherwise it
        // saves as "one serving is 60 bottles" and the weight is lost.
        var grams = Math.round(Number(out.servingGrams) || 0);
        pantryForm = {
          name: out.name ? String(out.name) : "",
          servingG: grams > 0 ? String(grams) : "1",
          unit: grams > 0 ? "g" : "bottle",
          cal: out.calories ? String(Math.round(Number(out.calories))) : "",
          pro: out.protein ? String(Math.round(Number(out.protein))) : ""
        };
        pantryShot = null;
      }
      render();
    }).catch(function (e) {
      var code = e && e.code;
      pantryShot = { status: "error", message:
        code === "image_rejected" ? "That image didn't go through — try a smaller photo or a different format."
        : code === "rate_limited" ? "Too many requests just now. Give it a minute."
        : "Couldn't read that one. Type the numbers in below instead." };
      render();
    });
  }

  function renderLog() {
    var now = new Date();
    var MONTHS = ["January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"];
    var DOW = ["S", "M", "T", "W", "T", "F", "S"];

    var trained = 0, hits = 0, judged = 0;
    Object.keys(store.days).forEach(function (k) {
      if (k.slice(0, 4) !== String(logYear)) return;
      var d = store.days[k];
      if (d.lifts && d.lifts.length) trained++;
      var v = verdict(k);
      if (v !== "none") { judged++; if (v === "hit") hits++; }
    });

    function dayTitle(k) {
      var d = store.days[k];
      var label = parseYmd(k).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      if (!d || ((!d.food || !d.food.length) && (!d.lifts || !d.lifts.length))) return label + " — nothing logged";
      var bits = [label];
      if (d.food && d.food.length) {
        var t = totals(d);
        bits.push(fmt(t.cal) + " kcal · " + fmt(t.pro) + " g protein (" + (verdict(k) === "hit" ? "target hit" : "target missed") + ")");
      }
      if (d.lifts && d.lifts.length) {
        var cats = [];
        d.lifts.forEach(function (l) { if (cats.indexOf(l.cat) === -1) cats.push(l.cat); });
        var sets = d.lifts.reduce(function (a, l) { return a + l.sets.length; }, 0);
        bits.push(cats.map(function (id) { return cat(id).short; }).join(" + ") + " · " + sets + " sets");
      } else {
        bits.push("no gym");
      }
      return bits.join(" — ");
    }

    var months = "";
    for (var m = 0; m < 12; m++) {
      var pad = new Date(logYear, m, 1).getDay();
      var dim = new Date(logYear, m + 1, 0).getDate();
      var cells = "";
      for (var i = 0; i < pad; i++) cells += '<span class="cal-cell blank"></span>';
      for (var dnum = 1; dnum <= dim; dnum++) {
        var key = ymd(new Date(logYear, m, dnum));
        var rec = store.days[key];
        var v = verdict(key);
        var cls = "cal-cell";
        if (v !== "none") cls += " " + v;
        else if (key > TODAY) cls += " future";
        if (key === TODAY) cls += " is-today";
        var bar = (rec && rec.lifts && rec.lifts.length) ? cat(rec.lifts[0].cat).color : "transparent";
        cells += '<button class="' + cls + '" data-go="' + key + '" style="--barcolor:' + bar + '" ' +
                 'title="' + esc(dayTitle(key)) + '">' + dnum + '<span class="bar"></span></button>';
      }
      var isNow = (m === now.getMonth() && logYear === now.getFullYear());
      months += '<div class="month' + (isNow ? " is-now" : "") + '">' +
          '<h4>' + MONTHS[m] + '</h4>' +
          '<div class="dow-row">' + DOW.map(function (x) { return "<span>" + x + "</span>"; }).join("") + '</div>' +
          '<div class="month-grid">' + cells + '</div>' +
        '</div>';
    }

    var legend =
      '<div class="legend">' +
        '<span><i style="background:var(--hit-bg);box-shadow:inset 0 0 0 1px var(--hit)"></i>Target hit</span>' +
        '<span><i style="background:var(--miss-bg);box-shadow:inset 0 0 0 1px var(--miss)"></i>Target missed</span>' +
        '<span><i style="background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--ink);"></i>Today</span>' +
        cats().map(function (c) {
          return '<span><i class="line" style="background:' + c.color + '"></i>' + esc(c.short) + '</span>';
        }).join("") +
      '</div>';

    view.innerHTML =
      '<section style="display:flex;flex-direction:column;gap:12px">' +
        '<div class="yearnav">' +
          '<button id="prevYear" aria-label="Previous year">‹</button>' +
          '<span class="y">' + logYear + '</span>' +
          '<button id="nextYear" aria-label="Next year">›</button>' +
        '</div>' +
        '<div class="yearstats">' +
          '<div><b>' + trained + '</b><span>Gym days</span></div>' +
          '<div><b>' + hits + '</b><span>Targets hit</span></div>' +
          '<div><b>' + (judged ? Math.round((hits / judged) * 100) + "%" : "—") + '</b><span>Hit rate</span></div>' +
        '</div>' +
        legend +
        '<div class="months">' + months + '</div>' +
        '<p style="margin:0;font-size:12px;line-height:1.55;color:var(--ink-3)">' +
          'Colour is your macro target for that day. The bar underneath is the split you trained — no bar means no gym. Tap any day to open it.</p>' +
      '</section>';

    document.getElementById("prevYear").addEventListener("click", function () { logYear--; render(); });
    document.getElementById("nextYear").addEventListener("click", function () { logYear++; render(); });

    view.querySelectorAll("[data-go]").forEach(function (b) {
      b.addEventListener("click", function () {
        cursor = parseYmd(b.dataset.go);
        setTab("macros");
      });
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  // ---------- chrome ----------
  function setTab(t) {
    tab = t;
    editingGoal = false;
    if (t === "log") logYear = cursor.getFullYear();
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === t));
    });
    render();
  }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { setTab(b.dataset.tab); });
  });

  // Every delete is reversible for a few seconds. Small targets plus instant
  // destruction is a bad combination; undo beats a confirmation dialog you'd
  // have to dismiss mid-set.
  var undoTimer = null;

  function offerUndo(label, restore) {
    var bar = document.getElementById("undobar");
    var lab = document.getElementById("undoLabel");
    if (!bar || !lab) return;
    lab.textContent = label;
    bar.hidden = false;
    pendingUndo = restore;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () {
      bar.hidden = true;
      pendingUndo = null;
    }, 9000);
  }

  function hideUndo() {
    var bar = document.getElementById("undobar");
    if (bar) bar.hidden = true;
    pendingUndo = null;
    clearTimeout(undoTimer);
  }

  // Removing a row by its id, not its position — a row can't shift out from
  // under the tap between drawing the list and you touching it.
  function deleteFoodById(id) {
    var key = ymd(cursor);
    var d = day(key);
    var idx = -1;
    d.food.forEach(function (f, i) { if (f.id === id) idx = i; });
    if (idx === -1) return;
    var removed = d.food[idx];
    d.food.splice(idx, 1);
    lastAdded = null;
    touch(key); save(); render();
    offerUndo("Removed " + (removed.note || fmt(removed.cal) + " kcal"), function () {
      var dd = day(key);
      dd.food.splice(Math.min(idx, dd.food.length), 0, removed);
      touch(key); save(); render();
    });
  }

  // Dropping one row onto another makes a meal. Nothing is destroyed: the
  // entries go inside it unchanged, and splitting puts them straight back.
  function combineRows(dragId, dropId) {
    if (dragId === dropId) return;
    var key = ymd(cursor);
    var d = day(key);
    var from = locate(d, dragId), onto = locate(d, dropId);
    // Only top-level rows can be dragged onto each other.
    if (!from || !onto || from.meal || onto.meal) return;

    var before = JSON.parse(JSON.stringify(d.food));
    var moving = asItems(from.row);
    var target = onto.row;
    var targetIdx = onto.idx;

    if (isMeal(target)) {
      target.items = target.items.concat(moving);
    } else {
      d.food[targetIdx] = { id: uid(), items: asItems(target).concat(moving) };
    }
    // Remove the dragged row by identity, after the merge, so the index is right.
    d.food = d.food.filter(function (f) { return f.id !== dragId; });

    lastAdded = null;
    touch(key); save(); render();
    offerUndo("Combined into a meal", function () {
      var dd = day(key);
      dd.food = before;
      touch(key); save(); render();
    });
  }

  function splitMeal(id) {
    var key = ymd(cursor);
    var d = day(key);
    var at = locate(d, id);
    if (!at || at.meal || !isMeal(at.row)) return;
    var before = JSON.parse(JSON.stringify(d.food));
    var args = [at.idx, 1].concat(at.row.items);
    d.food.splice.apply(d.food, args);
    if (openMeal === id) openMeal = null;
    touch(key); save(); render();
    offerUndo("Split " + rowNote(at.row) + " apart", function () {
      var dd = day(key);
      dd.food = before;
      touch(key); save(); render();
    });
  }

  // Pulling one entry back out of a meal, for when the wrong thing got dragged in.
  function takeOutOfMeal(itemId) {
    var key = ymd(cursor);
    var d = day(key);
    var at = locate(d, itemId);
    if (!at || !at.meal) return;
    var before = JSON.parse(JSON.stringify(d.food));
    var meal = at.meal;
    var item = at.row;
    meal.items.splice(at.idx, 1);
    d.food.splice(d.food.indexOf(meal) + 1, 0, item);
    tidyMeals(d);
    touch(key); save(); render();
    offerUndo("Took " + (item.note || "that entry") + " out", function () {
      var dd = day(key);
      dd.food = before;
      touch(key); save(); render();
    });
  }

  // A meal that has been emptied down to one entry is not a meal any more.
  // One rule, applied after anything that can remove an item, so no path
  // can leave a container with a single thing rattling around in it.
  function tidyMeals(d) {
    for (var i = d.food.length - 1; i >= 0; i--) {
      var f = d.food[i];
      if (!isMeal(f)) continue;
      if (!f.items.length) {
        d.food.splice(i, 1);
        if (openMeal === f.id) openMeal = null;
      } else if (f.items.length === 1) {
        d.food.splice(i, 1, f.items[0]);
        if (openMeal === f.id) openMeal = null;
      }
    }
  }

  function renameMeal(id) {
    var key = ymd(cursor);
    var d = day(key);
    var at = locate(d, id);
    if (!at || !isMeal(at.row)) return;
    var name = window.prompt("Name this meal", rowNote(at.row));
    if (name === null) return;
    name = name.trim();
    at.row.note = name || "";
    touch(key); save(); render();
  }

  function findAction(target) {
    var el = target;
    while (el && el !== view) {
      if (el.id === "addFood") return { kind: "add" };
      if (el.getAttribute && el.getAttribute("data-del")) {
        return { kind: "del", id: el.getAttribute("data-del") };
      }
      if (el.getAttribute && el.getAttribute("data-openmeal")) {
        return { kind: "openmeal", id: el.getAttribute("data-openmeal") };
      }
      if (el.getAttribute && el.getAttribute("data-split")) {
        return { kind: "split", id: el.getAttribute("data-split") };
      }
      if (el.getAttribute && el.getAttribute("data-takeout")) {
        return { kind: "takeout", id: el.getAttribute("data-takeout") };
      }
      if (el.getAttribute && el.getAttribute("data-renamemeal")) {
        return { kind: "renamemeal", id: el.getAttribute("data-renamemeal") };
      }
      el = el.parentNode;
    }
    return null;
  }

  var swallowClickUntil = 0;
  var swallowTapUntil = 0;    // set when a drag ends, so the release isn't read as a tap

  // On iOS, tapping a button while the keyboard is open blurs the field first,
  // which closes the keyboard and reflows the page — the button can move out
  // from under your finger before the tap lands, so nothing happens. Acting on
  // the press itself, and blocking the blur, makes it fire the first time.
  view.addEventListener("pointerdown", function (e) {
    var a = findAction(e.target);
    if (!a || a.kind !== "add") return;
    e.preventDefault();
    swallowClickUntil = Date.now() + 800;
    addFoodFromForm();
  });

  // Delegated once, on a container that is never replaced.
  view.addEventListener("click", function (e) {
    var a = findAction(e.target);
    if (!a) return;
    if (a.kind === "add") {
      if (Date.now() < swallowClickUntil) return;   // already handled on press
      addFoodFromForm();
    } else if (a.kind === "del") {
      deleteFoodById(a.id);
    } else if (a.kind === "openmeal") {
      if (Date.now() < swallowTapUntil) return;   // this was the end of a drag
      openMeal = (openMeal === a.id) ? null : a.id;
      render();
    } else if (a.kind === "split") {
      splitMeal(a.id);
    } else if (a.kind === "takeout") {
      takeOutOfMeal(a.id);
    } else if (a.kind === "renamemeal") {
      renameMeal(a.id);
    }
  });
  // ---------- drag a row onto another to combine them ----------
  // A press-and-hold starts the drag rather than a plain drag, so an ordinary
  // finger-swipe still scrolls the list. Once lifted, touchmove is cancelled
  // so the page stays put while the row follows the finger.
  var HOLD_MS = 380;
  var SLOP = 10;

  function rowElFrom(el) {
    while (el && el !== view) {
      if (el.classList && el.classList.contains("t-row") && el.getAttribute("data-row")) return el;
      el = el.parentNode;
    }
    return null;
  }

  function clearDrag() {
    if (!drag) return;
    if (drag.timer) clearTimeout(drag.timer);
    if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    if (drag.el) drag.el.classList.remove("lifted");
    var over = view.querySelector(".t-row.dropto");
    if (over) over.classList.remove("dropto");
    document.body.classList.remove("dragging");
    drag = null;
  }

  function liftRow(x, y) {
    if (!drag || !drag.el || !drag.el.parentNode) { clearDrag(); return; }
    drag.active = true;
    drag.el.classList.add("lifted");
    document.body.classList.add("dragging");
    var g = document.createElement("div");
    g.className = "drag-ghost";
    var nm = drag.el.querySelector(".nm, .mn");
    g.textContent = nm ? nm.textContent.trim() : "Entry";
    document.body.appendChild(g);
    drag.ghost = g;
    moveGhost(x, y);
  }

  function moveGhost(x, y) {
    if (!drag || !drag.ghost) return;
    drag.ghost.style.left = x + "px";
    drag.ghost.style.top = y + "px";
    var was = view.querySelector(".t-row.dropto");
    if (was) was.classList.remove("dropto");
    if (drag.ghost) drag.ghost.style.visibility = "hidden";
    var under = document.elementFromPoint(x, y);
    if (drag.ghost) drag.ghost.style.visibility = "";
    var row = under ? rowElFrom(under) : null;
    drag.over = (row && row !== drag.el) ? row.getAttribute("data-row") : null;
    if (drag.over && row) row.classList.add("dropto");
  }

  view.addEventListener("pointerdown", function (e) {
    if (tab !== "macros" || drag) return;
    if (e.target.closest && e.target.closest("button")) return;  // buttons keep working
    var el = rowElFrom(e.target);
    if (!el) return;
    drag = { id: el.getAttribute("data-row"), el: el, x0: e.clientX, y0: e.clientY,
             active: false, ghost: null, over: null, timer: null };
    drag.timer = setTimeout(function () { liftRow(drag.x0, drag.y0); }, HOLD_MS);
  });

  view.addEventListener("pointermove", function (e) {
    if (!drag) return;
    if (!drag.active) {
      // Moved before the hold completed — that was a scroll, not a pick-up.
      if (Math.abs(e.clientX - drag.x0) > SLOP || Math.abs(e.clientY - drag.y0) > SLOP) clearDrag();
      return;
    }
    moveGhost(e.clientX, e.clientY);
  });

  // Non-passive, so the page does not scroll out from under a lifted row.
  document.addEventListener("touchmove", function (e) {
    if (drag && drag.active) e.preventDefault();
  }, { passive: false });

  function endDrag() {
    if (!drag) return;
    var from = drag.id, onto = drag.over, was = drag.active;
    clearDrag();
    if (was) swallowTapUntil = Date.now() + 250;   // the release must not read as a tap
    if (was && onto) combineRows(from, onto);
  }
  view.addEventListener("pointerup", endDrag);
  view.addEventListener("pointercancel", clearDrag);
  window.addEventListener("blur", clearDrag);

  view.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var id = e.target && e.target.id;
    if (id === "fCal" || id === "fPro" || id === "fNote") { e.preventDefault(); addFoodFromForm(); }
  });

  // iOS suspends a home-screen app rather than closing it, so "today" was
  // whatever day you first opened it — and food logged after midnight landed
  // on yesterday. Re-check the date every time the app comes back to the front.
  function checkDayRollover() {
    var nowKey = ymd(new Date());
    if (nowKey === TODAY) return;
    var wasOnToday = ymd(cursor) === TODAY;
    TODAY = nowKey;
    if (wasOnToday) cursor = new Date();
    hideUndo();
    render();
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) checkDayRollover();
  });
  window.addEventListener("focus", checkDayRollover);
  window.addEventListener("pageshow", checkDayRollover);

  document.getElementById("undoBtn").addEventListener("click", function () {
    var fn = pendingUndo;
    hideUndo();
    if (fn) fn();
  });

  // Offline shell. Gated on our own manifest link rather than on the protocol:
  // build.sh strips that link from the artifact copies, and an artifact is
  // served over https, so a protocol test would have it chase a sw.js that
  // isn't there and write a phantom error into the Backup panel. Under
  // file:// there is no service worker either, and the app is built to work
  // without one. The ?v= is what makes a new BUILD a new worker — see sw.js.
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) &&
      document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register("sw.js?v=" + BUILD).catch(function (e) {
      lastError = "service worker: " + (e && e.message ? e.message : String(e));
    });
  }

  window.addEventListener("error", function (e) {
    lastError = (e && e.message ? e.message : "unknown") +
      (e && e.lineno ? " (line " + e.lineno + ")" : "");
  });

  document.getElementById("prevDay").addEventListener("click", function () {
    cursor.setDate(cursor.getDate() - 1); editingGoal = false; render();
  });
  document.getElementById("nextDay").addEventListener("click", function () {
    cursor.setDate(cursor.getDate() + 1); editingGoal = false; render();
  });
  document.getElementById("todayBtn").addEventListener("click", function () {
    cursor = new Date(); editingGoal = false; render();
  });

  // ---------- backup sheet ----------
  var sheet = document.getElementById("sheet");
  var backupText = document.getElementById("backupText");

  document.getElementById("backupBtn").addEventListener("click", function () {
    backupText.value = JSON.stringify(store);
    sheet.hidden = false;
    var diag = document.getElementById("diag");
    if (diag) {
      diag.hidden = false;
      diag.textContent = "Build " + BUILD + (lastError ? " · last error: " + lastError : "");
      diag.style.color = lastError ? "var(--miss)" : "var(--ink-3)";
    }
  });
  document.getElementById("closeSheet").addEventListener("click", function () { sheet.hidden = true; });
  sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.hidden = true; });

  document.getElementById("copyBtn").addEventListener("click", function () {
    var btn = this;
    backupText.select();
    var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy"; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(backupText.value).then(done, function () { btn.textContent = "Press ⌘C / long-press"; });
    } else { done(); }
  });

  document.getElementById("restoreBtn").addEventListener("click", function () {
    var btn = this;
    try {
      var incoming = JSON.parse(backupText.value);
      if (!incoming || !incoming.days) throw new Error("shape");
      mergeInto(incoming);
      save(); sheet.hidden = true; render();
    } catch (e) {
      btn.textContent = "That text isn't a valid backup";
      setTimeout(function () { btn.textContent = "Restore from text"; }, 2400);
    }
  });

  function mergeInto(incoming) {
    Object.keys(incoming.days || {}).forEach(function (k) {
      var mine = store.days[k];
      var theirs = incoming.days[k];
      if (!mine || (theirs.updated || 0) > (mine.updated || 0)) store.days[k] = theirs;
    });
    if (incoming.moves) {
      Object.keys(incoming.moves).forEach(function (cid) {
        if (!store.moves[cid]) store.moves[cid] = [];
        (incoming.moves[cid] || []).forEach(function (m) {
          if (store.moves[cid].indexOf(m) === -1) store.moves[cid].push(m);
        });
      });
    }
    // Restoring on a new phone has to bring everything back, not just the days.
    (incoming.pantry || []).forEach(function (it) {
      if (!it || !it.id) return;
      var have = store.pantry.some(function (x) { return x.id === it.id; });
      if (!have) store.pantry.push(it);
    });
    if (incoming.routine && incoming.routine.days && incoming.routine.days.length) {
      store.routine = incoming.routine;
    }
    if (incoming.retired) {
      Object.keys(incoming.retired).forEach(function (k) {
        if (!store.retired[k]) store.retired[k] = incoming.retired[k];
      });
    }
    if (incoming.goal) store.goal = normGoal(incoming.goal);
    if (incoming.region) store.region = incoming.region;

    Object.keys(store.days).forEach(function (k) {
      (store.days[k].food || []).forEach(function (f) {
        if (!f.id) f.id = uid();
        if (f.items) f.items.forEach(function (x) { if (!x.id) x.id = uid(); });
      });
    });
  }

  // ---------- optional cloud mirror (only inside the Claude viewer) ----------
  function monthsOf(obj) {
    var out = {};
    Object.keys(obj.days).forEach(function (k) {
      var m = k.slice(0, 7);
      if (!out[m]) out[m] = {};
      out[m][k] = obj.days[k];
    });
    return out;
  }

  function queueSync() {
    if (!db) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushSync, 2500);
  }

  function pushSync() {
    if (!db) return;
    var months = monthsOf(store);
    Object.keys(months).forEach(function (m) {
      db.doc("backup/" + m).set({ days: months[m], moves: store.moves, goal: store.goal,
                                  region: store.region, pantry: store.pantry,
                                  routine: store.routine, at: Date.now() })
        .catch(function () { /* offline or unavailable — local copy still holds */ });
    });
  }

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(function (ns) {
      if (!ns) return;
      sampleFn = ns;
      render();
      if (ns.limits) {
        ns.limits().then(function (lim) {
          if (lim && lim.images) {
            canSendImages = true;
            if (lim.images.mediaTypes && lim.images.mediaTypes.length) {
              imageTypes = lim.images.mediaTypes.join(",");
            }
            if (tab === "pantry") render();
          }
        }).catch(function () { /* no label photos in this view */ });
      }
    }).catch(function () { /* estimator stays off */ });

    window.claude.use("db").then(function (ns) {
      if (!ns) return;
      db = ns;
      var note = document.getElementById("sheetNote");
      if (note) {
        note.textContent = "Your log lives on this device, and mirrors to your Claude workspace whenever you open it here. " +
          "On your home screen it works offline from the phone's own copy — copy this text somewhere safe now and then, or paste it back to restore.";
      }
      db.collection("backup").get().then(function (snap) {
        var changed = false;
        var newestGoal = null, newestRegion = null, newestAt = 0;
        snap.docs.forEach(function (doc) {
          var body = doc.data() || {};
          if (body.goal && (body.at || 0) > newestAt) {
            newestAt = body.at || 0; newestGoal = body.goal;
            if (body.region) newestRegion = body.region;
          }
          Object.keys(body.days || {}).forEach(function (k) {
            var mine = store.days[k];
            var theirs = body.days[k];
            if (!mine || (theirs.updated || 0) > (mine.updated || 0)) { store.days[k] = theirs; changed = true; }
          });
          if (body.moves) {
            Object.keys(body.moves).forEach(function (cid) {
              if (!store.moves[cid]) store.moves[cid] = [];
              (body.moves[cid] || []).forEach(function (m) {
                if (store.moves[cid].indexOf(m) === -1) { store.moves[cid].push(m); changed = true; }
              });
            });
          }
          (body.pantry || []).forEach(function (it) {
            var have = store.pantry.some(function (x) { return x.id === it.id; });
            if (!have) { store.pantry.push(it); changed = true; }
          });
        });
        if (newestGoal && JSON.stringify(store.goal) === JSON.stringify(DEFAULT_GOAL)) {
          store.goal = newestGoal; changed = true;
        }
        if (newestRegion && store.region === "United States") { store.region = newestRegion; changed = true; }
        if (changed) { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} render(); }
        pushSync();
      }).catch(function () { /* first run, nothing stored yet */ });
    }).catch(function () { /* no viewer capabilities — local only */ });
  }

  // ---------- home-screen hints ----------
  ["apple-mobile-web-app-capable", "mobile-web-app-capable"].forEach(function (n) {
    var m = document.createElement("meta");
    m.setAttribute("name", n);
    m.setAttribute("content", "yes");
    document.head.appendChild(m);
  });
  var st = document.createElement("meta");
  st.setAttribute("name", "apple-mobile-web-app-status-bar-style");
  st.setAttribute("content", "default");
  document.head.appendChild(st);

  load();

  // Stamp the build straight away, so a backup always reveals which code wrote
  // it — even if nothing has been logged since.
  var tag = document.getElementById("buildTag");
  if (tag) tag.textContent = "b" + BUILD.split(".").pop();
  if (store.build !== BUILD) { save(); }

  // Saved to the home screen, iOS reads these off the page as it stands when you
  // tap Add to Home Screen — so putting them in at load makes the icon open a
  // real full-screen app with its own status bar rather than a Safari tab.
  (function homeScreenMeta() {
    function meta(name, content) {
      if (document.querySelector('meta[name="' + name + '"]')) return;
      var m = document.createElement("meta");
      m.setAttribute("name", name);
      m.setAttribute("content", content);
      document.head.appendChild(m);
    }
    meta("apple-mobile-web-app-capable", "yes");
    meta("mobile-web-app-capable", "yes");
    meta("apple-mobile-web-app-title", "Iron Ledger");
    meta("apple-mobile-web-app-status-bar-style", "default");
    meta("format-detection", "telephone=no");   // stops iOS linkifying rep counts

    // Paint the status bar and the area behind the tab bar to match the app,
    // and keep it matching when the phone flips between light and dark.
    var themeMeta = document.createElement("meta");
    themeMeta.setAttribute("name", "theme-color");
    document.head.appendChild(themeMeta);
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function paint() {
      themeMeta.setAttribute("content", mq.matches ? "#191F1D" : "#FFFFFF");
    }
    paint();
    if (mq.addEventListener) mq.addEventListener("change", paint);
    else if (mq.addListener) mq.addListener(paint);
  })();

  render();
})();
</script>
</body></html>
