      btn.textContent = ok ? "Added" : "Not saved";
      setTimeout(function () {
        var b2 = document.getElementById("addFood");
        if (b2 && (b2.textContent === "Added" || b2.textContent === "Not saved")) {
          b2.textContent = "Add to ledger";
        }
      }, ok ? 1400 : 2600);
    }
    var again = document.getElementById("fCal");
    if (again) again.focus();
  }

  function render() {
    var key = ymd(cursor);
    var d = day(key);

    refreshBackupFlag();   // the header button lives outside #view, so it is
    refreshSaveBar();      // never redrawn by the render below, and nor is the
                           // savebar — both have to be refreshed by hand
    document.getElementById("dow").textContent =
      cursor.toLocaleDateString("en-US", { weekday: "long" });
    document.getElementById("dateFull").textContent =
      cursor.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    document.getElementById("todayBtn").hidden = (key === TODAY);

    try {
      if (tab === "macros") renderMacros(key, d);
      else if (tab === "gym") renderGym(key, d);
      else if (tab === "pantry") renderPantry();
    else if (tab === "coach") renderCoach();
      else renderLog();
    } catch (e) {
      lastError = (e && e.message ? e.message : String(e)) + " · in " + tab;
      if (window.console && console.error) console.error("render failed in " + tab + ":", e);
      // Never leave a blank screen: the day's own numbers still render.
      if (tab === "macros" && !document.getElementById("addFood")) {
        var t = totals(d);
        view.innerHTML =
          '<section class="tchart">' +
            '<div class="t-head">' +
              '<span class="h-food">Food</span>' +
              '<span class="h-cal">Kcal</span>' +
              '<span class="h-pro">Protein</span>' +
            '</div>' +
            '<div class="t-total">' +
              '<span class="t-label">Day total</span>' +
              '<span class="t-cal"><b>' + fmt(t.cal) + '</b></span>' +
              '<span class="t-pro"><b>' + fmt(t.pro) + '</b></span>' +
            '</div>' +
          '</section>' +
          '<section class="entry">' +
            '<div class="pair">' +
              '<div class="field"><label for="fCal">Calories</label>' +
                '<input id="fCal" inputmode="numeric" placeholder="0"></div>' +
              '<div class="field"><label for="fPro">Protein · g</label>' +
                '<input id="fPro" inputmode="numeric" placeholder="0"></div>' +
            '</div>' +
            '<div class="field"><label for="fNote">What was it (optional)</label>' +
              '<input id="fNote" class="text"></div>' +
            '<button class="btn" id="addFood">Add to ledger</button>' +
            '<p class="est-note" style="color:var(--miss)">Something in this day tripped the full view, ' +
              'so this is the plain version — logging still works. Tap Backup and send the details to Claude.</p>' +
          '</section>';
      }
    }
  }

  // Hoisted so the weight editor can relabel a row after it stops being an
  // assumed portion; it used to be local to the render.
  var SRC = { pantry: "your pantry", table: "built-in reference",
              typical: "typical serving",
              claude: "estimated", unknown: "needs numbers" };

  function estimatorHtml(key, d) {
    if (est && est.status === "loading") {
      return '<section class="entry est">' +
        '<span class="eyebrow">Working it out</span>' +
        '<div class="working"><i></i>Estimating “' + esc(est.text) + '”</div>' +
      '</section>';
    }

    if (est && est.status === "review") {
      var tc = 0, tp = 0;
      est.items.forEach(function (it) { tc += it.calories; tp += it.protein; });
      var items = est.items.map(function (it, i) {
        var tag = '<span class="src-tag ' + it.src + '">' + SRC[it.src || "claude"] + '</span>';
        // Anything with a gram basis gets its weight as a field rather than as
        // text, so a portion you did not choose can be corrected to one you did.
        var u = it.unit || wunit();
        var amt = (it.grams && it.per100)
          ? '<span class="amt editable">' +
              '<span class="pre">' + (it.pre ? esc(it.pre) + " · " : "") + '</span>' +
              '<input inputmode="decimal" class="g" data-ig="' + i + '" value="' + fromG(it.grams, u) +
                '" aria-label="Amount of ' + esc(it.food) + '">' +
              // No "·" here. It used to ride with the unit so it could not wrap
              // onto a line alone, but a boxed picker separates itself, and
              // the wider control pushes the tag to its own line — which left
              // the separator dangling at the end of the one above.
              '<span class="g-unit">' +
                '<select data-iu="' + i + '" aria-label="Weigh ' + esc(it.food) + ' in">' +
                  unitOptions(u) +
                '</select>' +
              '</span>' + tag +
            '</span>'
          : '<span class="amt">' + (it.amount ? esc(it.amount) + " · " : "") + tag + '</span>';
        return '<div class="rev-item">' +
          '<span class="food">' + esc(it.food) + '</span>' +
          '<input inputmode="numeric" data-ic="' + i + '" value="' + it.calories + '" aria-label="Calories">' +
          '<input inputmode="numeric" data-ip="' + i + '" value="' + it.protein + '" aria-label="Protein grams">' +
          amt +
        '</div>';
      }).join("");

      return '<section class="review">' +
        '<header><b>Estimate</b><span>' + fmt(tc) + ' kcal · ' + fmt(tp) + ' g</span></header>' +
        '<div class="rev-units"><span></span><span>kcal</span><span>protein</span></div>' +
        items +
        '<div class="rev-foot">' +
          (est.warn ? '<p class="rev-assume" style="color:var(--miss)">' + esc(est.warn) + '</p>' : '') +
          '<p class="rev-assume">' +
            (est.note ? esc(est.note) + " " : "") +
            'Anything marked <em>typical serving</em> is an assumed portion — tap the number to correct it. ' +
            'Anything marked <em>needs numbers</em> goes in as a placeholder you can fill later.' +
          '</p>' +
          // One description usually is one meal, so offer it here rather than
          // making you drag the rows together afterwards.
          (est.items.length > 1
            ? '<button class="meal-toggle" id="estMeal" aria-pressed="' + (estAsMeal ? 'true' : 'false') + '">' +
                '<span class="box">' + (estAsMeal ? '✓' : '') + '</span>' +
                'Put these in as one meal' +
              '</button>'
            : '') +
          '<div class="rev-actions">' +
            '<button class="btn" id="commitEst">' +
              ((estAsMeal && est.items.length > 1)
                ? 'Add as one meal'
                : 'Add ' + est.items.length + (est.items.length === 1 ? ' item' : ' items')) +
            '</button>' +
            '<button class="btn ghost" id="discardEst" style="padding:0 16px">Discard</button>' +
          '</div>' +
        '</div>' +
      '</section>';
    }

    var pend = pendingCount(d);
    var errHtml = (est && est.status === "error")
      ? '<p class="est-note" style="color:var(--miss)">' + esc(est.message) + '</p>' : '';

    // The food field offers everything the app can already answer offline, so
    // the question "what does it know?" is answered by typing rather than by
    // guessing and being told no.
    var known = FOODS.map(function (f) { return f.n; })
      .concat((store.pantry || []).map(function (x) { return x.name; }));
    var foodList = '<datalist id="estFoods">' +
      known.map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join("") +
      '</datalist>';

    var etRows = estRows.map(function (r, i) {
      var head = i === 0;
      var n = String(i + 1);
      return '<div class="et-row">' +
        (head ? '<span class="et-lab">Amount</span><span class="et-lab">Unit</span><span></span>' : '') +
        '<input inputmode="decimal" class="et-q" data-eq="' + i + '" value="' + esc(r.qty) +
          '" placeholder="6" aria-label="Amount for item ' + n + '">' +
        '<select class="et-u" data-eu="' + i + '" aria-label="Unit for item ' + n + '">' +
          entryUnitOptions(r.unit) +
        '</select>' +
        (estRows.length > 1
          ? '<button class="et-rm" data-erm="' + i + '" aria-label="Remove item ' + n + '">✕</button>'
          : '<span class="et-rm-gap" aria-hidden="true"></span>') +
        (head ? '<span class="et-lab et-wide">Food</span>' : '') +
        '<input class="text et-f" data-ef="' + i + '" list="estFoods" value="' + esc(r.food) +
          '" placeholder="chicken breast" aria-label="Food for item ' + n + '">' +
      '</div>';
    }).join("");

    return '<section class="entry est">' +
      '<span class="eyebrow">Need help counting?</span>' +
      (estWords
        ? '<textarea id="estText" placeholder="Half a protein coffee, 6 oz sirloin and a cup of rice" ' +
            'spellcheck="false">' + esc(estDraft) + '</textarea>'
        : foodList +
          '<div class="est-table">' + etRows +
            '<button class="et-add" id="estAddRow">+ Add another</button>' +
          '</div>') +
      '<div class="field"><label for="regionIn">Estimate for food sold in</label>' +
        '<input id="regionIn" class="text" list="regionList" autocomplete="country-name" ' +
          'value="' + esc(store.region || "") + '" placeholder="United States">' +
        '<datalist id="regionList">' +
          REGIONS.map(function (r) { return '<option value="' + esc(r) + '"></option>'; }).join("") +
        '</datalist></div>' +
      '<div class="field"><label for="wUnitIn">Weigh food in</label>' +
        '<select id="wUnitIn">' +
          Object.keys(WEIGH).map(function (u) {
            return '<option value="' + u + '"' + (u === wunit() ? ' selected' : '') + '>' +
                   WEIGH_LABEL[u] + '</option>';
          }).join("") +
        '</select></div>' +
      errHtml +
      (estHint ? '<p class="est-note" style="color:var(--miss)">' + esc(estHint) + '</p>' : '') +
      '<button class="btn" id="runEst">Work out the macros</button>' +
      '<button class="et-swap" id="estSwap">' +
        (estWords ? '◂ Back to the table' : '▸ Or just describe it in words') +
      '</button>' +
      '<p class="est-note">' +
        (sampleFn
          ? 'Describe the meal in plain words. Your pantry and the built-in food table answer first; anything they don’t recognise goes to Claude. The country above decides which version of a product gets used. You’ll see the breakdown and can edit it before it goes in the ledger.'
          : 'Your pantry and the built-in food table work offline — most everyday foods resolve straight away, and anything without an amount gets a typical serving. Whatever it doesn’t recognise is saved as a placeholder you can fill in by hand.') +
      '</p>' +
      (pend
        ? '<p class="est-note">' + pend + (pend === 1 ? ' entry is' : ' entries are') +
          ' waiting on an estimate. Today stays uncoloured on the calendar until ' +
          (pend === 1 ? 'it is' : 'they are') + ' filled in.</p>'
        : '') +
    '</section>';
  }

  function renderMacros(key, d) {
    var t = totals(d);
    var rows = d.food.map(function (f, i) {
      var meal = isMeal(f);
      var c = rowCal(f), pr = rowPro(f);
      var open = meal && openMeal === f.id;

      var label = meal
        ? '<button class="meal-open" data-openmeal="' + esc(f.id) + '">' +
            '<span class="mn">' + esc(rowNote(f)) + '</span>' +
            '<span class="mc">' + f.items.length +
              (f.items.length === 1 ? ' item' : ' items') + ' · tap to ' +
              (open ? 'close' : 'open') + '</span>' +
          '</button>'
        : '<span class="nm' + (f.note ? '' : ' untitled') + '">' +
            (f.note ? esc(f.note) : 'Untitled entry') +
            (f.est ? ' <span class="est-badge">est</span>' : '') +
            (f.pending
              ? '<br><button class="pending-chip" data-est="' + f.id + '">' +
                  (sampleFn ? 'Tap to estimate' : 'Tap to add numbers') + '</button>'
              : '') +
          '</span>';

      var inside = "";
      if (open) {
        inside = '<div class="meal-body">' +
          f.items.map(function (x) {
            return '<div class="meal-item">' +
              '<span class="mi-nm">' + esc(x.note || "Untitled entry") +
                (x.est ? ' <span class="est-badge">est</span>' : '') +
                (x.pending
                  ? ' <button class="pending-chip" data-est="' + x.id + '">' +
                      (sampleFn ? 'Tap to estimate' : 'Tap to add numbers') + '</button>'
                  : '') +
              '</span>' +
              '<span class="mi-n">' + (x.cal ? fmt(x.cal) : "—") + '</span>' +
              '<span class="mi-n">' + (x.pro ? fmt(x.pro) : "—") + '</span>' +
              '<button class="mi-out" data-takeout="' + esc(x.id) + '">Take out</button>' +
            '</div>';
          }).join("") +
          '<div class="meal-actions">' +
            '<button data-renamemeal="' + esc(f.id) + '">Name this meal</button>' +
            '<button data-split="' + esc(f.id) + '">Split apart</button>' +
          '</div>' +
          (mealRenaming === f.id
            ? '<div class="rt-inline" style="margin-top:9px">' +
                '<input class="text" id="mealName" value="' + esc(rowNote(f)) + '" ' +
                  'aria-label="Name this meal">' +
                '<button class="btn" id="mealNameSave">Save</button>' +
                '<button class="btn ghost" id="mealNameCancel">Cancel</button>' +
              '</div>'
            : '') +
        '</div>';
      }

      return '<div class="t-row' + (meal ? ' is-meal' : '') + (open ? ' is-open' : '') +
               '" data-row="' + esc(f.id) + '">' +
        '<div class="t-food">' + label +
          '<button class="t-del" data-del="' + esc(f.id) + '" aria-label="Delete entry">✕</button>' +
        '</div>' +
        '<div class="t-cal"><b class="' + (c ? "" : "zero") + '">' + (c ? fmt(c) : "—") + '</b></div>' +
        '<div class="t-pro"><b class="' + (pr ? "" : "zero") + '">' + (pr ? fmt(pr) : "—") + '</b></div>' +
        inside +
      '</div>';
    }).join("");

    var g = goalFor(key);
    var logged = d.food.length > 0;

    function half(side, gg, total, unit) {
      var ok = meets(gg, total);
      var state = logged ? (ok ? "hit" : "miss") : "none";
      var pct = gg.v > 0 ? Math.max(0, Math.min(100, (total / gg.v) * 100)) : 0;
      return '<div class="goalcell ' + side + '">' +
        '<span class="goaltarget"><span class="dir">' + (gg.dir === "+" ? "+" : "−") + '</span>' +
          fmt(gg.v) + ' ' + unit + '</span>' +
        '<span class="meter"><i class="' + state + '" style="width:' + pct.toFixed(1) + '%"></i></span>' +
        '<span class="goalstat ' + state + '">' +
          (logged ? goalText(gg, total) : "not started") + '</span>' +
      '</div>';
    }

    var goalHtml = editingGoal
      ? '<div class="entry" style="margin-top:14px">' +
          '<span class="eyebrow">Daily target</span>' +
          '<div class="pair">' +
            '<div class="field"><label>Calories</label>' +
              '<div class="dirtoggle" id="dirCal">' +
                '<button data-d="+" aria-pressed="' + (g.cal.dir === "+") + '">+ Above</button>' +
                '<button data-d="-" aria-pressed="' + (g.cal.dir === "-") + '">− Below</button>' +
              '</div>' +
              '<input id="gCal" inputmode="numeric" value="' + g.cal.v + '" style="margin-top:6px"></div>' +
            '<div class="field"><label>Protein · g</label>' +
              '<div class="dirtoggle" id="dirPro">' +
                '<button data-d="+" aria-pressed="' + (g.pro.dir === "+") + '">+ Above</button>' +
                '<button data-d="-" aria-pressed="' + (g.pro.dir === "-") + '">− Below</button>' +
              '</div>' +
              '<input id="gPro" inputmode="numeric" value="' + g.pro.v + '" style="margin-top:6px"></div>' +
          '</div>' +
          '<p style="margin:0;font-size:12px;line-height:1.5;color:var(--ink-3)">' +
            'Applies to this day and every day after it. Days already logged keep the target they were judged against.</p>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
            '<button class="btn" id="saveGoal">Save target</button>' +
            '<button class="btn ghost" id="cancelGoal">Cancel</button>' +
          '</div>' +
        '</div>'
      : '<button class="goaledit-open" id="openGoal">Target · ' +
          (g.cal.dir === "+" ? "+" : "−") + fmt(g.cal.v) + ' kcal · ' +
          (g.pro.dir === "+" ? "+" : "−") + fmt(g.pro.v) + ' g protein · edit</button>';

    // Shown only until something is logged — invisible to anyone already using it.
    var isNew = !store.seen &&
      !Object.keys(store.days).some(function (k) {
        var dd = store.days[k];
        return (dd.food && dd.food.length) || (dd.lifts && dd.lifts.length);
      }) && !(store.pantry || []).length;

    var welcome = isNew
      ? '<section class="welcome">' +
          '<h2>A quick tour</h2>' +
          '<p>A gym and food log built to replace a paper one. Everything stays on this phone — ' +
            'nobody else sees what you log, including whoever shared this with you.</p>' +
          '<dl>' +
            '<dt>Macros</dt><dd>Calories left, protein right, totals at the bottom. Type the numbers, ' +
              'or describe the meal — “chicken and rice” works, and you can correct it before it goes in.</dd>' +
            '<dt>Pantry</dt><dd>Save things you eat often, once. Pre-made items are counted in bottles ' +
              'and bars, not weighed.</dd>' +
            '<dt>Gym</dt><dd>Pick a split, add movements, log weight and reps. It shows what you lifted last time.</dd>' +
            '<dt>Log</dt><dd>The year at a glance. Green means you hit your target, red means you missed.</dd>' +
          '</dl>' +
          '<p>The daily target below starts at under 2,000 calories and above 150 g protein — ' +
            'tap it to set your own. Found something broken? Tap <strong>Backup</strong> in the corner ' +
            'and send that text back, build number included.</p>' +
          '<button class="btn ghost" id="dismissWelcome">Got it</button>' +
        '</section>'
      : '';

    view.innerHTML =
      welcome +
      '<section class="tchart">' +
        '<div class="t-head">' +
          '<span class="h-food">Food</span>' +
          '<span class="h-cal">Kcal</span>' +
          '<span class="h-pro">Protein</span>' +
        '</div>' +
        '<div class="t-body">' +
          (rows || '<p class="empty">Nothing logged yet.<br>Add your first entry below.</p>') +
        '</div>' +
        ((d.food.length > 1 && !d.food.some(isMeal))
          ? '<p class="drag-hint">Hold a row and drag it onto another to combine them into one meal.</p>'
          : '') +
        '<div class="t-total">' +
          '<span class="t-label">Day total</span>' +
          '<span class="t-cal"><b>' + fmt(t.cal) + '</b></span>' +
          '<span class="t-pro"><b>' + fmt(t.pro) + '</b></span>' +
        '</div>' +
        '<div class="goalbar">' + half("left", g.cal, t.cal, "kcal") + half("right", g.pro, t.pro, "g") + '</div>' +
        goalHtml +
      '</section>' +

      '<section class="entry">' +
        '<div class="pair">' +
          '<div class="field"><label for="fCal">Calories</label>' +
            '<input id="fCal" inputmode="numeric" placeholder="0"></div>' +
          '<div class="field"><label for="fPro">Protein · g</label>' +
            '<input id="fPro" inputmode="numeric" placeholder="0"></div>' +
        '</div>' +
        '<div class="field"><label for="fNote">What was it (optional)</label>' +
          '<input id="fNote" class="text"></div>' +
        '<button class="btn" id="addFood">Add to ledger</button>' +
        ((lastAdded && Date.now() - lastAdded.at < 8000)
          ? '<p class="added-flash">✓ Added ' + esc(lastAdded.label) + ' · ' +
              fmt(lastAdded.cal) + ' kcal · ' + fmt(lastAdded.pro) + ' g' +
              '<span>Day now ' + fmt(t.cal) + ' kcal · ' + fmt(t.pro) + ' g protein</span></p>'
          : '') +
      '</section>' +
      estimatorHtml(key, d);

    // Deleting is delegated too — see the handler near setTab.

    var dismiss = document.getElementById("dismissWelcome");
    if (dismiss) {
      dismiss.addEventListener("click", function () {
        store.seen = true; save(); render();
      });
    }

    var openGoal = document.getElementById("openGoal");
    if (openGoal) {
      openGoal.addEventListener("click", function () { editingGoal = true; render(); });
    }

    var pendingDir = { cal: g.cal.dir, pro: g.pro.dir };
    ["Cal", "Pro"].forEach(function (which) {
      var wrap = document.getElementById("dir" + which);
      if (!wrap) return;
      wrap.querySelectorAll("button").forEach(function (b) {
        b.addEventListener("click", function () {
          pendingDir[which.toLowerCase()] = b.dataset.d;
          wrap.querySelectorAll("button").forEach(function (x) {
            x.setAttribute("aria-pressed", String(x === b));
          });
        });
      });
    });

    var saveGoalBtn = document.getElementById("saveGoal");
    if (saveGoalBtn) {
      saveGoalBtn.addEventListener("click", function () {
        var gc = num(document.getElementById("gCal").value);
        var gp = num(document.getElementById("gPro").value);
        if (!gc || !gp) { document.getElementById("gCal").focus(); return; }
        var next = { cal: { dir: pendingDir.cal, v: gc }, pro: { dir: pendingDir.pro, v: gp } };
        store.goal = next;
        day(key).goal = JSON.parse(JSON.stringify(next));
        editingGoal = false;
        touch(key); save(); render();
      });
      document.getElementById("cancelGoal").addEventListener("click", function () {
        editingGoal = false; render();
      });
    }

    // Adding food is wired once, by delegation, outside this function — so a
    // failure anywhere else in the render can never leave the button dead.

    // --- estimator wiring ---
    var estText = document.getElementById("estText");
    if (estText) {
      estText.addEventListener("input", function () { estDraft = estText.value; });
    }

    var regionIn = document.getElementById("regionIn");
    if (regionIn) {
      var saveRegion = function () {
        var v = regionIn.value.trim();
        if (v && v !== store.region) { store.region = v; save(); }
      };
      regionIn.addEventListener("change", saveRegion);
      regionIn.addEventListener("blur", saveRegion);
    }

    // The picker showing its own new value is the confirmation, the same way
    // the region field above it works. There is deliberately no redraw here:
    // this control and the review are never on screen at the same time, so a
    // branch for "update the open review" would be a line that can never run.
    // Mid-review the per-row picker is the way to change it.
    var wUnitIn = document.getElementById("wUnitIn");
    if (wUnitIn) {
      wUnitIn.addEventListener("change", function () {
        store.wunit = WEIGH[wUnitIn.value] ? wUnitIn.value : "g";
        save();
      });
    }

    // ---- the entry table ----
    // Every field writes straight into estRows so a redraw never loses what is
    // half typed, and so the run button reads state rather than the DOM.
    view.querySelectorAll("[data-eq], [data-eu], [data-ef]").forEach(function (el) {
      var key = el.dataset.eq !== undefined ? "qty"
              : el.dataset.eu !== undefined ? "unit" : "food";
      var i = Number(el.dataset.eq !== undefined ? el.dataset.eq
                   : el.dataset.eu !== undefined ? el.dataset.eu : el.dataset.ef);
      el.addEventListener("input", function () {
        if (!estRows[i]) return;
        estRows[i][key] = el.value;
        estHint = "";
      });
    });

    var addRow = document.getElementById("estAddRow");
    if (addRow) {
      addRow.addEventListener("click", function () {
        estRows.push({ qty: "", unit: "", food: "" });
        estHint = "";
        render();
        // Land on the new row rather than making someone hunt for it — the
        // press has to visibly go somewhere.
        var fields = view.querySelectorAll("[data-ef]");
        if (fields.length) fields[fields.length - 1].focus();
      });
    }

    view.querySelectorAll("[data-erm]").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = Number(b.dataset.erm);
        // A blank row you are still filling in is not saved data, so this is
        // not the kind of delete rule 6 is about — there is nothing to undo to.
        estRows.splice(i, 1);
        if (!estRows.length) estRows = [{ qty: "", unit: "", food: "" }];
        render();
      });
    });

    var swap = document.getElementById("estSwap");
    if (swap) {
      swap.addEventListener("click", function () {
        if (!estWords) {
          // Carry the table across rather than making someone retype it, but
          // never over the top of words already sitting in the box.
          var composed = rowsText();
          if (composed && !estDraft.trim()) estDraft = composed;
        }
        estWords = !estWords;
        estHint = "";
        render();
      });
    }

    var runEst = document.getElementById("runEst");
    if (runEst) {
      runEst.addEventListener("click", function () {
        var text = estWords ? (estText ? estText.value : "").trim() : rowsText();
        if (!text) {
          // Doing nothing at all here would read exactly like a dead button.
          estHint = estWords
            ? "Nothing to work out yet — describe the meal above."
            : "Nothing to work out yet — put a food in the table above.";
          render();
          var first = view.querySelector(estWords ? "#estText" : "[data-ef]");
          if (first) first.focus();
          return;
        }
        estHint = "";
        // Pick up a country typed but not yet committed by a blur.
        if (regionIn && regionIn.value.trim()) store.region = regionIn.value.trim();
        // Always try the built-in table and your pantry first — that works
        // offline. Only what they can't answer needs Claude, or a placeholder.
        estDraft = text;
        runEstimate(text);
      });
    }

    view.querySelectorAll("[data-est]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.est;
        var at = locate(d, id);
        if (!at) return;
        // Always run the estimate — the built-in table and your pantry work
        // offline, so most placeholders resolve without Claude. If nothing can
        // price it, runEstimate says so and the placeholder stays put.
        runEstimate(at.row.note, id);
      });
    });

    // Change the weight, the macros follow. Updated in place rather than by a
    // re-render, so the field keeps focus while you are still typing into it.
    view.querySelectorAll("[data-ig]").forEach(function (input) {
      input.addEventListener("input", function () {
        if (!est || est.status !== "review") return;
        var it = est.items[Number(input.dataset.ig)];
        if (!it || !it.per100) return;

        // The number is in whatever the row's picker says. Grams remain the
        // basis the macros are computed from, so convert on the way in.
        var u = it.unit || wunit();
        var g = Math.max(0, toG(input.value, u));
        it.grams = g;
        it.unit = u;
        it.calories = Math.round((it.per100.k * g) / 100);
        it.protein = Math.round((it.per100.p * g) / 100);
        // The portion is yours now, so it is no longer an assumption, and any
        // prefix that described the old weight ("1 cup") no longer describes it.
        // The per-100 g figures are still the reference table's, so `edited`
        // stays untouched and the row keeps its honest "est" badge.
        if (it.src === "typical") it.src = "table";
        it.pre = "";
        // commitEstimate writes `amount` into the row's note, so it has to move
        // with the weight or the ledger records a portion you did not log.
        it.amount = g ? fromG(g, u) + " " + u : "";

        var row = input.closest(".rev-item");
        if (row) {
          var cEl = row.querySelector("[data-ic]"), pEl = row.querySelector("[data-ip]");
          if (cEl) cEl.value = it.calories;
          if (pEl) pEl.value = it.protein;
          var tagEl = row.querySelector(".src-tag");
          if (tagEl) {
            tagEl.className = "src-tag " + it.src;
            tagEl.textContent = SRC[it.src || "claude"];
          }
          var preEl = row.querySelector(".amt .pre");
          if (preEl) preEl.textContent = "";
        }

        var gc = 0, gp = 0;
        est.items.forEach(function (x) { gc += x.calories; gp += x.protein; });
        var gHead = view.querySelector(".review > header span");
        if (gHead) gHead.textContent = fmt(gc) + " kcal · " + fmt(gp) + " g";
      });
    });

    // Switching the unit converts what is there rather than re-reading it.
    // 150 g becoming 150 oz would be a four kilogram chicken breast logged in
    // one tap, so the food stays the same size and only the reading changes —
    // then you type over it if you meant a different amount.
    view.querySelectorAll("[data-iu]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        if (!est || est.status !== "review") return;
        var it = est.items[Number(sel.dataset.iu)];
        if (!it) return;
        it.unit = WEIGH[sel.value] ? sel.value : "g";
        if (it.amount) it.amount = fromG(it.grams, it.unit) + " " + it.unit;
        // The choice sticks: someone who works in ounces works in ounces for
        // every row that has not been given a unit of its own — the rest of
        // this review included, which is why this redraws rather than patching
        // the one field. The typed numbers live in est.items, not in the DOM,
        // so nothing is lost.
        store.wunit = it.unit;
        save();
        render();
      });
    });

    view.querySelectorAll("[data-ic], [data-ip]").forEach(function (input) {
      input.addEventListener("input", function () {
        if (!est || est.status !== "review") return;
        var isCal = input.dataset.ic !== undefined;
        var i = Number(isCal ? input.dataset.ic : input.dataset.ip);
        var v = Math.max(0, Math.round(Number(input.value) || 0));
        if (isCal) est.items[i].calories = v; else est.items[i].protein = v;
        // A number you typed yourself is not an estimate, so it shouldn't
        // carry the "est" badge into the ledger.
        est.items[i].edited = true;
        var tc = 0, tp = 0;
        est.items.forEach(function (it) { tc += it.calories; tp += it.protein; });
        var head = view.querySelector(".review > header span");
        if (head) head.textContent = fmt(tc) + " kcal · " + fmt(tp) + " g";
      });
    });

    var mealToggle = document.getElementById("estMeal");
    if (mealToggle) {
      mealToggle.addEventListener("click", function () { estAsMeal = !estAsMeal; render(); });
    }

    var mealNameEl = document.getElementById("mealName");
    if (mealNameEl) {
      document.getElementById("mealNameSave").addEventListener("click", commitMealName);
      document.getElementById("mealNameCancel").addEventListener("click", function () {
        mealRenaming = null; render();
      });
      mealNameEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") commitMealName();
      });
    }

    var commit = document.getElementById("commitEst");
    if (commit) {
      commit.addEventListener("click", function () { commitEstimate(key); });
      document.getElementById("discardEst").addEventListener("click", function () {
        est = null; estAsMeal = false; render();
      });
    }
  }

  // Marks a finished day. Appended to <body>, not #view, so the next render
  // cannot sweep it away mid-flight, and it removes itself. Wrapped in
  // try/catch and skipped under reduced-motion: a celebration must never be
  // the reason a workout fails to save.
  function celebrate() {
    try {
      if (window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var host = document.createElement("div");
      host.className = "confetti";
      host.setAttribute("aria-hidden", "true");
      var cols = ["--accent", "--cat-a", "--cat-b", "--cat-c", "--hit"];
      for (var i = 0; i < 42; i++) {
        var bit = document.createElement("i");
        bit.style.left = (Math.random() * 100) + "vw";
        bit.style.background = "var(" + cols[i % cols.length] + ")";
        bit.style.setProperty("--dx", Math.round(Math.random() * 120 - 60) + "px");
        bit.style.setProperty("--spin", Math.round(Math.random() * 720 + 360) + "deg");
        bit.style.animationDuration = (1.6 + Math.random() * 1.4).toFixed(2) + "s";
        bit.style.animationDelay = (Math.random() * 0.5).toFixed(2) + "s";
        host.appendChild(bit);
      }
      document.body.appendChild(host);
      setTimeout(function () {
        if (host.parentNode) host.parentNode.removeChild(host);
      }, 3400);
    } catch (e) { /* never let a flourish break logging */ }
  }

  function renderGym(key, d) {
    // Someone whose routine no longer contains the day we were showing (a reset,
    // a restore from another phone) must land on a real day, not an empty one.
    var live = cats();
    if (!live.filter(function (x) { return x.id === activeCat; }).length && live.length) {
      activeCat = live[0].id;
    }
    var c = cat(activeCat);

    var live = cats();

    var chips = live.map(function (x) {
      return '<button class="cat" data-cat="' + x.id + '" aria-pressed="' + (x.id === activeCat) + '" ' +
             'style="--catcolor:' + x.color + '"><span class="tag">' + x.tag + '</span>' + esc(x.short) + '</button>';
    }).join("") +
      // Same box as the splits it sits beside, so it reads as "one more of
      // these" rather than as a control bolted on beneath them.
      '<button class="cat cat-add" id="addSplitChip" aria-label="Add a split">' +
        '<span class="tag">+</span>Add' +
      '</button>';

    // Renaming and removing get full-size controls rather than a corner ×.
    // Every small destructive target this app has shipped has come back as a
    // bug — a delete X at 30×30, set chips at 69×29 — so they get their own
    // mode with room to be 44px.
    var editRows = live.map(function (x) {
      return '<div class="split-row" style="--catcolor:' + x.color + '">' +
        '<span class="split-tag">' + x.tag + '</span>' +
        '<input class="split-name" data-splitname="' + x.id + '" value="' + esc(x.name) +
          '" aria-label="Name of split ' + x.tag + '">' +
        (live.length > 1
          ? '<button class="split-rm" data-rmsplit="' + x.id + '" aria-label="Remove ' +
            esc(x.name) + '">Remove</button>'
          : '<span class="split-keep">last one</span>') +
      '</div>';
    }).join("");

    var opts = (store.moves[activeCat] || []).slice().sort().map(function (m) {
      return '<option value="' + esc(m) + '">' + esc(m) + '</option>';
    }).join("");

    var locked = !!d.gymLocked;

    var cards = d.lifts.map(function (l, i) {
      var lc = cat(l.cat);
      var v = volume(l);
      var prev = lastTime(l.movement, key);
      var lastLine = prev
        ? 'Last · ' + shortDate(prev.key) + ' — <em>' +
          prev.lift.sets.map(function (s) { return s.w + "×" + s.r; }).join(", ") + '</em>'
        : 'First time logging this one.';

      var sets = l.sets.map(function (s, si) {
        // Locked chips are spans, not disabled buttons: probe treats a control
        // that does nothing as dead, and a span is honestly not a control.
        return locked
          ? '<span class="set">' + s.w + '<span class="x">×</span>' + s.r + '</span>'
          : '<button class="set" data-lift="' + i + '" data-set="' + si + '" title="Tap to remove">' +
            s.w + '<span class="x">×</span>' + s.r + '</button>';
      }).join("");

      return '<article class="lift" style="--catcolor:' + lc.color + '">' +
        '<div class="spine"></div>' +
        '<div class="body">' +
          '<div class="lift-head"><h3>' + esc(l.movement) + '</h3>' +
            '<span class="cattag"' + (lc.gone ? ' title="' + esc(lc.name) + '"' : '') + '>' +
              lc.tag + '</span></div>' +
          (lc.gone ? '<p class="last">Logged under <em>' + esc(lc.name) +
                     '</em> — a day you no longer train.</p>' : '') +
          '<p class="last">' + lastLine + '</p>' +
          (sets ? '<div class="sets">' + sets + '</div>' : '') +
          (locked ? '' :
            '<div class="setadd">' +
              '<input inputmode="decimal" placeholder="lb" data-w="' + i + '">' +
              '<input inputmode="numeric" placeholder="reps" data-r="' + i + '">' +
              '<button data-addset="' + i + '">Set</button>' +
            '</div>') +
          '<div class="lift-foot">' +
            '<span>' + (v.sets
              ? v.sets + (v.sets === 1 ? ' set · ' : ' sets · ') + v.reps + ' reps · ' + fmt(v.vol) + ' lb volume'
              : (locked ? 'No sets logged' : 'Log your first set — tap a set chip to remove it')) + '</span>' +
            (locked ? '' : '<button data-rmlift="' + i + '">Remove</button>') +
          '</div>' +
        '</div>' +
      '</article>';
    }).join("");

    // The clock goes above everything, because it is the first thing you touch
    // when you walk in and the last thing before you leave — it should not be
    // somewhere you scroll to find.
    var stale = d.workoutStart && workoutMs(d) > MAX_SESSION_MS;
    var clock = locked || splitEdit ? ''
      : d.workoutStart
        ? '<div class="workout is-running' + (stale ? ' is-stale' : '') + '">' +
            '<span class="wo-label">' + (stale ? 'Left running' : 'Workout') + '</span>' +
            '<span class="wo-clock" id="workoutClock">' + fmtDur(workoutMs(d)) + '</span>' +
            '<button id="discardWorkout">Discard</button>' +
          '</div>' +
          (stale ? '<p class="wo-note">Longer than a session — this will not be saved.</p>' : '')
        : d.workoutMs
          ? '<div class="workout">' +
              '<span class="wo-label">Logged</span>' +
              '<span class="wo-clock">' + fmtDur(d.workoutMs) + '</span>' +
              '<button id="startWorkout">Start again</button>' +
            '</div>'
          : '<button class="btn ghost" id="startWorkout" style="width:100%">Start workout</button>';

    var totals = d.lifts.reduce(function (a, l) {
      var v = volume(l); a.sets += v.sets; a.reps += v.reps; a.vol += v.vol; return a;
    }, { sets: 0, reps: 0, vol: 0 });

    view.innerHTML =
      '<section style="display:flex;flex-direction:column;gap:10px">' +
        clock +
        '<div class="split-head">' +
          '<span class="eyebrow">Today’s split</span>' +
          '<button id="editSplits">' + (splitEdit ? "Done" : "Edit splits") + '</button>' +
        '</div>' +
        (splitEdit
          ? '<div class="split-list">' + editRows + '</div>'
          : '<div class="cats">' + chips + '</div>') +
        (splitAdding
          ? '<div class="split-new">' +
              '<input id="newSplitName" class="text" placeholder="Push, Legs, Walk, Yoga…" ' +
                'aria-label="Name your new split">' +
              '<button class="btn" id="saveSplit">Add</button>' +
              '<button class="btn ghost" id="cancelSplit">Cancel</button>' +
            '</div>'
          : '') +
      '</section>' +

      // A locked day says so at the top, where you look first — the missing
      // form further down is a consequence, not the announcement.
      (locked
        ? '<section class="daydone">' +
            '<div class="dd-head">' +
              '<span class="dd-title">Day complete</span>' +
              '<button id="unlockDay">Unlock</button>' +
            '</div>' +
            '<div class="dd-stats">' +
              '<div><b>' + d.lifts.length + '</b><span>' +
                (d.lifts.length === 1 ? 'movement' : 'movements') + '</span></div>' +
              '<div><b>' + totals.sets + '</b><span>' +
                (totals.sets === 1 ? 'set' : 'sets') + '</span></div>' +
              '<div><b>' + totals.reps + '</b><span>reps</span></div>' +
              '<div><b>' + fmt(totals.vol) + '</b><span>lb volume</span></div>' +
            '</div>' +
            (d.workoutMs
              ? '<div class="dd-time">Took ' + fmtDur(d.workoutMs) + '</div>'
              : '') +
          '</section>'
        : '') +

      (cards
        ? '<section class="liftgroup">' + cards + '</section>'
        : '<p class="empty">No movements logged for this day.<br>Pick a split above and add your first below.</p>') +

      // Add movement sits *under* the list, so the movements read in the order
      // you trained them and the next one to add is always the next thing on
      // screen rather than back up at the top.
      (locked ? '' :
        '<section class="entry" style="--catcolor:' + c.color + '">' +
          '<div class="field"><label for="mSel">Add movement · ' + esc(c.name) + '</label>' +
            '<select id="mSel">' + opts + '<option value="__new">+ New movement…</option></select></div>' +
          '<input id="mNew" class="text" placeholder="Name the movement" hidden ' +
            'style="height:46px;padding:0 10px;background:var(--surface);border:1px solid var(--rule);border-radius:2px;font-size:15px;width:100%">' +
          '<button class="btn" id="addLift">Add to today</button>' +
        '</section>') +

      // Nothing logged yet is nothing to lock in.
      (!locked && d.lifts.length
        ? '<button class="btn ghost" id="lockDay" style="width:100%">Lock in the day</button>'
        : '');

    view.querySelectorAll("[data-cat]").forEach(function (b) {
      b.addEventListener("click", function () { activeCat = b.dataset.cat; render(); });
    });

    var editSplitsBtn = document.getElementById("editSplits");
    if (editSplitsBtn) {
      editSplitsBtn.addEventListener("click", function () {
        splitEdit = !splitEdit;
        splitAdding = false;      // one thing at a time
        render();
      });
    }

    var addChip = document.getElementById("addSplitChip");
    if (addChip) {
      addChip.addEventListener("click", function () {
        splitAdding = true;
        render();
        var f = document.getElementById("newSplitName");
        if (f) f.focus();
      });
    }

    var cancelSplitBtn = document.getElementById("cancelSplit");
    if (cancelSplitBtn) {
      cancelSplitBtn.addEventListener("click", function () { splitAdding = false; render(); });
    }

    var newSplitEl = document.getElementById("newSplitName");
    var saveSplitBtn = document.getElementById("saveSplit");
    function commitNewSplit() {
      if (!newSplitEl) return;
      var id = addSplit(newSplitEl.value);
      if (!id) { newSplitEl.focus(); return; }   // an empty name is not a split
      // Land on what you just made, ready to add the first movement to it.
      activeCat = id;
      splitAdding = false;
      render();
    }
    if (saveSplitBtn) saveSplitBtn.addEventListener("click", commitNewSplit);
    if (newSplitEl) {
      newSplitEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") commitNewSplit();
      });
    }

    // Rename commits on change, the way the routine name on Coach does, so
    // there is no separate save to forget.
    view.querySelectorAll("[data-splitname]").forEach(function (el) {
      el.addEventListener("change", function () {
        if (renameSplit(el.dataset.splitname, el.value)) render();
        else el.value = cat(el.dataset.splitname).name;   // reject an empty name
      });
    });

    view.querySelectorAll("[data-rmsplit]").forEach(function (b) {
      b.addEventListener("click", function () { removeSplit(b.dataset.rmsplit); });
    });

    // The whole form is absent on a locked day, so every lookup here is
    // guarded. Reaching through a null would throw mid-render and take the
    // rest of the tab's handlers down with it.
    var sel = document.getElementById("mSel");
    var neu = document.getElementById("mNew");
    if (sel && neu) {
      sel.addEventListener("change", function () {
        neu.hidden = sel.value !== "__new";
        if (!neu.hidden) neu.focus();
      });
    }

    var addLiftBtn = document.getElementById("addLift");
    if (addLiftBtn) {
      addLiftBtn.addEventListener("click", function () {
        var name = sel.value === "__new" ? neu.value.trim() : sel.value;
        if (!name) { neu.focus(); return; }
        var mlist = store.moves[activeCat] || (store.moves[activeCat] = []);
        if (mlist.indexOf(name) === -1) mlist.push(name);
        d.lifts.push({ id: uid(), cat: activeCat, movement: name, sets: [] });
        touch(key); save(); render();
      });
    }

    // Locking is one tap each way, so it needs no undo — the way out is the
    // button that replaces it. The card persists; the confetti does not, so
    // reopening the app on a finished day does not replay someone else's
    // celebration, and a second session that day can unlock, add and re-lock.
    var startBtn = document.getElementById("startWorkout");
    if (startBtn) {
      startBtn.addEventListener("click", function () {
        d.workoutStart = Date.now();
        touch(key); save(); render();
      });
    }

    // A mis-tap at nine in the morning should not become a six hour session,
    // so a running clock can be thrown away — with undo, like every other
    // destructive thing in the app.
    var discardBtn = document.getElementById("discardWorkout");
    if (discardBtn) {
      discardBtn.addEventListener("click", function () {
        var was = d.workoutStart;
        delete d.workoutStart;
        touch(key); save(); render();
        offerUndo("Discarded the running timer", function () {
          day(key).workoutStart = was;
          touch(key); save(); render();
        });
      });
    }

    // One interval, restarted on every draw and stopped when nothing needs it.
    // It writes into the clock element rather than calling render(), because a
    // full redraw once a second would fight anything being typed.
    if (workoutTick) { clearInterval(workoutTick); workoutTick = null; }
    if (d.workoutStart) {
      workoutTick = setInterval(function () {
        var el = document.getElementById("workoutClock");
        if (!el) { clearInterval(workoutTick); workoutTick = null; return; }
        var run = workoutMs(day(key));
        // Crossing the bound changes the bar, not just the digits, so hand
        // over to a redraw exactly once instead of every second.
        if (run > MAX_SESSION_MS && !el.closest(".workout").classList.contains("is-stale")) {
          clearInterval(workoutTick); workoutTick = null; render(); return;
        }
        el.textContent = fmtDur(run);
      }, 1000);
    }

    var lockBtn = document.getElementById("lockDay");
    if (lockBtn) {
      lockBtn.addEventListener("click", function () {
        stopWorkout(d);          // the clock stops when the day is called done
        d.gymLocked = true;
        touch(key); save(); render();
        celebrate();
      });
    }
    var unlockBtn = document.getElementById("unlockDay");
    if (unlockBtn) {
      unlockBtn.addEventListener("click", function () {
        delete d.gymLocked;
        touch(key); save(); render();
      });
    }

    view.querySelectorAll("[data-addset]").forEach(function (b) {
      b.addEventListener("click", function () { addSet(Number(b.dataset.addset)); });
    });
    view.querySelectorAll("[data-w], [data-r]").forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") addSet(Number(el.dataset.w !== undefined ? el.dataset.w : el.dataset.r));
      });
    });

    function addSet(i) {
      var w = num(view.querySelector('[data-w="' + i + '"]').value);
      var r = num(view.querySelector('[data-r="' + i + '"]').value);
      if (!r) { view.querySelector('[data-r="' + i + '"]').focus(); return; }
      d.lifts[i].sets.push({ w: w, r: r });
      touch(key); save(); render();
      var next = view.querySelector('[data-w="' + i + '"]');
      if (next) next.focus();
    }

    view.querySelectorAll("[data-set]").forEach(function (b) {
      b.addEventListener("click", function () {
        var li = Number(b.dataset.lift), si = Number(b.dataset.set);
        var lift = d.lifts[li];
        if (!lift || !lift.sets[si]) return;
        var gone = lift.sets[si];
        lift.sets.splice(si, 1);
        touch(key); save(); render();
        offerUndo("Removed " + gone.w + " × " + gone.r + " from " + lift.movement, function () {
          var l2 = day(key).lifts[li];
          if (l2) l2.sets.splice(Math.min(si, l2.sets.length), 0, gone);
          touch(key); save(); render();
        });
      });
    });

    view.querySelectorAll("[data-rmlift]").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = Number(b.dataset.rmlift);
        var gone = d.lifts[i];
        if (!gone) return;
        d.lifts.splice(i, 1);
        touch(key); save(); render();
        offerUndo("Removed " + gone.movement +
          (gone.sets.length ? " and its " + gone.sets.length + " sets" : ""), function () {
          var dd = day(key);
          dd.lifts.splice(Math.min(i, dd.lifts.length), 0, gone);
          touch(key); save(); render();
        });
      });
    });
  }

  function renderCoach() {
    var days = cats();
    var open = coachOpen;

    var dayCards = days.map(function (c, i) {
      var moves = store.moves[c.id] || [];
      var isOpen = open === c.id;

      var chips = moves.slice().sort().map(function (m) {
        return '<button class="rt-chip" data-dropmove="' + esc(c.id) + '|' + esc(m) + '">' +
          '<b>' + esc(m) + '</b><i>✕</i></button>';
      }).join("");

      var lib = LIBRARY.map(function (grp) {
        var buttons = grp.m.map(function (m) {
          var have = moves.indexOf(m) > -1;
          return '<button class="lib-add" data-addmove="' + esc(c.id) + '|' + esc(m) + '"' +
                 (have ? " disabled" : "") + '>' + (have ? "✓ " : "+ ") + esc(m) + '</button>';
        }).join("");
        return '<div class="lib-group"><h4>' + esc(grp.g) + '</h4>' +
               '<div class="rt-chiprow">' + buttons + '</div></div>';
      }).join("");

      return '<article class="rt-day" style="--daycolor:' + c.color + '">' +
        '<button class="rt-head" data-openday="' + esc(c.id) + '" ' +
          'style="width:100%;text-align:left;background:none">' +
          '<span class="nm">' + esc(c.name) + '</span>' +
          '<span class="ct">' + moves.length + (moves.length === 1 ? " movement" : " movements") +
            ' · tap to ' + (isOpen ? "close" : "edit") + '</span>' +
          '<span class="tag">' + c.tag + '</span>' +
        '</button>' +
        (isOpen
          // What you can do to the day sits at the top of the day, not buried
          // under its movement list — you should not have to scroll past a
          // library to rename the thing you just opened.
          ? '<div class="rt-moves">' +
              '<div class="rt-actions">' +
                '<button data-renameday="' + esc(c.id) + '">Rename day</button>' +
                '<button data-newmove="' + esc(c.id) + '">Add your own</button>' +
                (days.length > 1 ? '<button class="danger" data-rmday="' + esc(c.id) + '">Delete day</button>' : '') +
              '</div>' +
              (coachRename === c.id
                ? '<div class="rt-inline">' +
                    '<input class="text" id="rtRename" value="' + esc(c.name) + '" ' +
                      'aria-label="New name for ' + esc(c.name) + '">' +
                    '<button class="btn" id="rtRenameSave">Save</button>' +
                    '<button class="btn ghost" id="rtRenameCancel">Cancel</button>' +
                  '</div>'
                : '') +
              (coachNewMove === c.id
                ? '<div class="rt-inline">' +
                    '<input class="text" id="rtNewMove" placeholder="Name the movement" ' +
                      'aria-label="Name the movement">' +
                    '<button class="btn" id="rtNewMoveSave">Add</button>' +
                    '<button class="btn ghost" id="rtNewMoveCancel">Cancel</button>' +
                  '</div>'
                : '') +
              (chips
                ? '<div class="rt-chiprow">' + chips + '</div>'
                : '<p class="est-note">No movements yet — add your own above, or take one from the library below.</p>') +
              lib +
            '</div>'
          : '') +
      '</article>';
    }).join("");

    view.innerHTML =
      '<section style="display:flex;flex-direction:column;gap:10px">' +
        '<span class="eyebrow">Your routine</span>' +
        '<div class="field"><label for="rtName">Call it what you like</label>' +
          '<input id="rtName" class="text" value="' + esc(store.routine.name || "My split") + '"></div>' +
        '<p class="est-note">These are the days you train. Whatever you build here is what shows up ' +
          'on the Gym tab — rename them, add days, and stock each one with the movements you actually do.</p>' +
      '</section>' +

      '<section style="display:flex;flex-direction:column;gap:12px">' + dayCards + '</section>' +

      (coachAdding
        ? '<section class="rt-inline">' +
            '<input class="text" id="rtNewDay" placeholder="Push, Legs, Walk, Yoga…" ' +
              'aria-label="Name the new day">' +
            '<button class="btn" id="rtNewDaySave">Add</button>' +
            '<button class="btn ghost" id="rtNewDayCancel">Cancel</button>' +
          '</section>'
        : '') +

      '<section class="rt-actions">' +
        '<button id="addDay">+ Add a training day</button>' +
        '<button id="shareRoutine">Share this routine</button>' +
        '<button id="loadRoutine">Load a routine</button>' +
        '<button id="resetRoutine">Start over</button>' +
      '</section>' +

      (coachShare
        ? '<section class="rt-share">' +
            '<p class="est-note">' +
              (coachShare === "share"
                ? 'Send this to whoever is following the routine. They paste it into Load a routine. It carries the days and their movements — never your log.'
                : 'Paste a routine someone sent you. Its days are added to yours, never swapped in, and your own history is untouched.') +
            '</p>' +
            '<textarea id="routineCode" spellcheck="false" ' +
              'placeholder="' + (coachShare === "load" ? "Paste the code here" : "") + '">' +
              (coachShare === "share" ? esc(exportRoutine()) : "") +
            '</textarea>' +
            (coachShareMsg ? '<p class="est-note" id="shareMsg">' + esc(coachShareMsg) + '</p>' : '') +
            '<div class="rt-actions">' +
              (coachShare === "share"
                ? '<button id="copyRoutine">Copy</button>'
                : '<button id="applyRoutine">Add these days</button>') +
              '<button id="closeShare">Close</button>' +
            '</div>' +
          '</section>'
        : '');

    var nameEl = document.getElementById("rtName");
    if (nameEl) {
      var saveName = function () {
        var v = nameEl.value.trim();
        if (v && v !== store.routine.name) { store.routine.name = v; save(); }
      };
      nameEl.addEventListener("change", saveName);
      nameEl.addEventListener("blur", saveName);
    }

    view.querySelectorAll("[data-openday]").forEach(function (b) {
      b.addEventListener("click", function () {
        coachOpen = (coachOpen === b.dataset.openday) ? null : b.dataset.openday;
        render();
      });
    });

    view.querySelectorAll("[data-addmove]").forEach(function (b) {
      b.addEventListener("click", function () {
        var parts = b.dataset.addmove.split("|");
        var list = store.moves[parts[0]] || (store.moves[parts[0]] = []);
        if (list.indexOf(parts[1]) === -1) { list.push(parts[1]); save(); render(); }
      });
    });

    view.querySelectorAll("[data-dropmove]").forEach(function (b) {
      b.addEventListener("click", function () {
        var parts = b.dataset.dropmove.split("|");
        var list = store.moves[parts[0]] || [];
        var i = list.indexOf(parts[1]);
        if (i === -1) return;
        list.splice(i, 1);
        save(); render();
        offerUndo("Removed " + parts[1], function () {
          (store.moves[parts[0]] || []).push(parts[1]); save(); render();
        });
      });
    });

    // Naming happens in a field, not a system dialog. window.prompt is a poor
    // thing to meet on a phone, and it is the one modal this app had left.
    view.querySelectorAll("[data-newmove]").forEach(function (b) {
      b.addEventListener("click", function () {
        coachNewMove = (coachNewMove === b.dataset.newmove) ? null : b.dataset.newmove;
        coachRename = null;
        render();
        var f = document.getElementById("rtNewMove");
        if (f) f.focus();
      });
    });

    view.querySelectorAll("[data-renameday]").forEach(function (b) {
      b.addEventListener("click", function () {
        coachRename = (coachRename === b.dataset.renameday) ? null : b.dataset.renameday;
        coachNewMove = null;
        render();
        var f = document.getElementById("rtRename");
        if (f) { f.focus(); f.select(); }
      });
    });

    function wire(inputId, saveId, cancelId, commit) {
      var input = document.getElementById(inputId);
      var saveBtn = document.getElementById(saveId);
      var cancelBtn = document.getElementById(cancelId);
      if (!input) return;
      function go() { commit(input.value, input); }
      if (saveBtn) saveBtn.addEventListener("click", go);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      if (cancelBtn) {
        cancelBtn.addEventListener("click", function () {
          coachRename = null; coachNewMove = null; coachAdding = false; render();
        });
      }
    }

    wire("rtRename", "rtRenameSave", "rtRenameCancel", function (v, input) {
      if (!renameSplit(coachRename, v)) { input.focus(); return; }
      coachRename = null;
      render();
    });

    wire("rtNewMove", "rtNewMoveSave", "rtNewMoveCancel", function (v, input) {
      var name = (v || "").trim();
      var id = coachNewMove;
      if (!name || !id) { input.focus(); return; }
      var list = store.moves[id] || (store.moves[id] = []);
      if (list.indexOf(name) === -1) list.push(name);
      coachNewMove = null;
      save(); render();
    });

    wire("rtNewDay", "rtNewDaySave", "rtNewDayCancel", function (v, input) {
      var id = addSplit(v);
      if (!id) { input.focus(); return; }
      coachAdding = false;
      coachOpen = id;          // open it, ready to be stocked
      activeCat = id;
      render();
    });

    view.querySelectorAll("[data-rmday]").forEach(function (b) {
      b.addEventListener("click", function () { removeSplit(b.dataset.rmday); });
    });

    document.getElementById("addDay").addEventListener("click", function () {
      coachAdding = !coachAdding;
      coachRename = null; coachNewMove = null;
      render();
      var f = document.getElementById("rtNewDay");
      if (f) f.focus();
    });

    var shareBtn = document.getElementById("shareRoutine");
    if (shareBtn) shareBtn.addEventListener("click", function () {
      coachShare = coachShare === "share" ? null : "share";
      coachShareMsg = ""; render();
    });
    var loadBtn = document.getElementById("loadRoutine");
    if (loadBtn) loadBtn.addEventListener("click", function () {
      coachShare = coachShare === "load" ? null : "load";
      coachShareMsg = ""; render();
      var f = document.getElementById("routineCode");
      if (f) f.focus();
    });
    var closeShare = document.getElementById("closeShare");
    if (closeShare) closeShare.addEventListener("click", function () {
      coachShare = null; coachShareMsg = ""; render();
    });

    var copyRoutine = document.getElementById("copyRoutine");
    if (copyRoutine) copyRoutine.addEventListener("click", function () {
      var box = document.getElementById("routineCode");
      box.select();
      var done = function () {
        copyRoutine.textContent = "Copied";
        setTimeout(function () { copyRoutine.textContent = "Copy"; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(box.value).then(done, function () {
          copyRoutine.textContent = "Press ⌘C / long-press";
        });
      } else { done(); }
    });

    var applyRoutine = document.getElementById("applyRoutine");
    if (applyRoutine) applyRoutine.addEventListener("click", function () {
      var box = document.getElementById("routineCode");
      var payload = parseRoutineCode(box ? box.value : "");
      if (!payload) {
        // Say what is wrong where they are looking, rather than silently doing
        // nothing and leaving them to guess.
        coachShareMsg = "That isn't a routine code. It should start with ILROUTINE1: — copy the whole thing.";
        render();
        return;
      }
      var n = importRoutine(payload);
      if (!n) { coachShareMsg = "That code has no days in it."; render(); return; }
      coachShare = null; coachShareMsg = "";
      render();
    });

    document.getElementById("resetRoutine").addEventListener("click", function () {
      var before = JSON.parse(JSON.stringify({ r: store.routine, m: store.moves }));
      store.routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
      store.routine.days.forEach(function (dy) {
        if (!store.moves[dy.id]) store.moves[dy.id] = (SEED_MOVES[dy.id] || []).slice();
      });
      coachOpen = null;
      save(); render();
      offerUndo("Reset to the starting split", function () {
        store.routine = before.r; store.moves = before.m; save(); render();
      });
    });
  }

  function renderPantry() {
    var list = (store.pantry || []).slice().sort(function (a, b) {
      return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
    });

    var rows = list.map(function (raw) {
      var n = normPantry(raw);
      var bad = n.k && (n.k > 900 || n.p > 90);

      var right = bad ? "check this"
        : n.k ? Math.round(n.k) + ' kcal · ' + Math.round(n.p) + ' g <span style="color:var(--ink-3)">/100 g</span>'
              : Math.round(n.sCal) + ' kcal · ' + Math.round(n.sPro) + ' g <span style="color:var(--ink-3)">/' + esc(n.unit) + '</span>';

      var sub = bad
        ? "Saved as a weight when it isn’t one. Tap Fix and pick the container."
        : (n.kind === "count"
            ? "1 " + n.unit + " · " + Math.round(n.sCal) + " kcal · " + Math.round(n.sPro) + " g protein"
            : n.qty + " " + n.unit + " · " + Math.round(n.sCal) + " kcal · " + Math.round(n.sPro) + " g protein");

      // One tap logs exactly the serving the sub-line describes. A record with
      // impossible numbers gets a spacer instead — logging it would write
      // nonsense into the day, and Fix has to happen first.
      var addBtn = bad
        ? '<span class="add-gap" aria-hidden="true"></span>'
        : '<button class="add" data-addpan="' + raw.id + '" aria-label="Add ' +
            esc(raw.name) + ' to this day">+</button>';

      return '<div class="pan-item"' + (bad ? ' style="background:var(--miss-bg)"' : '') + '>' +
        addBtn +
        '<span class="nm">' + esc(raw.name) + '</span>' +
        '<span class="macros"' + (bad ? ' style="color:var(--miss)"' : '') + '>' + right + '</span>' +
        '<span class="sub"' + (bad ? ' style="color:var(--miss)"' : '') + '>' + esc(sub) + '</span>' +
        '<button class="rm" data-' + (bad ? 'fixpan' : 'rmpan') + '="' + raw.id + '">' +
          (bad ? "Fix" : "Remove") + '</button>' +
      '</div>';
    }).join("");

    var photoBlock = "";
    if (pantryShot && pantryShot.status === "loading") {
      photoBlock = '<div class="working"><i></i>Reading the label…</div>';
    } else if (canReadLabel()) {
      // On the phone the reader is downloaded on first use, so say so rather
      // than leaving someone watching a spinner wondering what is happening.
      var onDevice = !canSendImages;
      photoBlock =
        '<button class="photo-btn" id="shotBtn">📷 Read this label</button>' +
        '<input type="file" id="shotFile" accept="' + esc(imageTypes) + '" capture="environment" hidden>' +
        (pantryShot && pantryShot.status === "error"
          ? '<p class="est-note" style="color:var(--miss)">' + esc(pantryShot.message) + '</p>'
          : '<p class="est-note">Photograph the nutrition panel and the numbers come back filled in below. Check them against the package before saving — small print and glare both cost accuracy.' +
            (onDevice ? ' The reader downloads once on first use, then works offline. The product name is not on the panel, so give it one yourself.' : '') +
            '</p>');
    } else {
      photoBlock = '<p class="est-note">Photo reading isn’t available in this window — type the three numbers off the package instead. Once saved they work everywhere, offline.</p>';
    }

    var f = pantryForm || { name: "", servingG: "", cal: "", pro: "" };

    view.innerHTML =
      '<section style="display:flex;flex-direction:column;gap:12px">' +
        '<span class="eyebrow">Add a food you buy often</span>' +
        photoBlock +
        '<div class="entry">' +
          '<div class="field"><label for="panName">Type and save it</label>' +
            '<input id="panName" class="text" placeholder="What do you usually eat?" value="' + esc(f.name) + '"></div>' +
          '<div class="pair">' +
            '<div class="field"><label for="panServe">One serving is</label>' +
              '<input id="panServe" inputmode="decimal" placeholder="1" value="' + esc(f.servingG) + '"></div>' +
            '<div class="field"><label for="panUnit">Measured in</label>' +
              '<select id="panUnit">' +
                '<optgroup label="Pre-made — no weighing">' +
                  COUNT_UNITS.map(function (u) {
                    return '<option value="' + u + '"' + (f.unit === u ? " selected" : "") + '>' + u + '</option>';
                  }).join("") +
                '</optgroup>' +
                '<optgroup label="By weight">' +
                  ["g", "oz", "lb"].map(function (u) {
                    return '<option value="' + u + '"' + (f.unit === u ? " selected" : "") + '>' + u + '</option>';
                  }).join("") +
                '</optgroup>' +
                '<optgroup label="By volume">' +
                  ["ml", "fl oz"].map(function (u) {
                    return '<option value="' + u + '"' + (f.unit === u ? " selected" : "") + '>' + u + '</option>';
                  }).join("") +
                '</optgroup>' +
              '</select></div>' +
          '</div>' +
          '<div class="pair">' +
            '<div class="field"><label for="panCal">Calories per serving</label>' +
              '<input id="panCal" inputmode="numeric" placeholder="220" value="' + esc(f.cal) + '"></div>' +
            '<div class="field"><label for="panPro">Protein · g</label>' +
              '<input id="panPro" inputmode="numeric" placeholder="34" value="' + esc(f.pro) + '"></div>' +
          '</div>' +
          '<p class="est-note">For anything pre-made, leave it at <strong>1</strong> and pick the container — bottle, bar, can. ' +
            'Only reach for grams or ounces when it’s something you actually portion out yourself, like rice or meat.</p>' +
          '<p class="est-note" id="panWarn" hidden style="color:var(--miss)"></p>' +
          '<button class="btn" id="savePan">Save to pantry</button>' +
        '</div>' +
      '</section>' +

      '<section style="display:flex;flex-direction:column;gap:8px">' +
        '<span class="eyebrow">' + (list.length ? list.length + (list.length === 1 ? ' food saved' : ' foods saved') : 'Nothing saved yet') + '</span>' +
        (rows || '<p class="empty">Foods you save here are matched first — ahead of the built-in reference — every time you describe a meal.</p>') +
      '</section>';

    var shotBtn = document.getElementById("shotBtn");
    if (shotBtn) {
      var shotFile = document.getElementById("shotFile");
      shotBtn.addEventListener("click", function () { shotFile.click(); });
      shotFile.addEventListener("change", function () {
        if (shotFile.files && shotFile.files[0]) readLabel(shotFile.files[0]);
      });
    }

    var FIELD = { panName: "name", panServe: "servingG", panCal: "cal", panPro: "pro", panUnit: "unit" };
    ["panName", "panServe", "panCal", "panPro", "panUnit"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var handler = function () {
        pantryForm = pantryForm || { name: "", servingG: "", cal: "", pro: "", unit: "" };
        pantryForm[FIELD[id]] = el.value;
      };
      el.addEventListener("input", handler);
      el.addEventListener("change", handler);
    });

    view.querySelectorAll("[data-fixpan]").forEach(function (b) {
      b.addEventListener("click", function () {
        var raw = store.pantry.filter(function (x) { return x.id === b.dataset.fixpan; })[0];
        if (!raw) return;
        var n = normPantry(raw);
        // Keep the numbers, drop the bad weight, let him name the container.
        pantryForm = { name: raw.name, servingG: "1", unit: "bottle",
                       cal: String(Math.round(n.sCal)), pro: String(Math.round(n.sPro)) };
        store.pantry = store.pantry.filter(function (x) { return x.id !== b.dataset.fixpan; });
        save(); render();
        var nameEl = document.getElementById("panName");
        if (nameEl) nameEl.scrollIntoView({ block: "center" });
      });
    });

    document.getElementById("savePan").addEventListener("click", function () {
      var name = document.getElementById("panName").value.trim();
      var serve = num(document.getElementById("panServe").value);
      var kcal = num(document.getElementById("panCal").value);
      var pro = Math.max(0, Number(document.getElementById("panPro").value) || 0);
      var warn = document.getElementById("panWarn");
      function complain(msg, focusId) {
        if (warn) { warn.hidden = false; warn.textContent = msg; }
        var el = document.getElementById(focusId);
        if (el) { el.focus(); el.select && el.select(); }
      }
      var unit = document.getElementById("panUnit").value;
      var kind = unitKind(unit);

      if (!name) { complain("Give it a name first.", "panName"); return; }
      if (!serve) { complain("How much is one serving? For anything pre-made that's just 1.", "panServe"); return; }
      if (!kcal) { complain("Calories per serving, straight off the panel.", "panCal"); return; }

      // A gram figure, when the unit gives us one — that's what lets you later
      // ask for this food by weight. Volume is taken at roughly 1 g per ml.
      var serveG = null;
      if (kind === "weight") serveG = serve * WEIGHT_UNITS[unit];
      else if (kind === "volume") serveG = serve * VOLUME_UNITS[unit];

      if (serveG) {
        var per100 = (kcal / serveG) * 100;
        if (per100 > 900 || (pro / serveG) * 100 > 90) {
          complain("That comes to " + Math.round(per100) + " kcal per 100 g, which no food reaches. " +
                   "If this is something pre-made, set it to 1 and pick the container instead of a weight.", "panServe");
          return;
        }
      }
      if (warn) warn.hidden = true;

      store.pantry.push({
        id: uid(),
        name: name,
        serveQty: serve,
        serveUnit: unit,
        serveG: serveG,
        sCal: kcal,
        sPro: pro,
        aliases: []
      });
      pantryForm = null;
      pantryShot = null;
      save(); render();
    });

    // Straight from the pantry into the day, no retyping. It logs against
    // `cursor`, not today, so it matches the Add form and the date in the
    // header rather than quietly disagreeing with both.
    view.querySelectorAll("[data-addpan]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.addpan;
        var raw = null;
        store.pantry.forEach(function (x) { if (x.id === id) raw = x; });
        if (!raw) return;

        var n = normPantry(raw);
        var c = Math.round(n.sCal), p = Math.round(n.sPro);
        var key = ymd(cursor);
        day(key).food.push({ id: uid(), cal: c, pro: p, note: raw.name });
        stampGoal(key);
        touch(key);
        var wrote = save();
        lastAdded = wrote ? { label: raw.name, cal: c, pro: p, at: Date.now() } : null;
        render();

        // render() has just replaced this button, so confirm on the new one.
        // Without this the tap is silent and reads exactly like a dead control.
        var fresh = view.querySelector('[data-addpan="' + id + '"]');
        if (fresh) {
          fresh.textContent = wrote ? "✓" : "!";
          if (wrote) fresh.classList.add("is-done");
          setTimeout(function () {
            var later = view.querySelector('[data-addpan="' + id + '"]');
            if (later && (later.textContent === "✓" || later.textContent === "!")) {
              later.textContent = "+";
              later.classList.remove("is-done");
            }
          }, 1400);
        }
      });
    });

    view.querySelectorAll("[data-rmpan]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.rmpan;
        var idx = -1;
        store.pantry.forEach(function (x, i) { if (x.id === id) idx = i; });
        if (idx === -1) return;
        var gone = store.pantry[idx];
        store.pantry.splice(idx, 1);
        save(); render();
        offerUndo("Removed " + gone.name + " from your pantry", function () {
          store.pantry.splice(Math.min(idx, store.pantry.length), 0, gone);
          save(); render();
        });
      });
    });
  }

  // ---------- reading a nutrition panel without Claude ----------
  // Inside the Claude viewer the sample capability reads the panel and can even
  // give the product name. On the phone there is no capability, so the panel is
  // read on the device with Tesseract, lazily: nothing here is fetched until
  // the button is actually pressed, so the app's offline core stays 150 KB.
  // Once fetched the service worker keeps it, and scanning works offline too.
  var OCR_DIR = "vendor/tesseract/";
  var ocrLib = null;

  function ocrAvailable() {
    // same gate as the service worker: vendor/ only exists on the hosted copy
    return /^https?:$/.test(location.protocol) &&
           !!document.querySelector('link[rel="manifest"]');
  }
  function canReadLabel() { return canSendImages || ocrAvailable(); }

  function loadOcr() {
    if (ocrLib) return Promise.resolve(ocrLib);
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = OCR_DIR + "tesseract.min.js";
      s.onload = function () { ocrLib = window.Tesseract; ocrLib ? resolve(ocrLib) : reject(new Error("load")); };
      s.onerror = function () { reject(new Error("offline")); };
      document.head.appendChild(s);
    });
  }

  // The calorie figure is the one thing on a panel printed far larger than
  // everything else, so it is found by size and position rather than by
  // reading order — OCR splits "190" into separate digit-words and puts them
  // wherever it likes in the text. Everything else is read off its own line.
  function readPanel(words, text) {
    var out = { calories: 0, protein: 0, servingGrams: 0 };
    var nums = words.filter(function (w) { return /^\d{1,4}$/.test(w.t.replace(/,/g, "")); });
    if (nums.length) {
      var tall = nums.reduce(function (a, b) { return b.h > a.h ? b : a; });
      var band = nums.filter(function (w) {
        return w.h >= tall.h * 0.75 && Math.abs(w.y - tall.y) <= tall.h * 0.6;
      }).sort(function (a, b) { return a.x - b.x; });
      var joined = Number(band.map(function (w) { return w.t; }).join(""));
      if (joined >= 5 && joined <= 2000) out.calories = joined;
    }
    var t = String(text || "").replace(/\r/g, "");
    var pm = t.match(/protein[^0-9]{0,14}(\d+(?:\.\d+)?)\s*g/i);
    if (pm) out.protein = Number(pm[1]);
    // "(60g)" comes back as "(609)" on a blurry panel often enough to allow it
    var sm = t.match(/serving size[^\n]*?\(\s*(\d+(?:\.\d+)?)\s*[g9]\s*\)/i);
    if (sm) out.servingGrams = Number(sm[1]);
    return out;
  }

  function readLabelOnDevice(file) {
    pantryShot = { status: "loading" };
    render();
    var worker = null;
    loadOcr().then(function (T) {
      return T.createWorker("eng", 1, {
        workerPath: OCR_DIR + "worker.min.js",
        corePath: OCR_DIR,
        langPath: OCR_DIR
      });
    }).then(function (w) {
      worker = w;
      return w.recognize(file, {}, { blocks: true });
    }).then(function (r) {
      var words = [];
      (r.data.blocks || []).forEach(function (bl) {
        (bl.paragraphs || []).forEach(function (pa) {
          (pa.lines || []).forEach(function (ln) {
            (ln.words || []).forEach(function (wd) {
              words.push({ t: wd.text, x: wd.bbox.x0, y: wd.bbox.y0,
                           h: wd.bbox.y1 - wd.bbox.y0 });
            });
          });
        });
      });
      var got = readPanel(words, r.data.text);
      if (worker) worker.terminate();
      if (!got.calories && !got.protein) {
        pantryShot = { status: "error", message: "Couldn't read that panel. Try a straighter, closer shot in better light — or type the numbers in below." };
      } else {
        // Anything it could not read is left empty rather than guessed at. A
        // panel is full of numbers bigger than the calorie count — sodium in
        // mg, carbs, every % daily value — so a "take the largest" fallback
        // would confidently log the wrong one.
        pantryForm = {
          name: "",
          servingG: got.servingGrams > 0 ? String(got.servingGrams) : "1",
          unit: got.servingGrams > 0 ? "g" : "bottle",
          cal: got.calories ? String(got.calories) : "",
          pro: got.protein ? String(got.protein) : ""
        };
        pantryShot = (got.calories && got.protein) ? null
          : { status: "error", message: "Read what it could — fill in the blanks and give it a name before saving." };
      }
      render();
    }).catch(function (e) {
      if (worker) { try { worker.terminate(); } catch (x) {} }
      pantryShot = { status: "error", message: (e && e.message === "offline")
        ? "The label reader needs a connection the first time. Once it has loaded once it works offline."
        : "Couldn't read that panel. Type the numbers in below." };
      render();
    });
  }

  function readLabel(file) {
    // Claude reads it better and can name the product, so prefer it when the
    // app is running somewhere that has it.
    if (!sampleFn || !canSendImages) return readLabelOnDevice(file);
